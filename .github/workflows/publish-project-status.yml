name: Reconcile Project Status Sheet

on:
  push:
    branches: [main]
  schedule:
    # Recovery path: make the UUID-keyed Sheet mirror converge even if a push
    # delivery, GitHub Action, receiver, or Apps Script attempt was transiently unavailable.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Explicit recovery operation against current authoritative main"
        required: true
        type: choice
        options:
          - reconcile-current-state

permissions:
  contents: read

# A newer run supersedes an older snapshot. The receiver still rejects lower
# per-project revisions, protecting the mirror if a cancelled run was already
# in flight when it reached the receiver.
concurrency:
  group: mynx-sheet-current-state-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    # This is the only live publisher. Local development hosts prepare or
    # validate repository state but never need the sheet-production secrets.
    if: >-
      github.repository == 'Resivore/Mynx-Flavoured-Workbench' &&
      (github.event_name != 'workflow_dispatch' || inputs.operation == 'reconcile-current-state') &&
      vars.MYNX_SHEET_CUTOVER == 'authorized'
    runs-on: ubuntu-latest
    environment: sheet-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve current authoritative main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --detach origin/main
      - name: Prepare current-state reconciliation
        run: >-
          python tools/sheet_sync.py reconcile-current-state-plan
          --root .
          --repository "${{ github.repository }}"
          --ref "refs/heads/main"
          --output status-current-state-reconciliation-plan.json
      - name: Publish independently valid project rows
        env:
          MYNX_SHEET_CUTOVER: ${{ vars.MYNX_SHEET_CUTOVER }}
          MYNX_SHEET_RECEIVER_URL: ${{ secrets.MYNX_SHEET_RECEIVER_URL }}
          MYNX_SHEET_HMAC_SECRET: ${{ secrets.MYNX_SHEET_HMAC_SECRET }}
        run: >-
          python tools/sheet_sync.py publish
          --root .
          --plan status-current-state-reconciliation-plan.json
