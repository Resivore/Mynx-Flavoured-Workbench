name: Codex apply dependency policy source checkpoint

on:
  push:
    branches:
      - codex/dependency-policy-promotion-staging-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Repair staging apply workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and apply exact local source patch
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/codex-apply-dependency-policy.yml \
            | awk '/^H4sIA/{capture=1} capture && /^PATCH$/{exit} capture{print}' \
            > /tmp/source.patch.gz.b64
          base64 --decode /tmp/source.patch.gz.b64 | gzip --decompress > /tmp/source.patch
          echo '76d68f5579cf2156f105aae32aa26c795b3a2a048b4ff64b7aae7277fb6eb782  /tmp/source.patch' | sha256sum --check
          git apply --index --whitespace=error /tmp/source.patch
          git rm .github/workflows/codex-apply-dependency-policy.yml
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'Implement universal dependency policy and Slab Decorations C3 source'
          git push origin HEAD:codex/dependency-policy-promotion-staging-20260902
