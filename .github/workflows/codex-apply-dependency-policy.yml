name: Codex apply dependency policy source checkpoint

on:
  push:
    branches:
      - codex/dependency-policy-promotion-staging-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Recover dependency policy source heredoc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and apply exact local source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import pathlib
          import subprocess

          source = subprocess.check_output([
              "git", "show",
              "35c4c4d8bc2acc48d1beb4207d040b2738f250a4:.github/workflows/codex-apply-dependency-policy.yml",
          ], text=True)
          lines = source.splitlines()
          start = next(
              index + 1
              for index, line in enumerate(lines)
              if "cat > /tmp/source.patch.gz.b64 <<'PATCH'" in line
          )
          end = next(
              index
              for index in range(start, len(lines))
              if lines[index].strip() == "PATCH"
          )
          encoded = "".join(line.strip() for line in lines[start:end])
          compressed = base64.b64decode(encoded, validate=True)
          pathlib.Path("/tmp/source.patch").write_bytes(gzip.decompress(compressed))
          PY
          echo '76d68f5579cf2156f105aae32aa26c795b3a2a048b4ff64b7aae7277fb6eb782  /tmp/source.patch' | sha256sum --check
          git apply --index --whitespace=error /tmp/source.patch
          git rm .github/workflows/codex-apply-dependency-policy.yml
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'Implement universal dependency policy and Slab Decorations C3 source'
          git push origin HEAD:codex/dependency-policy-promotion-staging-20260902
