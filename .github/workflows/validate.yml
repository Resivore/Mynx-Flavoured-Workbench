name: Validate Workbench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and Python contracts
        run: |
          python tools/workbench.py validate-repository --root .
          python -m unittest discover -s tests -v
