name: Deploy Mynx Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python tools/workbench.py validate-repository --root .
      - name: Test dashboard generator
        run: python -m unittest discover -s tests -p "test_workbench_dashboard.py" -v
      - name: Generate public dashboard
        run: |
          mkdir -p _site
          python tools/workbench_dashboard.py --root . --output _site/index.html --source-commit "${GITHUB_SHA}" --source-label main
          test -f _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
