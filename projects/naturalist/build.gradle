    compileOnly "maven.modrinth:field-guide:${project.field_guide_fabric_version}"

    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'org.jspecify:jspecify:1.0.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['common/src/main/java', 'fabric/src/main/java']
        }
        resources {
            srcDirs = [
                    'src/main/resources', stagedOriginalResources,
                    stagedLegacySpawnEggResources, generatedItemModelResources
            ]
        }
    }
    persistenceTest {
        java {
            srcDirs = ['common/src/main/java', 'src/persistenceTest/java']
            include 'com/crispytwig/naturalist/server/entity/persistence/NaturalistEntityPersistence.java'
            include 'com/crispytwig/naturalist/persistence/**'
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    itemModelTest {
        java {
            srcDirs = ['common/src/main/java', 'src/itemModelTest/java']
            include 'com/crispytwig/naturalist/client/model/item/ItemModelOverrides.java'
            include 'com/crispytwig/naturalist/client/model/item/LegacyItemModelResources.java'
            include 'com/crispytwig/naturalist/client/model/item/NaturalistItemModelProperties.java'
            include 'com/crispytwig/naturalist/itemmodel/**'
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    startupTest {
        java.srcDir 'src/startupTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        // Prove the gate can load and run without either optional provider.
        runtimeClasspath += output + compileClasspath.filter {
            !it.name.startsWith('field-guide-') && !it.name.startsWith('lambdynamiclights-')
        }
    }
    glowGoopTest {
        java.srcDir 'src/glowGoopTest/java'
        // Use production classes with only NaturalistRegistry replaced by the small
        // test holder fixture. Exclude main resources to avoid unrelated mod bootstrap.
        compileClasspath += sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath.filter {
            !it.name.startsWith('field-guide-') && !it.name.startsWith('lambdynamiclights-')
        }
    }
    resourceCodecTest {
        java.srcDir 'src/resourceCodecTest/java'
        resources {
            srcDir stagedOriginalResources
            include 'META-INF/services/**'
        }
        compileClasspath += sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath.filter {
            !it.name.startsWith('field-guide-') && !it.name.startsWith('lambdynamiclights-')
        }
    }
    lifecycleTest {
        java.srcDir 'src/lifecycleTest/java'
        resources {
            srcDirs = ['src/lifecycleTest/resources', stagedOriginalResources]
            include 'fabric.mod.json', 'naturalist.lifecycle*.json'
            include 'META-INF/services/**'
        }
        compileClasspath += sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath.filter {
            !it.name.startsWith('field-guide-') && !it.name.startsWith('lambdynamiclights-')
        }
    }
}

