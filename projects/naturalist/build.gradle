tasks.register('verifyOriginalJar') {
    group = 'naturalist port'
    description = 'Verifies the immutable Naturalist 2.0.3 input before protected resources are read.'
    inputs.file(originalJar)
    doLast {
        File input = originalJar.get()
        if (!input.isFile()) {
            throw new GradleException("Missing Naturalist original: ${input}. Set -PnaturalistOriginalJar=<absolute path> when building from an isolated worktree.")
        }

        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        input.withInputStream { stream ->
            byte[] buffer = new byte[1024 * 1024]
            for (int read = stream.read(buffer); read != -1; read = stream.read(buffer)) {
                digest.update(buffer, 0, read)
            }
        }
        String actual = digest.digest().collect { String.format('%02x', it) }.join()
        if (!actual.equalsIgnoreCase(project.upstream_original_sha256)) {
            throw new GradleException("Naturalist original SHA-256 mismatch: expected ${project.upstream_original_sha256}, got ${actual}")
        }
    }
}

tasks.register('stageOriginalResources', Sync) {
    group = 'naturalist port'
    description = 'Stages protected upstream resources from the verified original into ignored build output.'
    dependsOn tasks.named('verifyOriginalJar')
    inputs.file 'gradle/migrate-private-resources.gradle'
    from({ zipTree(originalJar.get()) }) {
        exclude '**/*.class'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'fabric.mod.json'
        exclude 'architectury_inject_*/**'
    }
    into stagedOriginalResources
    doLast {
        // Patch only the private staged configuration; keep the pristine input immutable.
        File configFile = stagedOriginalResources.get().file('naturalist.fieldguide.mixins.json').asFile
        def config = new JsonSlurper().parse(configFile)
        config.plugin = 'com.crispytwig.naturalist.fabric.compat.FieldGuideMixinPlugin'
        configFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(config)) + '\n', 'UTF-8')
        File mainMixinFile = stagedOriginalResources.get().file('naturalist.mixins.json').asFile
        def mainMixins = new JsonSlurper().parse(mainMixinFile)
        if (!mainMixins.mixins.contains('CreativeItemStackIdentityMixin')) mainMixins.mixins.add('CreativeItemStackIdentityMixin')
        mainMixinFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(mainMixins)) + '\n', 'UTF-8')
        migrateNaturalistResources(stagedOriginalResources.get().asFile)
    }
}

tasks.register('verifyLegacySpawnEggResources') {
    group = 'naturalist port'
    description = 'Verifies the exact Minecraft 1.21.1 spawn-egg template resources used by the preserved color tuples.'
    inputs.property 'naturalistLegacyMinecraftJar', legacyMinecraftJarPath.orElse('')

    doLast {
        if (!legacyMinecraftJarPath.isPresent()) {
            throw new GradleException('Missing Minecraft 1.21.1 client input. Set -PnaturalistLegacyMinecraftJar=<absolute path>.')
        }

        File input = file(legacyMinecraftJarPath.get())
        if (!input.isFile()) {
            throw new GradleException("Missing Minecraft 1.21.1 client input: ${input}")
        }

        java.util.zip.ZipFile zip = new java.util.zip.ZipFile(input)
        try {
            legacySpawnEggResourceHashes.each { resourcePath, expectedHash ->
                java.util.zip.ZipEntry entry = zip.getEntry(resourcePath)
                if (entry == null) {
                    throw new GradleException("Minecraft 1.21.1 client input is missing ${resourcePath}")
                }

                MessageDigest digest = MessageDigest.getInstance('SHA-256')
                zip.getInputStream(entry).withCloseable { stream ->
                    byte[] buffer = new byte[1024 * 1024]
                    for (int read = stream.read(buffer); read != -1; read = stream.read(buffer)) {
                        digest.update(buffer, 0, read)
                    }
                }
                String actualHash = digest.digest().collect { String.format('%02x', it) }.join()
                if (!actualHash.equalsIgnoreCase(expectedHash)) {
                    throw new GradleException("Legacy spawn-egg resource SHA-256 mismatch for ${resourcePath}: expected ${expectedHash}, got ${actualHash}")
                }
            }
        }
        finally {
            zip.close()
        }
    }
}

tasks.register('stageLegacySpawnEggResources', Sync) {
    group = 'naturalist port'
    description = 'Stages only the verified Minecraft 1.21.1 spawn-egg template into ignored build output.'
    dependsOn tasks.named('verifyLegacySpawnEggResources')
    from({
        if (!legacyMinecraftJarPath.isPresent()) {
            throw new GradleException('Missing Minecraft 1.21.1 client input. Set -PnaturalistLegacyMinecraftJar=<absolute path>.')
        }
        zipTree(file(legacyMinecraftJarPath.get()))
    }) {
        legacySpawnEggResourceHashes.keySet().each { include it }
    }
    into stagedLegacySpawnEggResources
}

tasks.register('generateItemModelCompatibilityResources') {
    group = 'naturalist port'
    description = 'Generates Minecraft 26.2 client-item roots for protected legacy dynamic and spawn-egg models.'
    inputs.property 'dynamicClientItemModelIds', dynamicClientItemModelIds
    inputs.file naturalistRegistrySource
    outputs.dir generatedItemModelResources

    doLast {
        File outputRoot = generatedItemModelResources.get().asFile
        delete outputRoot
        dynamicClientItemModelIds.each { itemId ->
            File output = new File(outputRoot, "assets/naturalist/items/${itemId}.json")
            output.parentFile.mkdirs()
            output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                    model: [
                            type : 'minecraft:model',
                            model: "naturalist:item/${itemId}"
                    ]
            ])) + System.lineSeparator(), 'UTF-8')
        }

        String registrySource = naturalistRegistrySource.asFile.getText('UTF-8')
        def spawnEggPattern = ~/(?s)registerItem\("([a-z0-9_]+_spawn_egg)",\s*properties\s*->\s*Services\.REGISTRY\.createSpawnEgg\([^,]+,\s*(\d+),\s*(\d+),\s*properties\)\)/
        def spawnEggMatches = registrySource =~ spawnEggPattern
        Map<String, List<Integer>> spawnEggColors = new LinkedHashMap<>()
        spawnEggMatches.each { match ->
            String itemId = match[1]
            int primaryRgb = Integer.parseInt(match[2])
            int secondaryRgb = Integer.parseInt(match[3])
            if (spawnEggColors.put(itemId, [primaryRgb, secondaryRgb]) != null) {
                throw new GradleException("Duplicate Naturalist spawn-egg color registration: ${itemId}")
            }
        }
        if (spawnEggColors.size() != 46) {
            throw new GradleException("Expected 46 retained Naturalist spawn-egg color registrations, found ${spawnEggColors.size()}")
        }

        spawnEggColors.each { itemId, colors ->
            colors.each { color ->
                if (color < 0 || color > 0xFFFFFF) {
                    throw new GradleException("Naturalist spawn-egg RGB value is outside 24-bit range for ${itemId}: ${color}")
                }
            }
            int primaryArgb = colors[0] - 0x1000000
            int secondaryArgb = colors[1] - 0x1000000
            File output = new File(outputRoot, "assets/naturalist/items/${itemId}.json")
            output.parentFile.mkdirs()
            output.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                    model: [
                            type : 'minecraft:model',
                            model: "naturalist:item/${itemId}",
                            tints: [
                                    [type: 'minecraft:constant', value: primaryArgb],
                                    [type: 'minecraft:constant', value: secondaryArgb]
                            ]
                    ]
            ])) + System.lineSeparator(), 'UTF-8')
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('stageOriginalResources'), tasks.named('stageLegacySpawnEggResources'),
            tasks.named('generateItemModelCompatibilityResources')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand([
                version: project.version,
                minecraft_version: project.minecraft_version,
                fabric_loader_version: project.fabric_loader_version,
                // The exact build input stays pinned; runtime needs only the provider floor.
                fabric_api_version: project.fabric_api_version.split('\\+')[0]
        ])
    }
}

tasks.configureEach {
    if (name == 'sourcesJar') {
        dependsOn tasks.named('stageOriginalResources'), tasks.named('stageLegacySpawnEggResources'),
                tasks.named('generateItemModelCompatibilityResources')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

tasks.register('persistenceTest', Test) {
    group = 'verification'
    description = 'Runs focused persistence tests without compiling the incomplete Naturalist port.'
    dependsOn tasks.named('persistenceTestClasses')
    testClassesDirs = sourceSets.persistenceTest.output.classesDirs
    classpath = sourceSets.persistenceTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.register('itemModelTest', Test) {
    group = 'verification'
    description = 'Runs focused legacy item-model override parsing and selection tests.'
    dependsOn tasks.named('itemModelTestClasses')
    testClassesDirs = sourceSets.itemModelTest.output.classesDirs
    classpath = sourceSets.itemModelTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.register('startupTest', Test) {
    group = 'verification'
    description = 'Checks the real Minecraft rest descriptor and optional Field Guide mixin gating.'
    dependsOn tasks.named('startupTestClasses')
    testClassesDirs = sourceSets.startupTest.output.classesDirs
    classpath = sourceSets.startupTest.runtimeClasspath
    inputs.dir stagedOriginalResources
    systemProperty 'naturalist.stagedResources', stagedOriginalResources.get().asFile.absolutePath
    systemProperty 'naturalist.originalJar', originalJar.get().absolutePath
    systemProperty 'naturalist.classes', sourceSets.main.output.classesDirs.singleFile.absolutePath
    systemProperty 'naturalist.assetIndex', providers.gradleProperty('naturalistMinecraftAssetIndex')
            .orElse(new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/assets/indexes/26.2-32.json').absolutePath).get()
    useJUnitPlatform()
}

tasks.register('glowGoopTest', Test) {
    group = 'verification'
    description = 'Exercises production Glow Goop registration caches and live held-item selection.'
    dependsOn tasks.named('glowGoopTestClasses'), tasks.named('classes')
    testClassesDirs = sourceSets.glowGoopTest.output.classesDirs
    classpath = sourceSets.glowGoopTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.named('processResourceCodecTestResources') { dependsOn tasks.named('stageOriginalResources') }
tasks.register('resourceCodecTest', Test) {
    group = 'verification'
    description = 'Parses every private staged Naturalist recipe, advancement and loot table with Minecraft codecs.'
    dependsOn tasks.named('resourceCodecTestClasses'), tasks.named('classes')
    testClassesDirs = sourceSets.resourceCodecTest.output.classesDirs
    classpath = sourceSets.resourceCodecTest.runtimeClasspath
    inputs.dir stagedOriginalResources
    systemProperty 'naturalist.stagedResources', stagedOriginalResources.get().asFile.absolutePath
    systemProperty 'naturalist.originalJar', originalJar.get().absolutePath
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn tasks.named('startupTest'), tasks.named('glowGoopTest'), tasks.named('resourceCodecTest'), tasks.named('lifecycleTest')
}

tasks.named('processLifecycleTestResources') { dependsOn tasks.named('stageOriginalResources') }
tasks.register('lifecycleTest', Test) {
    group = 'verification'
    description = 'Checks resource preparation/publication, creative inventory and real entity/goal construction.'
    dependsOn tasks.named('lifecycleTestClasses'), tasks.named('classes')
    exclude '**/mixin/**' // Mixin classes are transformed into targets, never loaded as tests.
    testClassesDirs = sourceSets.lifecycleTest.output.classesDirs
    classpath = sourceSets.lifecycleTest.runtimeClasspath
    inputs.dir stagedOriginalResources
    systemProperty 'naturalist.stagedResources', stagedOriginalResources.get().asFile.absolutePath
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('UPSTREAM_LICENSE.txt') {
        rename { 'UPSTREAM_NATURALIST_LICENSE.txt' }
    }
    manifest {
        attributes([
                'Specification-Title': project.mod_name,
                'Specification-Version': project.upstream_version,
                'Implementation-Title': project.archives_base_name,
                'Implementation-Version': project.version,
                'Naturalist-Source-Commit': sourceCheckpoint.get(),
                'Naturalist-Upstream-Commit': project.upstream_source_commit,
                'Naturalist-Original-SHA256': project.upstream_original_sha256
        ])
    }
}
