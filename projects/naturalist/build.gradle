        'assets/minecraft/textures/item/spawn_egg.png'                 : 'f6b985a0094408770f4b0ba919c2cb6365c6e8b65080334b33617518be2089c1',
        'assets/minecraft/textures/item/spawn_egg_overlay.png'         : 'df0075d5081a1f49f0f4de1e1f004764446ecb3233416f7cd027c58823190747'
]
def naturalistRegistrySource = layout.projectDirectory.file(
        'common/src/main/java/com/crispytwig/naturalist/registry/NaturalistRegistry.java')
