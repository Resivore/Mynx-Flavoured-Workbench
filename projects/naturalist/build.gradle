        'rat', 'scorpion', 'hedgehog', 'snail', 'starfish_bucket',
        'giant_isopod_bucket', 'anglerfish_bucket', 'jellyfish_bucket', 'ray_bucket',
        'blobfish_bucket', 'piranha_bucket', 'knapsack',
