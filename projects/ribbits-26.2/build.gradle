            def actualDonorInputs = donorRecord?.inputs as List
            def actualDonorFilenames = actualDonorInputs?.collect { input ->
                input?.filename?.toString()
            }
            if (donorRecord?.logical_root?.toString() != 'originals/mods' ||
                donorRecord?.private_use_only != true ||
                donorRecord?.redistribution_authorized != false ||
                actualDonorInputs == null || actualDonorInputs.size() != 3 ||
                actualDonorFilenames.toSet() != expectedDonorInputs.keySet()) {
                throw new GradleException('Private manifest lacks the exact read-only donor boundary')
            }
            actualDonorInputs.each { input ->
                def filename = input.filename.toString()
                def expected = expectedDonorInputs[filename]
                def actualMembers = input.approved_members as Map
                if (expected == null ||
                    (input.size as long) != expected.size ||
                    !expected.sha256.equalsIgnoreCase(input.sha256.toString()) ||
                    input.logical_path.toString() != expected.logicalPath ||
                    input.unchanged_after_assembly != true ||
                    actualMembers.keySet() != expected.members.keySet()) {
                    throw new GradleException("Private donor identity or allowlist differs: ${filename}")
                }
                expected.members.each { member, memberIdentity ->
                    def actualMember = actualMembers[member]
                    if (actualMember == null ||
                        (actualMember.size as long) != memberIdentity.size ||
                        !memberIdentity.sha256.equalsIgnoreCase(actualMember.sha256.toString())) {
                        throw new GradleException("Private donor member identity differs: ${member}")
                    }
                }
            }

            def configuredFeatureMigration =
                manifest.migrations?.configured_feature_random_patch_to_sequence
            def expectedConfiguredFeatureTargets = [
