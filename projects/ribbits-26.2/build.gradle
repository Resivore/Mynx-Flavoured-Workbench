def yungsApiJar = System.getenv('YUNGS_API_26_2_JAR')
if (!yungsApiJar) {
    throw new GradleException('Set YUNGS_API_26_2_JAR to the validated YUNG\'s API 26.2 Fabric artifact')
}
def yungsApiFile = file(yungsApiJar)
if (!yungsApiFile.isFile()) {
    throw new GradleException("YUNGS_API_26_2_JAR is not a file: ${yungsApiFile}")
}
def yungsApiDigest = java.security.MessageDigest.getInstance('SHA-256')
yungsApiFile.withInputStream { input ->
    byte[] buffer = new byte[8192]
    int count
    while ((count = input.read(buffer)) != -1) {
        yungsApiDigest.update(buffer, 0, count)
    }
}
def expectedYungsApiSha256 = 'ff22a6b509ba559988d7a9352dc94ac612c4b099517acac7da7c81322d797ed7'
def actualYungsApiSha256 = yungsApiDigest.digest().encodeHex().toString()
if (actualYungsApiSha256 != expectedYungsApiSha256) {
    throw new GradleException("YUNGS_API_26_2_JAR SHA-256 mismatch: expected ${expectedYungsApiSha256}, got ${actualYungsApiSha256}")
}

def acceptedTrinketsFile = file('../trinkets-inventory-extended-compat/artifacts/' +
        'trinkets-4.1.0-beta.3+26.2-inventory-compat-canary5.jar')
if (!acceptedTrinketsFile.isFile()) {
    throw new GradleException("Missing accepted Trinkets Updated artifact: ${acceptedTrinketsFile}")
}
def trinketsDigest = java.security.MessageDigest.getInstance('SHA-256')
acceptedTrinketsFile.withInputStream { input ->
    byte[] buffer = new byte[8192]
    int count
    while ((count = input.read(buffer)) != -1) {
        trinketsDigest.update(buffer, 0, count)
    }
}
def expectedTrinketsSha256 = '4c1fa6ac36c0457483fd0d395b99bbd94c9334aad6defece7633bbf0552d1724'
def actualTrinketsSha256 = trinketsDigest.digest().encodeHex().toString()
if (actualTrinketsSha256 != expectedTrinketsSha256) {
    throw new GradleException("Accepted Trinkets Updated SHA-256 mismatch: expected ${expectedTrinketsSha256}, got ${actualTrinketsSha256}")
}

