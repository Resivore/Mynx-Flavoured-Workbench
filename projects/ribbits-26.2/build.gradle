processResources {
    inputs.property 'version', project.version
    if (privateResourcesDir != null) {
        inputs.dir privateResourcesDir
        inputs.file privateManifestFile
        dependsOn verifyPrivateResources
    }
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
    // The exact 26.2 loot codec is statically bound to the built-in item registry. Give every
    // test class a fresh JVM so its one custom Ribbits item can be registered before that registry
    // is frozen, without weakening the production codec or mutating another suite's bootstrap.
    forkEvery = 1
    systemProperty 'projectRoot', projectDir.absolutePath
    systemProperty 'productionMinecraftJar', productionMinecraftMergedJar.absolutePath
    if (privateResourcesDir != null) {
        systemProperty 'privateResourcesDir', privateResourcesDir.canonicalPath
        dependsOn verifyPrivateResources
    }
    dependsOn 'testPrivateResourceTools'
}

def productionMixinTest = tasks.register('productionMixinTest', JavaExec) {
    group = 'verification'
    description = 'Applies the packaged common mixins to production Minecraft 26.2 server classes without launching Minecraft.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')

    def productionJar = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(productionJar)
    inputs.file(productionMinecraftServerJar)

    mainClass = 'com.yungnickyoung.minecraft.ribbits.mixin.ProductionMixinApplicationHarness'
    classpath = files({
        def mainOutput = sourceSets.main.output.files
        def runtime = configurations.testRuntimeClasspath.files.findAll { candidate ->
            !mainOutput.contains(candidate) &&
                !candidate.name.startsWith('minecraft-merged-deobf-')
        }
        sourceSets.test.output.files.findAll { it.exists() } + runtime +
            [productionMinecraftServerJar, productionJar.get().asFile]
    })
    systemProperty 'fabric.development', 'false'
    systemProperty 'fabric.unitTest', 'true'
    systemProperty 'mixin.debug.verbose', 'true'
    systemProperty 'mixin.debug.countInjections', 'true'

    doFirst {
        if (!productionMinecraftServerJar.isFile()) {
            throw new GradleException(
                "Missing production Minecraft 26.2 server JAR: ${productionMinecraftServerJar}"
            )
        }
        args = [productionJar.get().asFile.absolutePath]
        workingDir.mkdirs()
    }
    workingDir layout.buildDirectory.dir('production-mixin-test')
}

tasks.named('check') {
    dependsOn productionMixinTest
}

tasks.register('testPrivateResourceTools', Exec) {
    group = 'verification'
    description = 'Runs source-safe regression tests for the private resource migration tool.'
    workingDir projectDir
    commandLine pythonExecutable, '-B', '-m', 'unittest', 'discover',
        '-s', 'tools', '-p', 'test_private_resource_tools.py', '-v'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

if (verifyPrivateResources != null) {
    tasks.named('sourcesJar') {
        dependsOn verifyPrivateResources
    }
}

jar {
    from('LICENSE.txt') {
        rename { 'LICENSE_Ribbits' }
    }
    doLast {
        // Loom nests included JARs after Gradle's archive normalization.
        net.fabricmc.loom.util.ZipReprocessorUtil.reprocessZip(
            archiveFile.get().asFile.toPath(), true, false
        )
    }
}

if (privateResourcesDir == null) {
    def verifySourceOnlyArchiveBoundary = tasks.register('verifySourceOnlyArchiveBoundary') {
        group = 'verification'
        description = 'Proves the source-only JAR contains no protected or donor-derived payload.'
        dependsOn tasks.named('jar')

        doLast {
            def archiveFile = tasks.named('jar').get().archiveFile.get().asFile
            def archive = new java.util.zip.ZipFile(archiveFile)
            try {
                def names = []
                def entries = archive.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (!entry.directory) {
                        names.add(entry.name)
                    }
                }
                def duplicateNames = names.countBy { name -> name }
                    .findAll { name, count -> count > 1 }
                    .keySet()
                    .sort()
                if (!duplicateNames.isEmpty()) {
                    throw new GradleException(
                        "Source-only JAR contains duplicate payload paths: ${duplicateNames}"
                    )
                }
                def donorFilenames = [
                    'guardribbits-1.20.1-fabric-1.0.4.jar',
                    'useful_ribbits-1.0.2-forge-1.20.1.jar',
                    'wandering_ribbit-4.0-forge.jar',
                ] as Set
                def reviewedPublicResources = (allowedPublicResources.collect { path ->
                    path.substring('common/src/main/resources/'.length())
                } + ['assets/ribbits/lang/en_us.json']) as Set
                def forbidden = names.findAll { name ->
                    def folded = name.toLowerCase(java.util.Locale.ROOT)
                    def basename = folded.tokenize('/').last()
                    ((folded.startsWith('assets/') || folded.startsWith('data/')) &&
                        !reviewedPublicResources.contains(name)) ||
                        folded == 'icon.png' ||
                        folded == 'logo.png' ||
                        folded.startsWith('sunbatheproductions28/guardribbits/') ||
                        folded.startsWith('me/rogue_one/useful_ribbits/') ||
                        folded.startsWith('assets/wandering_ribbit/') ||
                        folded.startsWith('data/wandering_ribbit/') ||
                        folded.startsWith('com/cosmicbarri/wandering_ribbit/') ||
                        donorFilenames.contains(basename)
                }
                if (!forbidden.isEmpty()) {
                    throw new GradleException(
                        "Source-only JAR contains protected or donor-derived payload: ${forbidden.sort()}"
                    )
                }
                reviewedPublicResources.each { name ->
                    def entry = archive.getEntry(name)
                    if (entry == null || entry.directory) {
                        throw new GradleException("Source-only JAR omits reviewed public resource: ${name}")
                    }
                    def tracked = name == 'assets/ribbits/lang/en_us.json'
                        ? file("common/src/publicResources/${name}")
                        : file("common/src/main/resources/${name}")
                    if (!tracked.isFile()) {
                        throw new GradleException("Reviewed tracked public resource is missing: ${tracked}")
                    }
                    def packagedBytes = archive.getInputStream(entry).withCloseable { input -> input.bytes }
                    if (!java.util.Arrays.equals(packagedBytes, tracked.bytes)) {
                        throw new GradleException(
                            "Source-only public resource changed during packaging: ${name}"
                        )
                    }
                }
            } finally {
                archive.close()
            }
        }
    }
    tasks.named('check') {
        dependsOn verifySourceOnlyArchiveBoundary
    }
}
