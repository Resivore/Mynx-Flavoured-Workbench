plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
}

version = project.mod_version
group = project.maven_group

def privateResourcesPath = System.getenv('RIBBITS_PRIVATE_RESOURCES_DIR')
def privateResourcesDir = privateResourcesPath ? file(privateResourcesPath) : null
def privateManifestPath = System.getenv('RIBBITS_PRIVATE_MANIFEST')
def privateManifestFile = privateManifestPath ? file(privateManifestPath) : null
def pythonExecutable = System.getenv('PYTHON') ?: 'python'

base {
    archivesName = privateResourcesDir != null ? "${project.archives_name}-private-reconstruction" : "${project.archives_name}-source-only"
}

repositories {
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

if ((privateResourcesDir == null) != (privateManifestFile == null)) {
    throw new GradleException(
        'Set RIBBITS_PRIVATE_RESOURCES_DIR and RIBBITS_PRIVATE_MANIFEST together, or leave both unset'
    )
}
if (privateResourcesDir != null && !privateResourcesDir.isDirectory()) {
    throw new GradleException("RIBBITS_PRIVATE_RESOURCES_DIR is not a directory: ${privateResourcesDir}")
}
if (privateResourcesDir != null && (privateManifestFile == null || !privateManifestFile.isFile())) {
    throw new GradleException('Set RIBBITS_PRIVATE_MANIFEST to the assembler manifest when using private resources')
}

def allowedPublicResources = [
    'common/src/main/resources/assets/ribbits/items/glowcap.json',
    'common/src/main/resources/assets/ribbits/items/toadstool_heart.json',
    'common/src/main/resources/data/ribbits/recipe/toadstool_heart.json',
    'common/src/main/resources/data/ribbits/advancement/recipes/misc/toadstool_heart.json',
] as Set
def protectedResourceRoots = [
    file('common/src/main/resources/assets'),
    file('common/src/main/resources/data'),
    file('fabric/src/main/resources/assets'),
    file('fabric/src/main/resources/data'),
]
def unexpectedDefaultResources = protectedResourceRoots.findAll { it.exists() }.collectMany { root ->
    fileTree(root).files.collect { candidate ->
        project.relativePath(candidate).replace('\\', '/')
    }
}.findAll { !allowedPublicResources.contains(it) }
def prohibitedDefaultResourcePaths = [
    'common/src/main/resources/icon.png',
    'common/src/main/resources/logo.png',
    'fabric/src/main/resources/icon.png',
    'fabric/src/main/resources/logo.png',
].findAll { file(it).exists() }
if (!unexpectedDefaultResources.isEmpty() || !prohibitedDefaultResourcePaths.isEmpty()) {
    throw new GradleException(
        "Only reviewed source-safe public resources may exist in default roots: " +
            "unexpected=${unexpectedDefaultResources.sort()}, protected=${prohibitedDefaultResourcePaths}"
    )
}

def verifyPrivateResources = null
if (privateResourcesDir != null) {
    verifyPrivateResources = tasks.register('verifyPrivateResourceManifest') {
        inputs.dir privateResourcesDir
        inputs.file privateManifestFile

        doLast {
            def privatePath = privateResourcesDir.canonicalPath.replace('\\', '/')
            if (!privatePath.contains('/test-builds/private/')) {
                throw new GradleException("Private resources must stay under test-builds/private: ${privateResourcesDir}")
            }

            def manifest = new groovy.json.JsonSlurper().parse(privateManifestFile)
            def expectedPristineSha256 = '4cf86564aed393410fb1dbca3a9ce2425382307655e92bb6b43f3ddcee5bf731'
            if (!expectedPristineSha256.equalsIgnoreCase(manifest.pristine.sha256.toString())) {
                throw new GradleException('Private manifest does not identify the authorized pristine Ribbits JAR')
            }
            if (manifest.schema?.toString() != 'mynx-ribbits-private-resource-manifest/v1' ||
                manifest.classification?.toString() != 'PRIVATE MYNX ASSEMBLY STAGED / NONREDISTRIBUTABLE DONOR ASSETS' ||
                manifest.candidate?.version?.toString() != project.mod_version.toString() ||
                manifest.candidate?.version?.toString() != '4.1.6+26.2-mynx-canary3' ||
                (manifest.candidate?.canary as int) != 3 ||
                manifest.candidate?.private_artifact_filename?.toString() !=
                    'ribbits-private-reconstruction-4.1.6+26.2-mynx-canary3.jar' ||
                manifest.candidate?.source_only_artifact_filename?.toString() !=
                    'ribbits-source-only-4.1.6+26.2-mynx-canary3.jar') {
                throw new GradleException("Private manifest classification is not eligible for private packaging: ${manifest.classification}")
            }
            if ((manifest.blockers as List)) {
                throw new GradleException("Private manifest still contains blockers: ${manifest.blockers}")
            }

            def expectedDonorInputs = [
                'GuardRibbits-1.20.1-Fabric-1.0.4.jar': [
                    size: 166896L,
                    sha256: '52f1e184dc12cf1e29bc224ab5a640b8ea5875aa9f46067c0907c6a45b7d1869',
                    logicalPath: 'originals/mods/GuardRibbits-1.20.1-Fabric-1.0.4.jar',
                    members: [
                        'assets/guardribbits/geo/guard_ribbit.geo.json': [
                            size: 2411L,
                            sha256: 'fe1d3f1df26c4cd3d9107c77008208d5baab3581d897b0c3a2f53b032985a021',
                        ],
                        'assets/guardribbits/textures/entity/guard_ribbit.png': [
                            size: 6490L,
                            sha256: '21bd9bc749885db28ac5d451ebd6cd70e47ce7d3e58bc7ab766cc2d1ba689394',
                        ],
                    ],
                ],
                'useful_ribbits-1.0.2-forge-1.20.1.jar': [
                    size: 416439L,
                    sha256: '2b56007a985b162477113bb2ea1776d9ce2ce602886ea21a88d8b2500d2ded5d',
                    logicalPath: 'originals/mods/useful_ribbits-1.0.2-forge-1.20.1.jar',
                    members: [
                        'assets/useful_ribbits/geo/chef_ribbit.geo.json': [
                            size: 2061L,
                            sha256: 'd3a217da7ff960963ed5b7d7372c18f0ff1186b4629e07f091b75cc585e45ff8',
                        ],
                        'assets/useful_ribbits/textures/entities/chef_ribbit.png': [
                            size: 1538L,
                            sha256: '7648086fa2cfcda4483f6a3bf03348e35a54d267e008991ad54b099dd5a514b9',
                        ],
                        'assets/useful_ribbits/geo/farmer_ribbit.geo.json': [
                            size: 2405L,
                            sha256: 'e1e579469aafa8c5c44e3dd0dcfe73b25881ade91a5bc74cf2b327c9ce4e9822',
                        ],
                        'assets/useful_ribbits/textures/entities/farmer_ribbit.png': [
                            size: 1542L,
                            sha256: '376f1a12cd16ffc536fd9d217dd987ec43dfcf0a7cff819fd37aa74af211e0cd',
                        ],
                        'assets/useful_ribbits/geo/miner_ribbit.geo.json': [
                            size: 2704L,
                            sha256: '63c4f8391d0261119497555388995b9140bce386dd1b3d3d0fb5447a4c5ffcfd',
                        ],
                        'assets/useful_ribbits/textures/entities/miner_ribbit.png': [
                            size: 1448L,
                            sha256: '429593b57ad873fea108c27983eec7c64fd9413d18afb837884b0c0a34b91330',
                        ],
                    ],
                ],
            ]
            def donorRecord = manifest.read_only_donors
            def actualDonorInputs = donorRecord?.inputs as List
            def actualDonorFilenames = actualDonorInputs?.collect { input ->
                input?.filename?.toString()
            }
            if (donorRecord?.logical_root?.toString() != 'originals/mods' ||
                donorRecord?.private_use_only != true ||
                donorRecord?.redistribution_authorized != false ||
                actualDonorInputs == null || actualDonorInputs.size() != 2 ||
                actualDonorFilenames.toSet() != expectedDonorInputs.keySet()) {
                throw new GradleException('Private manifest lacks the exact read-only donor boundary')
            }
            actualDonorInputs.each { input ->
                def filename = input.filename.toString()
                def expected = expectedDonorInputs[filename]
                def actualMembers = input.approved_members as Map
                if (expected == null ||
                    (input.size as long) != expected.size ||
                    !expected.sha256.equalsIgnoreCase(input.sha256.toString()) ||
                    input.logical_path.toString() != expected.logicalPath ||
                    input.unchanged_after_assembly != true ||
                    actualMembers.keySet() != expected.members.keySet()) {
                    throw new GradleException("Private donor identity or allowlist differs: ${filename}")
                }
                expected.members.each { member, memberIdentity ->
                    def actualMember = actualMembers[member]
                    if (actualMember == null ||
                        (actualMember.size as long) != memberIdentity.size ||
                        !memberIdentity.sha256.equalsIgnoreCase(actualMember.sha256.toString())) {
                        throw new GradleException("Private donor member identity differs: ${member}")
                    }
                }
            }

            def configuredFeatureMigration =
                manifest.migrations?.configured_feature_random_patch_to_sequence
            def expectedConfiguredFeatureTargets = [
                'ribbits:giant_lilypad_patch',
                'ribbits:swamp_daisy_patch',
                'ribbits:toadstool_patch',
                'ribbits:umbrella_leaf_patch',
                'ribbits:veg_patch',
            ]
            if (configuredFeatureMigration == null ||
                !(configuredFeatureMigration.count instanceof Integer) ||
                configuredFeatureMigration.count != expectedConfiguredFeatureTargets.size() ||
                configuredFeatureMigration.from_feature_type.toString() != 'minecraft:random_patch' ||
                configuredFeatureMigration.to_feature_type.toString() != 'minecraft:sequence' ||
                (configuredFeatureMigration.targets as List) != expectedConfiguredFeatureTargets) {
                throw new GradleException(
                    'Private manifest lacks the exact five-target random-patch-to-sequence migration contract'
                )
            }

            def spawnEgg = manifest.authorized_spawn_egg_substitution
            def expectedSourceHash = '23962914851db6e2f7f346e80bf412d8f6e1435e6cd54b73dd5ccbec1a50eccf'
            def expectedOutputHash = '53eb7f9d59457b2cd38a5bf65c10c78ac0721da2123f37ce2f48c4d3e1dc1ed1'
            def expectedMinecraftClientSize = 37396380
            def expectedMinecraftClientHash = '200d673e028d27ddb22bd2d365fbcb98b55be4b2043ee52681a8f30812c12cfe'
            def expectedConsumers = [
                'ribbit_nitwit_spawn_egg',
                'ribbit_fisherman_spawn_egg',
                'ribbit_gardener_spawn_egg',
                'ribbit_merchant_spawn_egg',
                'ribbit_sorcerer_spawn_egg',
                'ribbit_chef_spawn_egg',
                'ribbit_farmer_spawn_egg',
                'ribbit_prospector_spawn_egg',
                'ribbit_guard_spawn_egg',
            ]
            if (spawnEgg == null ||
                spawnEgg.temporary != true ||
                spawnEgg.exact_ribbits_4_1_6_visual_parity != false ||
                spawnEgg.behavior_changed != false ||
                spawnEgg.source.minecraft_version.toString() != '26.2' ||
                (spawnEgg.source.client_jar_size as long) != expectedMinecraftClientSize ||
                !expectedMinecraftClientHash.equalsIgnoreCase(spawnEgg.source.client_jar_sha256.toString()) ||
                spawnEgg.source.entry.toString() != 'assets/minecraft/textures/item/frog_spawn_egg.png' ||
                !expectedSourceHash.equalsIgnoreCase(spawnEgg.source.sha256.toString()) ||
                (spawnEgg.source.dimensions as List) != [16, 16] ||
                spawnEgg.transformation.kind.toString() != 'palette-only recolor' ||
                spawnEgg.transformation.pixel_indices_and_alpha.toString() != 'byte-identical to the vanilla source' ||
                spawnEgg.output.entry.toString() != 'assets/ribbits/textures/item/ribbit_spawn_egg.png' ||
                !expectedOutputHash.equalsIgnoreCase(spawnEgg.output.sha256.toString()) ||
                (spawnEgg.output.dimensions as List) != [16, 16] ||
                (spawnEgg.consumers as List) != expectedConsumers ||
                spawnEgg.model.parent.toString() != 'minecraft:item/generated' ||
                spawnEgg.model.textures.layer0.toString() != 'ribbits:item/ribbit_spawn_egg') {
                throw new GradleException('Private manifest lacks the exact authorized temporary spawn-egg substitution contract')
            }
            if (file(manifest.output.path).canonicalFile != privateResourcesDir.canonicalFile) {
                throw new GradleException('Private manifest output path does not match RIBBITS_PRIVATE_RESOURCES_DIR')
            }

            def expectedFiles = manifest.output.files as Map
            def expectedConfiguredFeaturePaths = expectedConfiguredFeatureTargets.collect { target ->
                "data/ribbits/worldgen/configured_feature/${target.substring('ribbits:'.length())}.json".toString()
            }
            if ((manifest.pristine.selected_file_count as int) != 287 ||
                (manifest.output.file_count as int) != 336 ||
                expectedFiles.size() != 336) {
                throw new GradleException('Private manifest does not preserve the exact 287-input / 336-output contract')
            }

            def professionDonors = [
                chef: [
                    archive: 'useful_ribbits-1.0.2-forge-1.20.1.jar',
                    model: 'assets/useful_ribbits/geo/chef_ribbit.geo.json',
                    texture: 'assets/useful_ribbits/textures/entities/chef_ribbit.png',
                ],
                farmer: [
                    archive: 'useful_ribbits-1.0.2-forge-1.20.1.jar',
                    model: 'assets/useful_ribbits/geo/farmer_ribbit.geo.json',
                    texture: 'assets/useful_ribbits/textures/entities/farmer_ribbit.png',
                ],
                prospector: [
                    archive: 'useful_ribbits-1.0.2-forge-1.20.1.jar',
                    model: 'assets/useful_ribbits/geo/miner_ribbit.geo.json',
                    texture: 'assets/useful_ribbits/textures/entities/miner_ribbit.png',
                ],
                guard: [
                    archive: 'GuardRibbits-1.20.1-Fabric-1.0.4.jar',
                    model: 'assets/guardribbits/geo/guard_ribbit.geo.json',
                    texture: 'assets/guardribbits/textures/entity/guard_ribbit.png',
                ],
            ]
            def expectedDerivedSources = [:]
            professionDonors.each { profession, donor ->
                expectedDerivedSources["assets/ribbits/geckolib/models/${profession}_ribbit.geo.json"] = [
                    [archive: donor.archive, member: donor.model],
                ]
                expectedDerivedSources["assets/ribbits/textures/entity/${profession}_ribbit.png"] = [
                    [archive: donor.archive, member: donor.texture],
                    [archive: 'Ribbits-1.21.1-Fabric-4.1.6.jar', member: 'assets/ribbits/textures/entity/ribbit.png'],
                ]
                (1..3).each { variant ->
                    expectedDerivedSources[
                        "assets/ribbits/geckolib/models/umbrella/${profession}/umbrella_${variant}.geo.json"
                    ] = [
                        [archive: donor.archive, member: donor.model],
                        [
                            archive: 'Ribbits-1.21.1-Fabric-4.1.6.jar',
                            member: "assets/ribbits/geo/umbrella/nitwit/umbrella_${variant}.geo.json",
                        ],
                    ]
                }
            }
            def actualDerivedOutputs = donorRecord.derived_outputs as List
            def actualDerivedByPath = actualDerivedOutputs.collectEntries { record ->
                [(record.output.toString()): record]
            }
            if ((donorRecord.derived_output_count as int) != 20 ||
                actualDerivedOutputs.size() != 20 ||
                actualDerivedByPath.keySet() != expectedDerivedSources.keySet()) {
                throw new GradleException('Private manifest donor-derived output accounting differs')
            }
            expectedDerivedSources.each { outputPath, expectedSources ->
                def actualSources = (actualDerivedByPath[outputPath].sources as List).collect { source ->
                    [archive: source.archive.toString(), member: source.member.toString()]
                }
                if (actualSources != expectedSources) {
                    throw new GradleException("Private donor provenance differs for ${outputPath}")
                }
            }

            def lootMigration = manifest.migrations?.private_loot_tables_repaired
            def expectedLootTables = [
                'data/ribbits/loot_table/chests/fisherman_main.json',
                'data/ribbits/loot_table/chests/sorcerer.json',
            ]
            if ((lootMigration?.tables as List) != expectedLootTables ||
                (lootMigration?.air_item_entries_replaced_with_empty as int) != 2 ||
                lootMigration?.replacement?.invalid_item_id?.toString() != 'minecraft:air' ||
                lootMigration?.replacement?.faithful_entry_type?.toString() != 'minecraft:empty' ||
                (lootMigration?.sorcerer_potion_loot_functions_migrated as int) != 1) {
                throw new GradleException('Private manifest lacks the exact two-table loot repair contract')
            }
            def glowcapMigration = lootMigration?.glowcap_currency_substitution
            def expectedGlowcapTargets = [
                ['data/ribbits/loot_table/chests/fisherman_storage.json', 0, 7, 5, 1.0, 3.0],
                ['data/ribbits/loot_table/chests/gardener.json', 0, 3, 3, 1.0, 2.0],
                ['data/ribbits/loot_table/chests/merchant.json', 0, 0, 8, 2.0, 4.0],
                ['data/ribbits/loot_table/chests/nitwit.json', 0, 3, 3, 1.0, 3.0],
                ['data/ribbits/loot_table/chests/sorcerer.json', 0, 4, 5, 2.0, 6.0],
            ]
            def actualGlowcapTargets = (glowcapMigration?.targets as List)?.collect { target ->
                [target.table?.toString(), target.pool as int, target.entry as int,
                 target.weight as int, target.count?.min as double, target.count?.max as double]
            }
            if (glowcapMigration?.source_item?.toString() != 'minecraft:amethyst_shard' ||
                glowcapMigration?.replacement_item?.toString() != 'ribbits:glowcap' ||
                (glowcapMigration?.entries_replaced as int) != 5 ||
                actualGlowcapTargets != expectedGlowcapTargets ||
                glowcapMigration?.unrelated_amethyst_preserved?.item?.toString() !=
                    'minecraft:amethyst_block') {
                throw new GradleException('Private manifest lacks the exact five-entry Glowcap substitution')
            }

            def expectedResidentData = [
                'data/ribbits/structure/ribbits/ribbit_fisherman.nbt': [
                    profession: 'ribbits:fisherman', umbrella: 'ribbits:umbrella_3', instrument: 'ribbits:none'],
                'data/ribbits/structure/ribbits/ribbit_gardener.nbt': [
                    profession: 'ribbits:gardener', umbrella: 'ribbits:umbrella_2', instrument: 'ribbits:none'],
                'data/ribbits/structure/ribbits/ribbit_merchant.nbt': [
                    profession: 'ribbits:merchant', umbrella: 'ribbits:umbrella_2', instrument: 'ribbits:none'],
                'data/ribbits/structure/ribbits/ribbit_nitwit.nbt': [
                    profession: 'ribbits:nitwit', umbrella: 'ribbits:umbrella_3', instrument: 'ribbits:bongo'],
                'data/ribbits/structure/ribbits/ribbit_sorcerer.nbt': [
                    profession: 'ribbits:sorcerer', umbrella: 'ribbits:umbrella_1', instrument: 'ribbits:none'],
            ]
            def villageMigration = manifest.migrations?.village_resident_profession_assignments_removed
            def actualResidentRecords = (villageMigration?.templates as List).collectEntries { record ->
                [(record.template.toString()): record]
            }
            if ((villageMigration?.count as int) != 5 ||
                villageMigration?.policy?.toString() != 'caller-random explicit Java village profession pool' ||
                actualResidentRecords.keySet() != expectedResidentData.keySet()) {
                throw new GradleException('Private manifest lacks the exact five-template village NBT contract')
            }
            expectedResidentData.each { template, previous ->
                def actual = actualResidentRecords[template]
                if (actual.removed_tag.toString() != 'entities[0].nbt.RibbitData' ||
                    (actual.previous as Map) != previous ||
                    !(actual.before_sha256.toString() ==~ /[0-9a-f]{64}/) ||
                    !(actual.after_sha256.toString() ==~ /[0-9a-f]{64}/) ||
                    actual.before_sha256.toString() == actual.after_sha256.toString()) {
                    throw new GradleException("Private village NBT migration differs for ${template}")
                }
            }

            if ((manifest.migrations?.geckolib_models_moved as int) != 25 ||
                (manifest.migrations?.donor_profession_models_added as int) != 4 ||
                (manifest.migrations?.donor_profession_umbrella_models_added as int) != 12 ||
                (manifest.migrations?.donor_profession_composite_textures_added as int) != 4 ||
                (manifest.migrations?.item_definitions_added as int) != 24 ||
                (manifest.migrations?.spawn_egg_models_migrated as int) != 9) {
                throw new GradleException('Private manifest profession/model/item counts differ')
            }

            def expectedGeckoModelIds = [
                'bass_ribbit', 'bongo_ribbit', 'fisherman_ribbit', 'flute_ribbit',
                'gardener_ribbit', 'guitar_ribbit', 'merchant_ribbit', 'nitwit_ribbit',
                'pride_ribbit', 'sorcerer_ribbit',
            ] as Set
            ['fisherman', 'gardener', 'merchant', 'nitwit', 'sorcerer'].each { profession ->
                (1..3).each { variant ->
                    expectedGeckoModelIds.add("umbrella/${profession}/umbrella_${variant}".toString())
                }
            }
            professionDonors.keySet().each { profession ->
                expectedGeckoModelIds.add("${profession}_ribbit".toString())
                (1..3).each { variant ->
                    expectedGeckoModelIds.add("umbrella/${profession}/umbrella_${variant}".toString())
                }
            }
            def modelPrefix = 'assets/ribbits/geckolib/models/'
            def modelSuffix = '.geo.json'
            def actualGeckoModelIds = expectedFiles.keySet().findAll { name ->
                name.startsWith(modelPrefix) && name.endsWith(modelSuffix)
            }.collect { name ->
                name.substring(modelPrefix.length(), name.length() - modelSuffix.length())
            } as Set
            if (actualGeckoModelIds != expectedGeckoModelIds || actualGeckoModelIds.size() != 41) {
                throw new GradleException('Private manifest GeckoLib model-ID set differs')
            }
            if (!expectedFiles.keySet().containsAll(expectedConfiguredFeaturePaths)) {
                throw new GradleException(
                    'Private manifest omits one or more canonical migrated configured-feature files'
                )
            }
            if (!expectedOutputHash.equalsIgnoreCase(
                expectedFiles['assets/ribbits/textures/item/ribbit_spawn_egg.png'].toString()
            )) {
                throw new GradleException('Private manifest does not hash-pin the authorized shared spawn-egg texture')
            }
            def actualFiles = [:]
            fileTree(privateResourcesDir).visit { details ->
                if (!details.directory) {
                    actualFiles[details.relativePath.pathString] = details.file
                }
            }
            if (actualFiles.keySet() != expectedFiles.keySet()) {
                def missing = (expectedFiles.keySet() - actualFiles.keySet()).sort()
                def unexpected = (actualFiles.keySet() - expectedFiles.keySet()).sort()
                throw new GradleException("Private resource manifest mismatch; missing=${missing}, unexpected=${unexpected}")
            }
            if (actualFiles.keySet().any { name ->
                !(name == 'icon.png' || name == 'logo.png' || name.startsWith('assets/') || name.startsWith('data/'))
            }) {
                throw new GradleException('Private resource tree contains a disallowed top-level path')
            }

            expectedFiles.each { name, expectedHash ->
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                actualFiles[name].withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    int count
                    while ((count = input.read(buffer)) != -1) {
                        digest.update(buffer, 0, count)
                    }
                }
                def actualHash = digest.digest().encodeHex().toString()
                if (!actualHash.equalsIgnoreCase(expectedHash.toString())) {
                    throw new GradleException("Private resource hash mismatch: ${name}")
                }
            }
        }
    }
}

sourceSets {
    main {
        java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
        resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources']
        if (privateResourcesDir != null) {
            resources.srcDir(privateResourcesDir)
        } else {
            resources.srcDir('common/src/publicResources')
        }
    }
}

def yungsApiJar = System.getenv('YUNGS_API_26_2_JAR')
if (!yungsApiJar) {
    throw new GradleException('Set YUNGS_API_26_2_JAR to the validated YUNG\'s API 26.2 Fabric artifact')
}
def yungsApiFile = file(yungsApiJar)
if (!yungsApiFile.isFile()) {
    throw new GradleException("YUNGS_API_26_2_JAR is not a file: ${yungsApiFile}")
}
def yungsApiDigest = java.security.MessageDigest.getInstance('SHA-256')
yungsApiFile.withInputStream { input ->
    byte[] buffer = new byte[8192]
    int count
    while ((count = input.read(buffer)) != -1) {
        yungsApiDigest.update(buffer, 0, count)
    }
}
def expectedYungsApiSha256 = 'ff22a6b509ba559988d7a9352dc94ac612c4b099517acac7da7c81322d797ed7'
def actualYungsApiSha256 = yungsApiDigest.digest().encodeHex().toString()
if (actualYungsApiSha256 != expectedYungsApiSha256) {
    throw new GradleException("YUNGS_API_26_2_JAR SHA-256 mismatch: expected ${expectedYungsApiSha256}, got ${actualYungsApiSha256}")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation files(yungsApiFile)
    implementation "com.geckolib:geckolib-fabric-26.2:${project.geckolib_version}"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
        exclude group: 'net.fabricmc'
        exclude group: 'net.fabricmc.fabric-api'
    }
    implementation("com.terraformersmc:modmenu:${project.modmenu_version}") {
        transitive = false
    }
    implementation include('org.reflections:reflections:0.10.2')
    implementation include('org.javassist:javassist:3.29.2-GA')

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    runs {
        client {
            client()
            runDir 'runs/client'
        }
        server {
            server()
            runDir 'runs/server'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    if (privateResourcesDir != null) {
        inputs.dir privateResourcesDir
        inputs.file privateManifestFile
        dependsOn verifyPrivateResources
    }
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
    // The exact 26.2 loot codec is statically bound to the built-in item registry. Give every
    // test class a fresh JVM so its one custom Ribbits item can be registered before that registry
    // is frozen, without weakening the production codec or mutating another suite's bootstrap.
    forkEvery = 1
    systemProperty 'projectRoot', projectDir.absolutePath
    if (privateResourcesDir != null) {
        systemProperty 'privateResourcesDir', privateResourcesDir.canonicalPath
        dependsOn verifyPrivateResources
    }
    dependsOn 'testPrivateResourceTools'
}

tasks.register('testPrivateResourceTools', Exec) {
    group = 'verification'
    description = 'Runs source-safe regression tests for the private resource migration tool.'
    workingDir projectDir
    commandLine pythonExecutable, '-B', '-m', 'unittest', 'discover',
        '-s', 'tools', '-p', 'test_private_resource_tools.py', '-v'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

if (verifyPrivateResources != null) {
    tasks.named('sourcesJar') {
        dependsOn verifyPrivateResources
    }
}

jar {
    from('LICENSE.txt') {
        rename { 'LICENSE_Ribbits' }
    }
    doLast {
        // Loom nests included JARs after Gradle's archive normalization.
        net.fabricmc.loom.util.ZipReprocessorUtil.reprocessZip(
            archiveFile.get().asFile.toPath(), true, false
        )
    }
}

if (privateResourcesDir == null) {
    def verifySourceOnlyArchiveBoundary = tasks.register('verifySourceOnlyArchiveBoundary') {
        group = 'verification'
        description = 'Proves the source-only JAR contains no protected or donor-derived payload.'
        dependsOn tasks.named('jar')

        doLast {
            def archiveFile = tasks.named('jar').get().archiveFile.get().asFile
            def archive = new java.util.zip.ZipFile(archiveFile)
            try {
                def names = []
                def entries = archive.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (!entry.directory) {
                        names.add(entry.name)
                    }
                }
                def donorFilenames = [
                    'guardribbits-1.20.1-fabric-1.0.4.jar',
                    'useful_ribbits-1.0.2-forge-1.20.1.jar',
                ] as Set
                def reviewedPublicResources = (allowedPublicResources.collect { path ->
                    path.substring('common/src/main/resources/'.length())
                } + ['assets/ribbits/lang/en_us.json']) as Set
                def forbidden = names.findAll { name ->
                    def folded = name.toLowerCase(java.util.Locale.ROOT)
                    def basename = folded.tokenize('/').last()
                    ((folded.startsWith('assets/') || folded.startsWith('data/')) &&
                        !reviewedPublicResources.contains(name)) ||
                        folded == 'icon.png' ||
                        folded == 'logo.png' ||
                        folded.startsWith('sunbatheproductions28/guardribbits/') ||
                        folded.startsWith('me/rogue_one/useful_ribbits/') ||
                        donorFilenames.contains(basename)
                }
                if (!forbidden.isEmpty()) {
                    throw new GradleException(
                        "Source-only JAR contains protected or donor-derived payload: ${forbidden.sort()}"
                    )
                }
            } finally {
                archive.close()
            }
        }
    }
    tasks.named('check') {
        dependsOn verifySourceOnlyArchiveBoundary
    }
}
