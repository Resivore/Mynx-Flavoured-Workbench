plugins { id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    compileOnly files(providers.gradleProperty('csrApiJar').getOrElse(
            '../container-slot-reservations/build/libs/container-slot-reservations-0.1.0-canary18.jar'))
    if (providers.gradleProperty('csrRuntimeJar').isPresent()) {
        testImplementation files(providers.gradleProperty('csrRuntimeJar').get())
        runtimeOnly files(providers.gradleProperty('csrRuntimeJar').get())
    }
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test {
    dependsOn tasks.named('jar')
    useJUnitPlatform()
    systemProperty 'projectRoot', projectDir.absolutePath
}
java { withSourcesJar() }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'carried-routing-fixtures'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}
