import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile
import org.gradle.api.tasks.bundling.AbstractArchiveTask

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

configurations {
    bgeReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    cnmReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    continuityReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def workbenchRoot = rootProject.projectDir.parentFile.parentFile
def workbenchOriginalsRoot = providers.gradleProperty('workbenchOriginalsRoot')
        .map { file(it) }
        .getOrElse(new File(workbenchRoot, 'originals'))
def bgeReferenceJar = new File(workbenchRoot,
        'projects/block-geometry-extensions/artifacts/BGE C78.jar')
def cnmReferenceJar = new File(workbenchOriginalsRoot,
        'mods/clutternomore-2.0.7+26.2-fabric.jar')
def expectedBgeSha256 = 'ed2f5592b699532174bc63672f69c3574f01eb752175126bbc702e9cc86a07f0'
def expectedCnmSha256 = '41a925e70d5e6e8c098bea7dc88c44486aed46724e35cb2fa4b1622b2a4dbcce'
def expectedContinuitySha256 = '2094a52b98e247f664ef2ecdbb41d7dcad7779cc7a8fb87f0ed8a4f8196c0446'
def continuityCoordinates = 'maven.modrinth:1IjD5062:mgUN5Xz2'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly files(bgeReferenceJar)
    runtimeOnly files(bgeReferenceJar)
    testCompileOnly files(bgeReferenceJar)
    testRuntimeOnly files(bgeReferenceJar)
    compileOnly files(cnmReferenceJar)
    runtimeOnly files(cnmReferenceJar)

    compileOnly(continuityCoordinates) { transitive = false }
    runtimeOnly(continuityCoordinates) { transitive = false }
    testCompileOnly(continuityCoordinates) { transitive = false }

    bgeReference files(bgeReferenceJar)
    cnmReference files(cnmReferenceJar)
    continuityReference(continuityCoordinates) { transitive = false }

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'bge_ctm_gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

def sha256 = { File file ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        for (int read; (read = input.read(buffer)) >= 0;) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().encodeHex().toString()
}

tasks.register('verifyControlledProviders') {
    group = 'verification'
    description = 'Verifies the exact controlled BGE C78, Clutter No More, and Continuity inputs.'
    inputs.files(configurations.bgeReference, configurations.cnmReference,
            configurations.continuityReference)
    doLast {
        File bge = configurations.bgeReference.singleFile
        File cnm = configurations.cnmReference.singleFile
        if (sha256(bge) != expectedBgeSha256) {
            throw new GradleException("BGE C78 reference SHA-256 drifted: ${sha256(bge)}")
        }
        if (sha256(cnm) != expectedCnmSha256) {
            throw new GradleException("Clutter No More reference SHA-256 drifted: ${sha256(cnm)}")
        }
        File continuity = configurations.continuityReference.singleFile
        if (sha256(continuity) != expectedContinuitySha256) {
            throw new GradleException("Continuity 3.0.1+26.2 reference SHA-256 drifted: ${sha256(continuity)}")
        }
        ZipFile archive = new ZipFile(continuity)
        try {
            [
                    'me/pepperbell/continuity/client/processor/ConnectionPredicate.class':
                            ['shouldConnect'],
                    'me/pepperbell/continuity/client/properties/BasicConnectingCtmProperties.class':
                            ['getConnectionPredicate'],
                    'me/pepperbell/continuity/client/processor/overlay/StandardOverlayQuadProcessor.class':
                            ['appliesOverlay', 'appliesOverlayCorner', 'fromTwoSidesAdj', 'fromOneSide',
                             'prepareCollector', 'getSprites', 'processQuadInner', 'shouldConnect',
                             'isCollisionShapeFullBlock', 'emitOverlayQuad', 'SpriteCollector',
                             '(Lnet/minecraft/core/BlockPos;Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/client/renderer/block/BlockAndTintGetter;Lnet/minecraft/core/BlockPos;Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/world/level/block/state/BlockState;Lnet/minecraft/core/Direction;Lnet/minecraft/client/renderer/texture/TextureAtlasSprite;)Z'],
                    'me/pepperbell/continuity/client/processor/overlay/StandardOverlayQuadProcessor$SpriteCollector.class':
                            ['add', 'clear', 'spriteAmount', 'sprites'],
                    'me/pepperbell/continuity/client/processor/overlay/OverlayProcessingPredicate.class':
                            ['shouldProcessQuad', 'isQuadUnitSquare'],
                    'me/pepperbell/continuity/client/util/QuadUtil.class':
                            ['emitOverlayQuad', 'square', 'color', 'uv', 'atlas', 'animated',
                             'chunkLayer', 'itemRenderType', 'ambientOcclusion', 'emit'],
                    'me/pepperbell/continuity/client/model/CtmBlockStateModel$CtmQuadTransform.class':
                            ['transformOnce', 'processQuad'],
                    'me/pepperbell/continuity/client/model/CtmBlockStateModel.class':
                            ['emitQuads', 'outputTo'],
            ].each { path, requiredConstants ->
                def seam = archive.getEntry(path)
                if (seam == null) {
                    throw new GradleException("Exact Continuity seam is unavailable: ${path}")
                }
                String constants = new String(archive.getInputStream(seam).readAllBytes(),
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                if (!requiredConstants.every { constants.contains(it) }) {
                    throw new GradleException("Exact Continuity seam is incompatible: ${path}")
                }
                if (path.endsWith('/QuadUtil.class') &&
                        ['RenderMaterial', 'renderMaterial', 'decal', 'depthBias',
                         'polygonOffset'].any { constants.contains(it) }) {
                    throw new GradleException(
                            'Continuity overlay helper gained an unpreserved material/depth seam')
                }
            }
        } finally {
            archive.close()
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyControlledProviders')
    options.release = 25
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
    dependsOn tasks.named('verifyControlledProviders')
}

def packagedJar = tasks.named('jar').flatMap { it.archiveFile }

tasks.register('verifyReleaseArtifact') {
    group = 'verification'
    description = 'Verifies the bounded appearance bridge artifact and its no-assets boundary.'
    dependsOn tasks.named('jar')
    inputs.file(packagedJar)
    doLast {
        File artifact = packagedJar.get().asFile
        if (artifact.name != "bge-ctm-${project.version}.jar") {
            throw new GradleException("Unexpected release filename: ${artifact.name}")
        }
        ZipFile archive = new ZipFile(artifact)
        try {
            def entries = archive.entries().toList()
            def metadata = new JsonSlurper().parse(
                    archive.getInputStream(archive.getEntry('fabric.mod.json')))
            def clientMixins = new JsonSlurper().parse(
                    archive.getInputStream(archive.getEntry('bge_ctm.client.mixins.json')))
            if (metadata.id != 'bge_ctm' || metadata.version != project.version ||
                    metadata.depends?.minecraft != '~26.2' ||
                    metadata.depends?.cnm_terrain_slabs_compat !=
                            '>=4.2.22-bge.canary78.stair-wall-surface-authority+26.2' ||
                    metadata.depends?.continuity != '=3.0.1+26.2') {
                throw new GradleException('Release metadata no longer describes the exact BGE/Continuity bridge')
            }
            if (clientMixins.required != true || clientMixins.injectors?.defaultRequire != 1 ||
                    (clientMixins.client as Set) != ([
                            'ContinuityConnectionPredicateFactoryMixin',
                            'ContinuityOverlayContactMixin',
                            'ContinuityOverlayContributionMixin',
                            'ContinuityOverlayEmissionMixin',
                            'ContinuityOverlayOutputMixin',
                            'ContinuityOverlayProcessingMixin',
                            'ContinuityQuadContextMixin'] as Set)) {
                throw new GradleException('Required exact Continuity mixin boundary changed')
            }
            def policy = metadata.custom?.runtime_dependency_policy
            def exceptionIds = policy?.exceptions instanceof List
                    ? policy.exceptions*.dependency_id as Set
                    : Set.of()
            if (policy?.contract != 'CAPABILITY_OR_PROVIDER' ||
                    !(policy.exceptions instanceof List) || policy.exceptions.size() != 2 ||
                    exceptionIds != (['minecraft', 'continuity'] as Set)) {
                throw new GradleException('Release runtime dependency-policy attestation is missing or changed')
            }
            [
                    'fabric.mod.json',
                    'bge_ctm.mixins.json',
                    'bge_ctm.client.mixins.json',
                    'dev/resivore/bgectm/CanonicalAppearanceResolver.class',
                    'dev/resivore/bgectm/BgeCtmDiagnostics.class',
                    'dev/resivore/bgectm/DiagnosticLimiter.class',
                    'dev/resivore/bgectm/SurfaceContactResolver.class',
                    'dev/resivore/bgectm/continuity/ContactFilteringConnectionPredicate.class',
                    'dev/resivore/bgectm/continuity/ContinuityQuadContext.class',
                    'dev/resivore/bgectm/continuity/OverlayContactFilter.class',
                    'dev/resivore/bgectm/continuity/OverlaySourceEligibility.class',
                    'dev/resivore/bgectm/continuity/OverlayAttemptContext.class',
                    'dev/resivore/bgectm/continuity/OverlayEmissionGeometry.class',
                    'dev/resivore/bgectm/continuity/OverlayFootprintPlan.class',
                    'dev/resivore/bgectm/continuity/OverlayEmissionController.class',
                    'dev/resivore/bgectm/continuity/OverlayRenderCoordinator.class',
                    'dev/resivore/bgectm/continuity/OverlayRenderState.class',
                    'dev/resivore/bgectm/continuity/OverlayProcessingEligibility.class',
                    'dev/resivore/bgectm/client/BgeCtmClient.class',
                    'dev/resivore/bgectm/mixin/BgeDerivedBlockAppearanceMixin.class',
                    'dev/resivore/bgectm/mixin/ContinuityConnectionPredicateFactoryMixin.class',
                    'dev/resivore/bgectm/mixin/ContinuityOverlayContactMixin.class',
                    'dev/resivore/bgectm/mixin/ContinuityOverlayContributionMixin.class',
                    'dev/resivore/bgectm/mixin/ContinuityOverlayEmissionMixin.class',
                    'dev/resivore/bgectm/mixin/ContinuityOverlayOutputMixin.class',
                    'dev/resivore/bgectm/mixin/ContinuityOverlayProcessingMixin.class',
                    'dev/resivore/bgectm/mixin/ContinuityQuadContextMixin.class'
            ].each { entry ->
                if (archive.getEntry(entry) == null) {
                    throw new GradleException("Compatibility artifact is missing ${entry}")
                }
            }
            byte[] resolverBytes = archive.getInputStream(archive.getEntry(
                    'dev/resivore/bgectm/CanonicalAppearanceResolver.class')).readAllBytes()
            String resolverConstants = new String(resolverBytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (resolverConstants.contains('BuiltInRegistries') ||
                    resolverConstants.contains('net/minecraft/resources/Identifier')) {
                throw new GradleException('Canonical resolver must not infer material identity from registry IDs')
            }
            ['dev/resivore/bgectm/SurfaceContactResolver.class',
             'dev/resivore/bgectm/CanonicalAppearanceResolver.class'].each { genericClass ->
                String constants = new String(archive.getInputStream(
                        archive.getEntry(genericClass)).readAllBytes(),
                        java.nio.charset.StandardCharsets.ISO_8859_1)
                if (['StairBlock', 'WallBlock', 'STAIR', 'WALL'].any { constants.contains(it) }) {
                    throw new GradleException(
                            "Generic surface decision path gained a Stair/Wall-specific branch: ${genericClass}")
                }
            }
            if (entries.any { it.name.endsWith('.jar') ||
                    it.name.contains('/optifine/ctm/') ||
                    it.name.startsWith('assets/minecraft/') ||
                    it.name.startsWith('assets/continuity/') }) {
                throw new GradleException('Compatibility artifact must not bundle providers or CTM assets')
            }
        } finally {
            archive.close()
        }
    }
}

tasks.register('stageCanaryArtifact', Copy) {
    group = 'distribution'
    description = 'Stages the exact ignored Canary 12 JAR for canonical local retention.'
    dependsOn tasks.named('verifyReleaseArtifact')
    from(packagedJar)
    into(layout.projectDirectory.dir('artifacts'))
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseArtifact')
}

java {
    withSourcesJar()
}
