plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def requiredFileProperty = { String propertyName, String description ->
    def suppliedPath = providers.gradleProperty(propertyName).orNull
    if (suppliedPath == null || suppliedPath.isBlank()) {
        throw new GradleException("Pass -P${propertyName}=<path to ${description}>")
    }
    def resolved = file(suppliedPath)
    if (!resolved.isFile()) {
        throw new GradleException("${description} was not found at ${resolved}")
    }
    resolved
}

def xaeroJar = requiredFileProperty('xaero_jar', 'Xaero Minimap 26.4.2')
def worldMapJar = requiredFileProperty('world_map_jar', 'Xaero World Map 1.44.2')
def emfJar = requiredFileProperty('emf_jar', 'entity_model_features-3.2.6-26.2-fabric.jar')
def etfJar = requiredFileProperty('etf_jar', 'entity_texture_features-7.1.1-26.2-fabric.jar')
def fabricApiJar = requiredFileProperty('fabric_api_jar', 'Fabric API 0.157.0+26.2 JAR')
def freshAnimationsPack = requiredFileProperty('fresh_animations_pack', 'FreshAnimations_v1.10.5.zip')
def xaeroLibJar = layout.buildDirectory.file('compile-deps/xaerolib.jar')
def productionMinecraftClientJar = new File(gradle.gradleUserHomeDir,
        "caches/fabric-loom/${project.minecraft_version}/minecraft-client.jar")
def productionMixinWorkingDir = layout.buildDirectory.dir('production-mixin-test')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    compileOnly files(xaeroJar, emfJar, etfJar, xaeroLibJar)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    testImplementation files(xaeroJar, emfJar, etfJar, xaeroLibJar)
}

tasks.register('extractXaeroLib', Copy) {
    from(zipTree(xaeroJar)) {
        include 'META-INF/jars/xaerolib-fabric-26.2-1.7.1.jar'
        eachFile { details -> details.path = 'xaerolib.jar' }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir('compile-deps'))
}

compileJava.dependsOn tasks.named('extractXaeroLib')
compileTestJava.dependsOn tasks.named('extractXaeroLib')

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
    systemProperty 'projectRoot', projectDir.absolutePath
    systemProperty 'xaeroJar', xaeroJar.absolutePath
    systemProperty 'worldMapJar', worldMapJar.absolutePath
    systemProperty 'emfJar', emfJar.absolutePath
    systemProperty 'etfJar', etfJar.absolutePath
    systemProperty 'freshAnimationsPack', freshAnimationsPack.absolutePath
}

tasks.register('prepareProductionMixinWorkingDir') {
    outputs.dir(productionMixinWorkingDir)
    doLast { productionMixinWorkingDir.get().asFile.mkdirs() }
}

tasks.register('productionMixinTest', JavaExec) {
    group = 'verification'
    description = 'Applies Canary 12 through production Fabric Knot/Mixin without launching Minecraft.'
    dependsOn tasks.named('testClasses'), tasks.named('jar'),
            tasks.named('prepareProductionMixinWorkingDir')
    mainClass = 'dev.resivore.xaeroemfcompat.ProductionMixinApplicationHarness'
    inputs.files(tasks.named('jar'), xaeroJar, worldMapJar, emfJar, etfJar,
            fabricApiJar, productionMinecraftClientJar)
    classpath = files({
        def mainOutput = sourceSets.main.output.files
        def runtime = configurations.testRuntimeClasspath.files.findAll { candidate ->
            !mainOutput.contains(candidate)
                    && !candidate.name.startsWith('minecraft-merged-deobf-')
                    && candidate != xaeroJar && candidate != emfJar && candidate != etfJar
                    && candidate != xaeroLibJar.get().asFile
        }
        sourceSets.test.output.files.findAll { it.exists() } + runtime + [
                productionMinecraftClientJar,
                tasks.named('jar').get().archiveFile.get().asFile,
                xaeroJar, worldMapJar, emfJar, etfJar, fabricApiJar,
                xaeroLibJar.get().asFile
        ]
    })
    systemProperty 'fabric.development', 'false'
    systemProperty 'fabric.unitTest', 'true'
    systemProperty 'fabric.gameJarPath', productionMinecraftClientJar.absolutePath
    systemProperty 'mixin.debug.countInjections', 'true'
    doFirst {
        if (!productionMinecraftClientJar.isFile()) {
            throw new GradleException("Missing ${productionMinecraftClientJar}")
        }
        def patchJar = tasks.named('jar').get().archiveFile.get().asFile
        def mods = [patchJar, xaeroJar, worldMapJar, emfJar, etfJar, fabricApiJar]
        systemProperty 'fabric.addMods', mods.collect { it.absolutePath }.join(File.pathSeparator)
        args = [patchJar.absolutePath, xaeroJar.absolutePath, emfJar.absolutePath]
    }
    workingDir productionMixinWorkingDir
}

tasks.register('verifyClientOnlyArtifact') {
    dependsOn tasks.named('jar')
    doLast {
        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        def forbiddenPrefixes = [
                'net/minecraft/', 'xaero/', 'traben/', 'META-INF/jars/', 'assets/', 'data/'
        ]
        def invalidEntries = []
        zipTree(artifact).visit { details ->
            if (!details.directory) {
                def path = details.relativePath.pathString.replace('\\', '/')
                if (forbiddenPrefixes.any { path.startsWith(it) }) {
                    invalidEntries.add(path)
                }
                if (path.endsWith('.class') && !path.startsWith('dev/resivore/xaeroemfcompat/')) {
                    invalidEntries.add(path)
                }
            }
        }
        if (!invalidEntries.isEmpty()) {
            throw new GradleException("Client compatibility artifact contains forbidden entries: ${invalidEntries.unique().sort()}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyClientOnlyArtifact'), tasks.named('productionMixinTest')
}

tasks.register('stageCanaryArtifact', Copy) {
    dependsOn tasks.named('check')
    from(tasks.named('jar'))
    into(layout.projectDirectory.dir('artifacts'))
}

java {
    withSourcesJar()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
