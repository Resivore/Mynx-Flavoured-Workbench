plugins {
    id 'java'
    id 'idea'
	id 'eclipse'
	id 'net.fabricmc.fabric-loom'
}
base {
    archivesName = "dramaticdoors-${rootProject.mod_version}"
}
repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases" }
	maven { url "https://cursemaven.com" } 
	// All the maven repositories I have to declare just for Create Fabric :(
    maven { url "https://maven.createmod.net" }
    maven { url "https://maven.tterrag.com/" }
    maven { url "https://mvn.devos.one/snapshots/" }
    maven { url "https://mvn.devos.one/releases/" }
	maven { url "https://maven.cafeteria.dev/releases" }
	maven { url "https://maven.jamieswhiteshirt.com/libs-release" }
	maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
	maven { url "https://jitpack.io/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // modImplementation("com.simibubi.create:create-fabric-${rootProject.minecraft_version}:${rootProject.create_fabric_version}")
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

var commonAW = project(":common").file("src/main/resources/dramaticdoors.accesswidener")
var generatedResources = file("src/generated/resources")

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${project.mod_id}.accesswidener"))
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir("build/datagen")
        }
    }
}

sourceSets {
    main {
        java {
            // Checked-in generated assets are sufficient for production. The
            // old datagen and optional integration adapters remain in source
            // for separate migration without making optional mods mandatory.
            exclude 'com/fizzware/dramaticdoors/fabric/datagen/**'
            exclude 'com/fizzware/dramaticdoors/fabric/addons/create/**'
            exclude 'com/fizzware/dramaticdoors/fabric/compat/CreateFabricCompat.java'
            exclude 'com/fizzware/dramaticdoors/fabric/mixin/JapaneseDoorBlockMixinFabric.java'
        }
        resources {
            srcDirs += [
                    'src/generated'
            ]
        }
    }
}

tasks.named("compileJava", JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}
tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
processResources {
    from project(":common").sourceSets.main.resources
}
