plugins {
    id 'java'
    id 'idea'
	id 'eclipse'
	id 'net.fabricmc.fabric-loom'
}
base {
    archivesName = "dramaticdoors-${rootProject.mod_version}"
}
repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases" }
	maven { url "https://cursemaven.com" } 
	// All the maven repositories I have to declare just for Create Fabric :(
    maven { url "https://maven.createmod.net" }
    maven { url "https://maven.tterrag.com/" }
    maven { url "https://mvn.devos.one/snapshots/" }
    maven { url "https://mvn.devos.one/releases/" }
	maven { url "https://maven.cafeteria.dev/releases" }
	maven { url "https://maven.jamieswhiteshirt.com/libs-release" }
	maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
	maven { url "https://jitpack.io/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // modImplementation("com.simibubi.create:create-fabric-${rootProject.minecraft_version}:${rootProject.create_fabric_version}")
}

tasks.named("test", Test) {
    useJUnitPlatform()
}

var commonAW = project(":common").file("src/main/resources/dramaticdoors.accesswidener")
var generatedResources = file("src/generated/resources")

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${project.mod_id}.accesswidener"))
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated")}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir("build/datagen")
        }
    }
}

sourceSets {
    main {
        java {
            // Checked-in generated assets are sufficient for production. The
            // old datagen and optional integration adapters remain in source
            // for separate migration without making optional mods mandatory.
            exclude 'com/fizzware/dramaticdoors/fabric/datagen/**'
            exclude 'com/fizzware/dramaticdoors/fabric/addons/create/**'
            exclude 'com/fizzware/dramaticdoors/fabric/compat/CreateFabricCompat.java'
            exclude 'com/fizzware/dramaticdoors/fabric/mixin/JapaneseDoorBlockMixinFabric.java'
        }
        resources {
            srcDirs += [
                    'src/generated'
            ]
        }
    }
}

tasks.named("compileJava", JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}
tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
// The protected source and derived pixels stay in local JARs and ignored build output.
def veiledSourceJar = rootProject.file(providers.gradleProperty('veiledArtJar')
        .getOrElse('../../originals/mods/enderscape-fabric-3.0.2+mc26.2.jar'))
def mossyOakSourceJar = rootProject.file(providers.gradleProperty('mossyOakArtJar')
        .getOrElse('../ribbits-26.2/artifacts/ribbits-private-reconstruction-4.1.6+26.2-mynx-canary27.jar'))
def artTool = rootProject.file('tools/NativeDoorArtwork.java')
def doorArtwork = tasks.register('generateNativeDoorArtwork', Exec) {
    def output = layout.buildDirectory.dir('generated/nativeDoorArtwork')
    inputs.files(artTool, veiledSourceJar, mossyOakSourceJar)
    outputs.dir(output)
    executable javaToolchains.launcherFor(java.toolchain).get().executablePath.asFile
    args artTool, veiledSourceJar, mossyOakSourceJar, output.get().asFile
}
def mcArtJar = new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/26.2/minecraft-client.jar')
def macawArtJar = rootProject.file('../../originals/mods/mcw-doors-1.1.5-mc26.2fabric.jar')
def amcArtJar = rootProject.file('../architectural-material-closure/artifacts/AMC C30.jar')
def ddArtJar = rootProject.file('artifacts/DD C11.jar')
def treesJar = rootProject.file(providers.gradleProperty('treesJar').getOrElse('../mynx-trees/artifacts/mynx-trees-private-0.1.0+26.2-canary9.jar'))
def newAmcJar = rootProject.file(providers.gradleProperty('newAmcJar').getOrElse('../architectural-material-closure/artifacts/AMC C36.jar'))
def treeDoorArt = rootProject.file('tools/tree_door_art.py')
def treeAssets = rootProject.file('../../originals/assets/wisteria assets')
def amcTool = rootProject.file('tools/amc_macaw.py')
def mapping = file('src/main/resources/dramaticdoors/amc_macaw_doors.tsv')
def amcArtwork = tasks.register('generateAmcMacawDoors', Exec) {
    def output = layout.buildDirectory.dir('generated/amcMacawDoors')
    inputs.files(treesJar, newAmcJar, amcTool, mapping, mcArtJar, macawArtJar, amcArtJar, ddArtJar, veiledSourceJar, mossyOakSourceJar)
    outputs.dir(output)
    commandLine providers.gradleProperty('doorArtPython').getOrElse('python'), '-B', amcTool, mapping,
            ddArtJar, amcArtJar, macawArtJar, mcArtJar, veiledSourceJar, mossyOakSourceJar, treesJar, newAmcJar, output.get().asFile
}
def treeArtwork = tasks.register('generateTreeDoorArtwork', Exec) {
    def output = layout.buildDirectory.dir('generated/treeDoorArtwork')
    inputs.files(treeDoorArt, ddArtJar, treesJar, treeAssets)
    outputs.dir(output)
    commandLine providers.gradleProperty('doorArtPython').getOrElse('python'), '-B', treeDoorArt, ddArtJar, treesJar, treeAssets, output.get().asFile
}
processResources {
    from treeArtwork
    from amcArtwork
    from doorArtwork
    from project(":common").sourceSets.main.resources
}

// Local provider JARs and their data dependencies are inputs to the controlled tests only.
def testJei = providers.gradleProperty('doorTestJei')
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'dramaticdoors-tests'
        enableGameTests = true
        enableClientGameTests = testJei.isPresent()
        clearRunDirectory = false
    }
}

def testProviders = providers.gradleProperty('doorTestJars').getOrElse('')
if (testProviders) {
    dependencies { gametestRuntimeOnly files(testProviders.split(File.pathSeparator)) }
}
def testData = providers.gradleProperty('doorTestData')
if (testData.isPresent()) {
    tasks.named('processGametestResources') {
        from(testData.get()) {
            include 'data/food/recipe/**', 'data/crafting/recipe/**', 'data/blessings/recipe/**'
            include 'data/*/enchantment/**', 'data/*/tags/item/**', 'data/*/tags/enchantment/**'
            include 'data/main/tags/entity_type/livestock.json', 'data/main/jukebox_song/golden.json', 'data/minecraft/loot_table/kleis_items/opal.json'
        }
    }
}
loom.runs.named('gameTest') {
    def matrix = providers.gradleProperty('doorTestMatrix').getOrElse('vanilla')
    runDir "build/native-door-tests/${matrix}"
    vmArg "-Ddramaticdoors.test.matrix=${matrix}"
    vmArg '-Dfabric-api.gametest.filter=dramaticdoors-tests:*'
}

if (testJei.isPresent()) {
    sourceSets.gametest.java.srcDir 'src/clientGametest/java'
    dependencies { gametestImplementation files(testJei.get()) }
    loom.runs.named('clientGameTest') {
        runDir 'build/native-door-tests/client'
    }
}
tasks.named('processGametestResources') {
    inputs.property 'jei', testJei.isPresent()
    filesMatching('fabric.mod.json') {
        expand clientEntries: testJei.isPresent() ?
                ',"fabric-client-gametest":["com.fizzware.dramaticdoors.test.DoorSearchTest"],"jei_mod_plugin":["com.fizzware.dramaticdoors.test.DoorSearchTest"]' : ''
    }
}
