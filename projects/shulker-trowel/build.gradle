plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def cnmJarPath = project.findProperty('cnmJar') ?: '../../originals/mods/clutternomore-2.0.7+26.2-fabric.jar'
def bgeJarPath = project.findProperty('bgeJar') ?:
        '../block-geometry-extensions/artifacts/cnm-nibaru-integration-4.2.2-bge.canary58.glass-corner-uv+26.2.jar'
def quickRightClickJarPath = project.findProperty('quickRightClickJar') ?:
        '../../originals/mods/quickrightclick-26.2.0-1.9.jar'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // CNM and unified BGE remain external runtime owners. Nothing from these JARs is bundled.
    compileOnly files(cnmJarPath)
    runtimeOnly files(cnmJarPath)
    compileOnly files(bgeJarPath)
    runtimeOnly files(bgeJarPath)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    testImplementation files(bgeJarPath)
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'shulker-trowel-runtime-tests'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

test {
    useJUnitPlatform()
    systemProperty 'projectRoot', projectDir.absolutePath
    systemProperty 'cnmJar', file(cnmJarPath).absolutePath
    systemProperty 'quickRightClickJar', file(quickRightClickJarPath).absolutePath
}

java {
    withSourcesJar()
}

jar {
    from('LICENSE')
}
