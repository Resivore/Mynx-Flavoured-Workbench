import groovy.json.JsonSlurper
import org.gradle.api.tasks.bundling.AbstractArchiveTask

plugins { id 'net.fabricmc.fabric-loom' version '1.17.19' }

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }

def requiredFileProperty = { String propertyName, String description ->
    def supplied = providers.gradleProperty(propertyName).orNull
    if (supplied == null || supplied.isBlank()) throw new GradleException("Pass -P${propertyName}=<${description}>")
    def resolved = file(supplied)
    if (!resolved.isFile()) throw new GradleException("${description} was not found at ${resolved}")
    resolved
}

def xaeroJar = requiredFileProperty('xaero_jar', 'Xaero Minimap 26.4.2 JAR')
def naturalistJar = requiredFileProperty('naturalist_jar', 'Naturalist 2.0.3+26.2-port-canary8 JAR')
def fabricApiJar = requiredFileProperty('fabric_api_jar', 'Fabric API 0.157.0+26.2 JAR')
def xaeroLibJar = layout.buildDirectory.file('compile-deps/xaerolib-fabric-26.2-1.7.1.jar')
def genericXaeroEmfJar = requiredFileProperty('generic_xaero_emf_jar', 'Xaero × EMF Entity Icons Canary 9 JAR')
def emfJar = requiredFileProperty('emf_jar', 'Entity Model Features 3.2.6 JAR')
def etfJar = requiredFileProperty('etf_jar', 'Entity Texture Features 7.1.1 JAR')
def productionMinecraftClientJar = new File(gradle.gradleUserHomeDir,
        "caches/fabric-loom/${project.minecraft_version}/minecraft-client.jar")
def productionMixinWorkingDir = file("$buildDir/production-mixin-test")
def prepareProductionMixinWorkingDir = tasks.register('prepareProductionMixinWorkingDir') {
    outputs.dir(productionMixinWorkingDir)
    doLast { productionMixinWorkingDir.mkdirs() }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly files(xaeroJar, naturalistJar, xaeroLibJar)
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    testImplementation files(xaeroJar, naturalistJar, xaeroLibJar)
}

tasks.register('extractXaeroLib', Copy) {
    from(zipTree(xaeroJar)) {
        include 'META-INF/jars/xaerolib-fabric-26.2-1.7.1.jar'
        eachFile { details -> details.path = 'xaerolib-fabric-26.2-1.7.1.jar' }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir('compile-deps'))
    doLast { if (!xaeroLibJar.get().asFile.isFile()) throw new GradleException('Xaero 26.4.2 does not contain nested XaeroLib 1.7.1') }
}
compileJava.dependsOn tasks.named('extractXaeroLib')
compileTestJava.dependsOn tasks.named('extractXaeroLib')

processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }

test {
    useJUnitPlatform()
    dependsOn tasks.named('jar')
    systemProperty 'projectRoot', projectDir.absolutePath
    systemProperty 'patchJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'xaeroJar', xaeroJar.absolutePath
    systemProperty 'naturalistJar', naturalistJar.absolutePath
}

tasks.register('productionMixinTest', JavaExec) {
    group = 'verification'
    description = 'Applies Naturalist C11 and generic Xaero × EMF C9 through production Fabric Knot/Mixin without launching Minecraft.'
    dependsOn tasks.named('testClasses'), tasks.named('jar'), prepareProductionMixinWorkingDir
    mainClass = 'dev.resivore.naturalistxaeroicons.ProductionMixinApplicationHarness'
    inputs.files(tasks.named('jar'), xaeroJar, naturalistJar, genericXaeroEmfJar, emfJar, etfJar, fabricApiJar, productionMinecraftClientJar)
    classpath = files({
        def mainOutput = sourceSets.main.output.files
        def runtime = configurations.testRuntimeClasspath.files.findAll { candidate ->
            !mainOutput.contains(candidate) && !candidate.name.startsWith('minecraft-merged-deobf-') &&
                    candidate != xaeroJar && candidate != naturalistJar && candidate != xaeroLibJar.get().asFile
        }
        sourceSets.test.output.files.findAll { it.exists() } + runtime + [
                productionMinecraftClientJar, tasks.named('jar').get().archiveFile.get().asFile,
                xaeroJar, naturalistJar, genericXaeroEmfJar, emfJar, etfJar, fabricApiJar
        ]
    })
    systemProperty 'fabric.development', 'false'
    systemProperty 'fabric.unitTest', 'true'
    systemProperty 'fabric.gameJarPath', productionMinecraftClientJar.absolutePath
    systemProperty 'mixin.debug.countInjections', 'true'
    doFirst {
        if (!productionMinecraftClientJar.isFile()) throw new GradleException("Missing ${productionMinecraftClientJar}")
        def mods = [tasks.named('jar').get().archiveFile.get().asFile,
                genericXaeroEmfJar, xaeroJar, naturalistJar, emfJar, etfJar, fabricApiJar]
        systemProperty 'fabric.addMods', mods.collect { it.absolutePath }.join(File.pathSeparator)
        args = [tasks.named('jar').get().archiveFile.get().asFile.absolutePath, genericXaeroEmfJar.absolutePath, xaeroJar.absolutePath]
    }
    workingDir productionMixinWorkingDir
}

tasks.register('verifyClientOnlyArtifact') {
    dependsOn tasks.named('jar')
    doLast {
        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        def archive = zipTree(artifact)
        def metadata = new JsonSlurper().parse(archive.matching { include 'fabric.mod.json' }.singleFile)
        if (metadata.id != 'naturalist_xaero_entity_icons_compat' || metadata.version != project.version || metadata.environment != 'client') throw new GradleException('Unexpected Fabric metadata')
        if (metadata.suggests?.xaerominimap != '*' || metadata.suggests?.naturalist != '*') throw new GradleException('Compatibility dependencies must remain capability suggestions')
        def paths = []; archive.visit { if (!it.directory) paths.add(it.relativePath.pathString.replace('\\','/')) }
        def forbidden = paths.findAll { it.startsWith('net/minecraft/') || it.startsWith('xaero/') || it.startsWith('com/crispytwig/') || it.startsWith('assets/') || it.startsWith('data/') || it.startsWith('META-INF/jars/') || (it.endsWith('.class') && !it.startsWith('dev/resivore/naturalistxaeroicons/')) }
        if (!forbidden.isEmpty()) throw new GradleException("Forbidden foreign content: ${forbidden.unique().sort()}")
    }
}
tasks.named('check') { dependsOn tasks.named('productionMixinTest'), tasks.named('verifyClientOnlyArtifact') }
tasks.register('verifyCanary29PresentationContracts') {
    doLast {
        if (project.version != '0.1.0-canary29') return
        def source = file('src/main/java/dev/resivore/naturalistxaeroicons/NaturalistModelContracts.java').getText('UTF-8')
        def required = [
                '''add(map, "starfish", cNormalizedDetachedChildrenWithTraceCenter("StarfishModel", "", "body",
                p(.52F, 1.5708F, 0.0F, 0.0F), List.of("body", "legs")))''',
                '''add(map, "desert_scorpion", cNormalizedDetachedChildrenWithTraceCenter("DesertScorpionModel", "", "body",
                p(.34F, 1.5708F, 0.0F, 0.0F), List.of("body", "legs")))''',
                '''add(map, "jungle_scorpion", cNormalizedDetachedChildrenWithTraceCenter("JungleScorpionModel", "", "body",
                p(.28F, 1.5708F, 0.0F, 0.0F), List.of("body", "legs")))''',
                '''add(map, "alligator", c("AlligatorModel", "body/neck", p(.58F, 0.0F, .7854F, 0.0F)), c("AlligatorBabyModel", "body/neck", p(.76F)))''',
                '''add(map, "lizard", cDetached("LizardModel", "body/skullRot/neck", "body/skullRot/neck/neck_r1", p(1.0F, 0.0F, 1.5708F, 0.0F)))''',
                '''add(map, "tortoise", cDetached("TortoiseModel", "body/skullRot/neck", p(1.0F, 0.0F, 1.5708F, 0.0F)), cDetached("TortoiseBabyModel", "body/skullRot/neck", p(1.0F, 0.0F, 1.5708F, 0.0F)))''',
                '''add(map, "black_bear", c("BlackBearModel", "body/skullRot/skull", p(1.0F, 0.0F, 0.0F, 0.0F, -2.0F)), c("BlackBearBabyModel", "body/skull"))''',
                '''add(map, "hippo", c("HippoModel", "body/bone/neck", p(.75F)), c("HippoBabyModel", "body/neck", p(.70F)))''',
                '''add(map, "whale", c("WhaleModel", "body/skullRot", p(.30F, 0.0F, .7854F, 0.0F)), c("WhaleBabyModel", "body/skull", p(.60F, 0.0F, .7854F, 0.0F)))'''
        ]
        if (required.any { !source.contains(it) }) throw new GradleException('Canary 29 requires the readable Whale fallback and frozen solved-icon controls')
        def mainSources = fileTree('src/main/java') { include '**/*.java' }.files.collect { it.getText('UTF-8') }.join('\n')
        if (mainSources.contains('WhaleCaptureDiagnostic') || mainSources.contains('NaturalistXaero WhaleCapture')) {
            throw new GradleException('Canary 29 must not retain the temporary Canary 27 Whale diagnostic')
        }
    }
}
tasks.register('stageCanaryArtifact', Copy) { dependsOn tasks.named('check'), tasks.named('verifyCanary29PresentationContracts'); from(tasks.named('jar')); into(layout.projectDirectory.dir('artifacts')) }
java { withSourcesJar() }
