def bbbForms = [[id:'column',display:'Column'],[id:'urn',display:'Urn'],[id:'moulding',display:'Moulding'],[id:'fence',display:'Fence'],[id:'frame',display:'Frame']]
def pathForms = [[id:'running_bond_path',display:'Running Bond Path'],[id:'strewn_rocky_path',display:'Strewn Rocky Path'],[id:'windmill_weave_path',display:'Windmill Weave Path'],[id:'flagstone_path',display:'Flagstone Path'],[id:'crystal_floor_path',display:'Crystal Floor Path']]
def pavingForms = [[id:'diamond_paving',display:'Diamond Paving'],[id:'basket_weave_paving',display:'Basket Weave Paving'],[id:'square_paving',display:'Square Paving'],[id:'honeycomb_paving',display:'Honeycomb Paving'],[id:'clover_paving',display:'Clover Paving'],[id:'dumble_paving',display:'Dumble Paving']]
def windowForms = [[id:'window',display:'Window'],[id:'window2',display:'Barred Window'],[id:'four_window',display:'Four Window'],[id:'pane_window',display:'Pane Window']]
def windowsForms = [[id:'parapet',display:'Parapet',source:'parapet'],[id:'gothic',display:'Gothic Window',source:'gothic'],[id:'arrow_slit',display:'Arrow Slit',source:'arrow'],[id:'louvered_shutter',display:'Louvered Shutter',source:'shutter']]
def generatedResourcesDir = layout.buildDirectory.dir('generated/amc-c3-minimal-resources')

tasks.register('generateMasonryResources') {
    group = 'build setup'
    description = 'Locally materializes provider-faithful C3 masonry resources into ignored build inputs.'
    outputs.dir(generatedResourcesDir)
    inputs.files(bbbReferenceJar, windowsReferenceJar, pathsReferenceJar)
    doLast {
        [bbbReferenceJar,windowsReferenceJar,pathsReferenceJar].each { if (!it.isFile()) throw new GradleException("Missing exact private provider reference: ${it}") }
        def root = generatedResourcesDir.get().asFile; delete(root)
        def ns = 'architectural_material_closure'
        def write = { relative, value -> def target=new File(root,relative); target.parentFile.mkdirs(); target.setText(value.stripIndent().trim()+'\n','UTF-8') }
        def text = { zip, entry -> zip.getInputStream(entry).getText('UTF-8') }
        def rewrite = { value, material, provider -> value.replace("${provider}:block/","${ns}:block/derived/${material}/${provider}/").replace("${provider}:item/","${ns}:item/derived/${material}/${provider}/") }
        def tint = { byte[] source, color ->
            def input=javax.imageio.ImageIO.read(new ByteArrayInputStream(source)); if(input==null)return source
            def output=new java.awt.image.BufferedImage(input.width,input.height,java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for(int y=0;y<input.height;y++)for(int x=0;x<input.width;x++){int pixel=input.getRGB(x,y);int a=(pixel>>>24)&255;int r=(pixel>>>16)&255;int g=(pixel>>>8)&255;int b=pixel&255;int l=Math.max(1,(r+g+b).intdiv(3));int nr=Math.min(255,(r*45+color[0]*l).intdiv(300));int ng=Math.min(255,(g*45+color[1]*l).intdiv(300));int nb=Math.min(255,(b*45+color[2]*l).intdiv(300));output.setRGB(x,y,(a<<24)|(nr<<16)|(ng<<8)|nb)}
            def bytes=new ByteArrayOutputStream();javax.imageio.ImageIO.write(output,'png',bytes);bytes.toByteArray()
        }
        /* Copy only the recursive model/texture closure actually referenced by
         * each selected provider blockstate. This keeps all derived bytes local
         * while avoiding an unrelated full-provider resource mirror. */
        def providerRefs = { value, provider ->
            def result=[]; def matcher=(value =~ /${provider}:(block|item)\/([^\"#]+)/)
            while(matcher.find()) result << [kind:matcher.group(1),path:matcher.group(2)]
            result
        }
        def copyTexture = { zip, provider, material, path, copied ->
            def entry=zip.getEntry("assets/${provider}/textures/${path}.png")
            if(entry==null || !copied.add("texture:${path}")) return
            def target=new File(root,"assets/${ns}/textures/derived/${material.id}/${provider}/${path}.png")
            target.parentFile.mkdirs();target.bytes=tint(zip.getInputStream(entry).bytes,material.tint)
        }
        def copyModel
        copyModel = { zip, provider, material, path, copied ->
            def entry=zip.getEntry("assets/${provider}/models/${path}.json")
            if(entry==null || !copied.add("model:${path}")) return false
            def raw=text(zip,entry)
            write("assets/${ns}/models/derived/${material.id}/${provider}/${path}.json",rewrite(raw,material.id,provider))
            providerRefs(raw,provider).each { ref ->
                if(!copyModel(zip,provider,material,ref.kind+'/'+ref.path,copied)) copyTexture(zip,provider,material,ref.kind+'/'+ref.path,copied)
            }
            true
        }
        def materializeState = { zip, provider, material, raw, copied ->
            providerRefs(raw,provider).each { ref ->
                if(!copyModel(zip,provider,material,ref.kind+'/'+ref.path,copied)) copyTexture(zip,provider,material,ref.kind+'/'+ref.path,copied)
            }
        }
        def itemModel = { model -> "{ \"model\": { \"type\": \"minecraft:model\", \"model\": \"${ns}:block/${model}\" } }" }
        def selfLoot = { name -> "{ \"type\": \"minecraft:block\", \"pools\":[{\"conditions\":[{\"condition\":\"minecraft:survives_explosion\"}],\"entries\":[{\"type\":\"minecraft:item\",\"name\":\"${ns}:${name}\"}],\"rolls\":1.0}],\"random_sequence\":\"${ns}:blocks/${name}\"}" }
        def recipe = { ingredient,name -> "{ \"type\":\"minecraft:stonecutting\",\"ingredient\":\"minecraft:${ingredient}\",\"result\":{\"id\":\"${ns}:${name}\"}}" }
        def advancement = { ingredient,name -> "{\"parent\":\"minecraft:recipes/root\",\"criteria\":{\"has_material\":{\"conditions\":{\"items\":[{\"items\":\"minecraft:${ingredient}\"}]},\"trigger\":\"minecraft:inventory_changed\"},\"has_the_recipe\":{\"conditions\":{\"recipe\":\"${ns}:${name}\"},\"trigger\":\"minecraft:recipe_unlocked\"}},\"requirements\":[[\"has_the_recipe\",\"has_material\"]],\"rewards\":{\"recipes\":[\"${ns}:${name}\"]}}" }
        def lang=[:];def pickaxe=[]
        def generated = { material,form,state,zip,provider,copied ->
            def name="${material.id}_${form.id}";def matcher=(state =~ /\"model\"\s*:\s*\"([^\"]+)\"/);if(!matcher.find())throw new GradleException("No model in provider blockstate for ${name}");def model=matcher.group(1)
            materializeState(zip,provider,material,state,copied)
            write("assets/${ns}/blockstates/${name}.json",state);write("assets/${ns}/models/block/${name}.json","{ \"parent\": \"${model}\" }");write("assets/${ns}/items/${name}.json",itemModel(name));write("data/${ns}/loot_table/blocks/${name}.json",selfLoot(name));write("data/${ns}/recipe/${name}_from_stonecutting.json",recipe(material.block,name));write("data/${ns}/advancement/recipes/decorations/${name}_from_stonecutting.json",advancement(material.block,name));lang["block.${ns}.${name}"]="${material.display} ${form.display}";pickaxe<<"${ns}:${name}"
        }
        def bbb=new java.util.zip.ZipFile(bbbReferenceJar);def windows=new java.util.zip.ZipFile(windowsReferenceJar);def paths=new java.util.zip.ZipFile(pathsReferenceJar)
        try {
            masonryMaterials.each { material ->
                def bbbCopied=[] as Set;def windowsCopied=[] as Set;def pathsCopied=[] as Set
                bbbForms.each { form -> def e=bbb.getEntry("assets/bbb/blockstates/stone_${form.id}.json");def raw=text(bbb,e);generated(material,form,rewrite(raw,material.id,'bbb'),bbb,'bbb',bbbCopied) }
                pathForms.each { form -> def e=paths.getEntry("assets/mcwpaths/blockstates/${material.path}_${form.id}.json") ?: paths.getEntry("assets/mcwpaths/blockstates/andesite_${form.id}.json");def raw=text(paths,e);generated(material,form,rewrite(raw,material.id,'mcwpaths'),paths,'mcwpaths',pathsCopied) }
                pavingForms.each { form -> def e=paths.getEntry("assets/mcwpaths/blockstates/${material.paving}_${form.id}.json") ?: paths.getEntry("assets/mcwpaths/blockstates/andesite_${form.id}.json");def raw=text(paths,e);generated(material,form,rewrite(raw,material.id,'mcwpaths'),paths,'mcwpaths',pathsCopied) }
                windowForms.each { form -> def e=windows.getEntry("assets/mcwwindows/blockstates/${material.window}_${form.id}.json") ?: windows.getEntry("assets/mcwwindows/blockstates/stone_${form.id}.json");def raw=text(windows,e);generated(material,form,rewrite(raw,material.id,'mcwwindows'),windows,'mcwwindows',windowsCopied) }
                windowsForms.each { form -> def e=windows.getEntry("assets/mcwwindows/blockstates/${material[form.source]}_${form.id}.json");if(e==null)throw new GradleException("Macaw Windows lacks ${material[form.source]}_${form.id}");def raw=text(windows,e);generated(material,form,rewrite(raw,material.id,'mcwwindows'),windows,'mcwwindows',windowsCopied) }
            }
        } finally { bbb.close();windows.close();paths.close() }
        write("assets/${ns}/lang/en_us.json",groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(lang)));write('data/minecraft/tags/block/mineable/pickaxe.json',groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([replace:false,values:pickaxe])))
    }
}

processResources { dependsOn tasks.named('generateMasonryResources');inputs.property 'version',project.version;from(generatedResourcesDir);filesMatching('fabric.mod.json'){expand 'version':project.version} }
tasks.withType(JavaCompile).configureEach { options.release=25 }
test { useJUnitPlatform();systemProperty 'projectRoot',projectDir.absolutePath }
java { withSourcesJar() }
tasks.register('verifyProductionJarIsolation') {
    group='verification';description='Verifies the production JAR has AMC code and locally generated private resources only.';dependsOn tasks.named('jar')
    doLast { def archive=new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile);try {def foreign=archive.entries().findAll{it.name.endsWith('.class')&&!it.name.startsWith('dev/resivore/amc/')}.collect{it.name};if(!foreign.isEmpty())throw new GradleException("Production JAR contains foreign classes: ${foreign}");masonryMaterials.each{material->[bbbForms,pathForms,pavingForms,windowForms,windowsForms].flatten().each{form->def name="assets/architectural_material_closure/items/${material.id}_${form.id}.json";if(archive.getEntry(name)==null)throw new GradleException("Missing generated item model: ${name}")}}}finally{archive.close()} }
}
tasks.named('check') { dependsOn tasks.named('verifyProductionJarIsolation') }
tasks.register('stageCanaryArtifact',Copy) { group='distribution';description='Stages the verified current canary JAR for local retention.';dependsOn tasks.named('check');from{tasks.named('jar').get().archiveFile.get().asFile};into(layout.projectDirectory.dir('artifacts')) }
