masonryMaterials.each { it.texture = it.id == 'quartz' ? 'quartz_block_side' : it.block }
def bbbForms = [[id:'column',display:'Column'],[id:'urn',display:'Urn'],[id:'moulding',display:'Moulding'],[id:'fence',display:'Fence'],[id:'frame',display:'Frame']]
def pathForms = [[id:'running_bond_path',display:'Running Bond Path'],[id:'strewn_rocky_path',display:'Strewn Rocky Path'],[id:'windmill_weave_path',display:'Windmill Weave Path'],[id:'flagstone_path',display:'Flagstone Path'],[id:'crystal_floor_path',display:'Crystal Floor Path']]
def pavingForms = [[id:'diamond_paving',display:'Diamond Paving'],[id:'basket_weave_paving',display:'Basket Weave Paving'],[id:'square_paving',display:'Square Paving'],[id:'honeycomb_paving',display:'Honeycomb Paving'],[id:'clover_paving',display:'Clover Paving'],[id:'dumble_paving',display:'Dumble Paving']]
def windowForms = [[id:'window',display:'Window'],[id:'window2',display:'Barred Window'],[id:'four_window',display:'Four Window'],[id:'pane_window',display:'Pane Window']]
def windowsForms = [[id:'parapet',display:'Parapet',source:'parapet'],[id:'gothic',display:'Gothic Window',source:'gothic'],[id:'arrow_slit',display:'Arrow Slit',source:'arrow'],[id:'louvered_shutter',display:'Louvered Shutter',source:'shutter']]
def c4BbbProviders = ['stone','deepslate','blackstone','quartz','nether_brick','red_sandstone','sandstone'] as Set
def c4PathProviders = ['stone','andesite','diorite','granite','brick','mossy_stone','cobbled_deepslate','deepslate','mud_brick','blackstone','dark_prismarine','sandstone','red_sandstone'] as Set
def c4BasicWindowProviders = ['stone','andesite','diorite','granite','brick','deepslate','blackstone','prismarine','dark_prismarine','sandstone','red_sandstone','quartz'] as Set
def c4ParapetProviders = ['andesite','diorite','granite','blackstone','prismarine','dark_prismarine'] as Set
def c4GothicProviders = ['stone','blackstone','prismarine','dark_prismarine','mud_brick','nether_brick','end_brick'] as Set
def c4ShutterProviders = ['andesite','diorite','granite'] as Set
def c4ProviderOwned = { material, form ->
    if (form in ['button','pressure_plate']) return material.id in ['stone','blackstone']
    if (form in bbbForms*.id) return c4BbbProviders.contains(material.id)
    if (form in (pathForms*.id + pavingForms*.id + ['running_bond','running_bond_slab','running_bond_stairs','flagstone','flagstone_slab','flagstone_stairs','windmill_weave','windmill_weave_slab','windmill_weave_stairs','crystal_floor','crystal_floor_slab','crystal_floor_stairs'])) return c4PathProviders.contains(material.id)
    if (form in windowForms*.id) return c4BasicWindowProviders.contains(material.id)
    if (form == 'parapet') return c4ParapetProviders.contains(material.id)
    if (form in ['gothic','arrow_slit']) return c4GothicProviders.contains(material.id)
    if (form == 'louvered_shutter') return c4ShutterProviders.contains(material.id)
    throw new GradleException("Unknown C4 form $form")
}
def generatedResourcesDir = layout.buildDirectory.dir('generated/amc-c4-resources')

tasks.register('generateMasonryResources') {
    group = 'build setup'
    description = 'Locally materializes provider-faithful C4 masonry resources into ignored build inputs.'
    outputs.dir(generatedResourcesDir)
    inputs.files(bbbReferenceJar, windowsReferenceJar, pathsReferenceJar, minecraftClientJar)
    doLast {
        [bbbReferenceJar,windowsReferenceJar,pathsReferenceJar,minecraftClientJar].each { if (!it.isFile()) throw new GradleException("Missing exact local reference: ${it}") }
        def root = generatedResourcesDir.get().asFile; delete(root)
        def ns = 'architectural_material_closure'
        def write = { relative, value -> def target=new File(root,relative); target.parentFile.mkdirs(); target.setText(value.stripIndent().trim()+'\n','UTF-8') }
        def text = { zip, entry -> zip.getInputStream(entry).getText('UTF-8') }
        /* Model edges and the provider texture variables they use are localized together.
         * This is deliberately a closure: rewriting a model without emitting its texture
         * makes a C4 variant silently fall back to the source provider material. */
        def rewrite = { value, material, provider ->
            value.replaceAll(/("(?:parent|model)"\s*:\s*")${provider}:(block|item)\//) { all, prefix, kind ->
                "${prefix}${ns}:${kind}/derived/${material}/${provider}/"
            }
        }
        /* Provider pixels supply form-specific seams, trim and shading; the actual target
         * Minecraft material texture supplies colour, grain and masonry identity.  This is a
         * per-pixel material transfer, not C3's global RGB tint. */
        def materializeTexture = { byte[] providerBytes, byte[] materialBytes ->
            def form=javax.imageio.ImageIO.read(new ByteArrayInputStream(providerBytes)); def material=javax.imageio.ImageIO.read(new ByteArrayInputStream(materialBytes)); if(form==null||material==null)return providerBytes
            def out=new java.awt.image.BufferedImage(form.width,form.height,java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for(int y=0;y<form.height;y++)for(int x=0;x<form.width;x++){int fp=form.getRGB(x,y), mp=material.getRGB(x%material.width,y%material.height);int a=(fp>>>24)&255;int fr=(fp>>>16)&255,fg=(fp>>>8)&255,fb=fp&255;int mr=(mp>>>16)&255,mg=(mp>>>8)&255,mb=mp&255;double shade=(fr+fg+fb)/382.5d;int r=Math.max(0,Math.min(255,(int)(mr*(0.55d+shade))));int g=Math.max(0,Math.min(255,(int)(mg*(0.55d+shade))));int b=Math.max(0,Math.min(255,(int)(mb*(0.55d+shade))));out.setRGB(x,y,(a<<24)|(r<<16)|(g<<8)|b)}
            def bytes=new ByteArrayOutputStream();javax.imageio.ImageIO.write(out,'png',bytes);bytes.toByteArray()
        }
        /* Copy only the recursive model/texture closure actually referenced by
         * each selected provider blockstate. This keeps all derived bytes local
         * while avoiding an unrelated full-provider resource mirror. */
        def providerRefs = { value, provider ->
            def result=[]; def matcher=(value =~ /"(?:parent|model)"\s*:\s*"${provider}:(block|item)\/([^\"#]+)/)
            while(matcher.find()) result << [kind:matcher.group(1),path:matcher.group(2)]
            result
        }
        def providerTextureRefs = { value, provider ->
            def modelPaths = providerRefs(value, provider).collect { "${it.kind}/${it.path}" } as Set
            def result=[]; def matcher=(value =~ /${provider}:block\/([^\"#]+)/)
            while(matcher.find()) {
                def path = matcher.group(1)
                if (!modelPaths.contains("block/${path}")) result << path
            }
            result.unique()
        }
        def textureEntry = { zip, provider, path ->
            def direct = zip.getEntry("assets/${provider}/textures/block/${path}.png")
            /* BBB's stone-frame templates name an oak fallback which is overridden by
             * every concrete child model. Materialize BBB's actual frame/oak texture
             * under that template path so even the inherited fallback is resolvable. */
            direct ?: (provider == 'bbb' && path ==~ /frame\/stone\/oak/ ? zip.getEntry("assets/bbb/textures/block/frame/oak.png") : null)
        }
        def rewriteModel = { value, material, provider, zip ->
            def localized = rewrite(value, material.id, provider)
            providerTextureRefs(value, provider).each { texture ->
                /* BBB template parents sometimes use a deliberately overridden texture
                 * variable. Keep such a provider placeholder untouched; localize only
                 * a concrete provider texture we have materialized into the JAR. */
                if (textureEntry(zip, provider, texture) != null) {
                    localized = localized.replace("${provider}:block/${texture}", "${ns}:block/derived/${material.id}/${provider}/${texture}")
                }
            }
            localized
        }
        def copyTexture = { zip, minecraft, provider, material, path, copied ->
            def texturePath = path.startsWith('block/') ? path.substring('block/'.length()) : path
            def entry=textureEntry(zip,provider,texturePath)
            if(entry==null || !copied.add("texture:${path}")) return
            def targetPath = path.startsWith('block/') ? path.substring('block/'.length()) : path
            def target=new File(root,"assets/${ns}/textures/derived/${material.id}/${provider}/${targetPath}.png")
            def targetEntry=minecraft.getEntry("assets/minecraft/textures/block/${material.texture}.png")
            if(targetEntry==null)throw new GradleException("Missing target material texture minecraft:block/${material.texture} for ${material.id}")
            target.parentFile.mkdirs();target.bytes=materializeTexture(zip.getInputStream(entry).bytes,minecraft.getInputStream(targetEntry).bytes)
        }
        def copyModel
        copyModel = { zip, minecraft, provider, material, path, copied ->
            def entry=zip.getEntry("assets/${provider}/models/${path}.json")
            if(entry==null || !copied.add("model:${path}")) return false
            def raw=text(zip,entry)
            def targetModelPath = path.startsWith('block/') ? "block/derived/${material.id}/${provider}/${path.substring('block/'.length())}" : "item/derived/${material.id}/${provider}/${path.substring('item/'.length())}"
            write("assets/${ns}/models/${targetModelPath}.json",rewriteModel(raw,material,provider,zip))
            providerRefs(raw,provider).each { ref ->
                if(!copyModel(zip,minecraft,provider,material,ref.kind+'/'+ref.path,copied)) copyTexture(zip,minecraft,provider,material,ref.kind+'/'+ref.path,copied)
            }
            providerTextureRefs(raw, provider).each { texture -> copyTexture(zip,minecraft,provider,material,"block/${texture}",copied) }
            true
        }
        def materializeState = { zip, minecraft, provider, material, raw, copied ->
            providerRefs(raw,provider).each { ref ->
                if(!copyModel(zip,minecraft,provider,material,ref.kind+'/'+ref.path,copied)) copyTexture(zip,minecraft,provider,material,ref.kind+'/'+ref.path,copied)
            }
        }
        def itemModel = { model -> "{ \"model\": { \"type\": \"minecraft:model\", \"model\": \"${ns}:block/${model}\" } }" }
        def selfLoot = { name -> "{ \"type\": \"minecraft:block\", \"pools\":[{\"conditions\":[{\"condition\":\"minecraft:survives_explosion\"}],\"entries\":[{\"type\":\"minecraft:item\",\"name\":\"${ns}:${name}\"}],\"rolls\":1.0}],\"random_sequence\":\"${ns}:blocks/${name}\"}" }
        def recipe = { ingredient,name -> "{ \"type\":\"minecraft:stonecutting\",\"ingredient\":\"minecraft:${ingredient}\",\"result\":{\"id\":\"${ns}:${name}\"}}" }
        def advancement = { ingredient,name -> "{\"parent\":\"minecraft:recipes/root\",\"criteria\":{\"has_material\":{\"conditions\":{\"items\":[{\"items\":\"minecraft:${ingredient}\"}]},\"trigger\":\"minecraft:inventory_changed\"},\"has_the_recipe\":{\"conditions\":{\"recipe\":\"${ns}:${name}\"},\"trigger\":\"minecraft:recipe_unlocked\"}},\"requirements\":[[\"has_the_recipe\",\"has_material\"]],\"rewards\":{\"recipes\":[\"${ns}:${name}\"]}}" }
        def lang=[:];def pickaxe=[]
        def generated = { material,form,state,zip,provider,copied,minecraft ->
            if (c4ProviderOwned(material, form.id)) return
            def name="${material.id}_${form.id}";def matcher=(state =~ /\"model\"\s*:\s*\"([^\"]+)\"/);if(!matcher.find())throw new GradleException("No model in provider blockstate for ${name}");def model=matcher.group(1)
            materializeState(zip,minecraft,provider,material,state,copied)
            write("assets/${ns}/blockstates/${name}.json",rewrite(state,material.id,provider));write("assets/${ns}/models/block/${name}.json","{ \"parent\": \"${rewrite(model,material.id,provider)}\" }");write("assets/${ns}/items/${name}.json",itemModel(name));write("data/${ns}/loot_table/blocks/${name}.json",selfLoot(name));write("data/${ns}/recipe/${name}_from_stonecutting.json",recipe(material.block,name));write("data/${ns}/advancement/recipes/decorations/${name}_from_stonecutting.json",advancement(material.block,name));lang["block.${ns}.${name}"]="${material.display} ${form.display}";pickaxe<<"${ns}:${name}"
        }
        def bbb=new java.util.zip.ZipFile(bbbReferenceJar);def windows=new java.util.zip.ZipFile(windowsReferenceJar);def paths=new java.util.zip.ZipFile(pathsReferenceJar);def minecraft=new java.util.zip.ZipFile(minecraftClientJar)
        try {
            masonryMaterials.each { material ->
                def bbbCopied=[] as Set;def windowsCopied=[] as Set;def pathsCopied=[] as Set;def minecraftCopied=[] as Set
                bbbForms.each { form -> def e=bbb.getEntry("assets/bbb/blockstates/stone_${form.id}.json");def raw=text(bbb,e);generated(material,form,raw,bbb,'bbb',bbbCopied,minecraft) }
                pathForms.each { form -> def e=paths.getEntry("assets/mcwpaths/blockstates/${material.path}_${form.id}.json") ?: paths.getEntry("assets/mcwpaths/blockstates/andesite_${form.id}.json");def raw=text(paths,e);generated(material,form,raw,paths,'mcwpaths',pathsCopied,minecraft) }
                pavingForms.each { form -> def e=paths.getEntry("assets/mcwpaths/blockstates/${material.paving}_${form.id}.json") ?: paths.getEntry("assets/mcwpaths/blockstates/andesite_${form.id}.json");def raw=text(paths,e);generated(material,form,raw,paths,'mcwpaths',pathsCopied,minecraft) }
                windowForms.each { form -> def e=windows.getEntry("assets/mcwwindows/blockstates/${material.window}_${form.id}.json") ?: windows.getEntry("assets/mcwwindows/blockstates/stone_${form.id}.json");def raw=text(windows,e);generated(material,form,raw,windows,'mcwwindows',windowsCopied,minecraft) }
                windowsForms.each { form -> def e=windows.getEntry("assets/mcwwindows/blockstates/${material[form.source]}_${form.id}.json");if(e==null)throw new GradleException("Macaw Windows lacks ${material[form.source]}_${form.id}");def raw=text(windows,e);generated(material,form,raw,windows,'mcwwindows',windowsCopied,minecraft) }
                [['id':'button','display':'Button'],['id':'pressure_plate','display':'Pressure Plate']].each { form ->
                    if (!c4ProviderOwned(material, form.id)) {
                        def e=minecraft.getEntry("assets/minecraft/blockstates/stone_${form.id}.json")
                        if(e==null)throw new GradleException("Minecraft lacks canonical stone ${form.id} resource")
                        generated(material,form,text(minecraft,e),minecraft,'minecraft',minecraftCopied,minecraft)
                    }
                }
                [['id':'running_bond','display':'Running Bond'],['id':'flagstone','display':'Flagstone'],['id':'windmill_weave','display':'Windmill Weave'],['id':'crystal_floor','display':'Crystal Floor']].each { pattern ->
                    [['id':pattern.id,'display':pattern.display],['id':pattern.id+'_slab','display':pattern.display+' Slab'],['id':pattern.id+'_stairs','display':pattern.display+' Stairs']].each { form ->
                        if (!c4ProviderOwned(material, form.id)) { def e=paths.getEntry("assets/mcwpaths/blockstates/andesite_${form.id}.json"); def raw=text(paths,e);generated(material,form,raw,paths,'mcwpaths',pathsCopied,minecraft) }
                    }
                }
            }
        } finally { bbb.close();windows.close();paths.close();minecraft.close() }
        write("assets/${ns}/lang/en_us.json",groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(lang)));write('data/minecraft/tags/block/mineable/pickaxe.json',groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([replace:false,values:pickaxe])))
    }
}

processResources { dependsOn tasks.named('generateMasonryResources');inputs.property 'version',project.version;from(generatedResourcesDir);filesMatching('fabric.mod.json'){expand 'version':project.version} }
tasks.withType(JavaCompile).configureEach { options.release=25 }
test { useJUnitPlatform();systemProperty 'projectRoot',projectDir.absolutePath }
java { withSourcesJar() }
tasks.register('verifyProductionJarIsolation') {
    group='verification';description='Verifies C4 ownership, resource closure, and production-JAR isolation.';dependsOn tasks.named('jar')
    doLast {
        def archive=new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile)
        def providers=[minecraft:new java.util.zip.ZipFile(minecraftClientJar),bbb:new java.util.zip.ZipFile(bbbReferenceJar),mcwpaths:new java.util.zip.ZipFile(pathsReferenceJar),mcwwindows:new java.util.zip.ZipFile(windowsReferenceJar)]
        try {
            def foreign=archive.entries().findAll{it.name.endsWith('.class')&&!it.name.startsWith('dev/resivore/amc/')}.collect{it.name}
            if(!foreign.isEmpty())throw new GradleException("Production JAR contains foreign classes: ${foreign}")
            def forms=['button','pressure_plate'] + bbbForms*.id + pathForms*.id + pavingForms*.id + ['running_bond','running_bond_slab','running_bond_stairs','flagstone','flagstone_slab','flagstone_stairs','windmill_weave','windmill_weave_slab','windmill_weave_stairs','crystal_floor','crystal_floor_slab','crystal_floor_stairs'] + windowForms*.id + windowsForms*.id
            def owned=masonryMaterials.collectMany { material -> forms.findAll { form -> !c4ProviderOwned(material,form) }.collect { form -> "${material.id}_${form}" } }
            if(owned.size()!=237 || masonryMaterials.size()*forms.size()!=646)throw new GradleException("C4 matrix is not 646 total / 237 AMC-owned")
            ['blockstates','items'].each { kind -> if(archive.entries().count{it.name.startsWith("assets/architectural_material_closure/${kind}/")&&it.name.endsWith('.json')}!=owned.size())throw new GradleException("Expected exactly ${owned.size()} AMC ${kind}") }
            owned.each { name -> ['assets/architectural_material_closure/blockstates/'+name+'.json','assets/architectural_material_closure/items/'+name+'.json','assets/architectural_material_closure/models/block/'+name+'.json','data/architectural_material_closure/loot_table/blocks/'+name+'.json'].each { path -> if(archive.getEntry(path)==null)throw new GradleException("Missing C4 resource ${path}") } }
            archive.entries().findAll { it.name.endsWith('.json') }.each { entry ->
                def raw=archive.getInputStream(entry).getText('UTF-8'); def refs=(raw =~ /(architectural_material_closure|minecraft|bbb|mcwpaths|mcwwindows):(block|item)\/([^\"#]+)/)
                while(refs.find()) { def namespace=refs.group(1),kind=refs.group(2),path=refs.group(3); def source=namespace=='architectural_material_closure' ? archive : providers[namespace]; def texturePath=namespace=='architectural_material_closure' ? path : "${kind}/${path}"; if(source==null || (source.getEntry("assets/${namespace}/models/${kind}/${path}.json")==null && source.getEntry("assets/${namespace}/textures/${texturePath}.png")==null))throw new GradleException("Unresolved ${namespace} resource in ${entry.name}: ${kind}/${path}") }
            }
        } finally { archive.close();providers.values().each { it.close() } }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyProductionJarIsolation') }
tasks.register('stageCanaryArtifact',Copy) { group='distribution';description='Stages the verified current canary JAR for local retention.';dependsOn tasks.named('check');from{tasks.named('jar').get().archiveFile.get().asFile};into(layout.projectDirectory.dir('artifacts')) }
