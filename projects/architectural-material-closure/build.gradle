plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = '0.1.0-canary33'
group = 'dev.resivore'
layout.buildDirectory = layout.projectDirectory.dir('build/c33')

repositories {
    mavenCentral()
}

def providerJar = file(providers.gradleProperty('windowsJar').getOrElse('../../originals/mods/mcw-windows-2.4.2-mc26.2fabric.jar'))
def pathsJar = file(providers.gradleProperty('pathsJar').getOrElse('../../originals/mods/mcw-paths-1.1.1-mc26.2fabric.jar'))
def bbbJar = file(providers.gradleProperty('bbbJar').getOrElse(
        '../building-but-better/artifacts/bbb-fabric-26.2-2.0pre4+26.2-enderscape-dev.7.jar'))
def stoneShutterJar = file(providers.gradleProperty('stoneShutterJar').getOrElse('artifacts/AMC C9.jar'))
def enderscapeJar = file(providers.gradleProperty('enderscapeJar').getOrElse('../../originals/mods/enderscape-fabric-3.0.2+mc26.2.jar'))
def ribbitsJar = file(providers.gradleProperty('ribbitsJar').getOrElse(
        '../ribbits-26.2/artifacts/ribbits-private-reconstruction-4.1.6+26.2-mynx-canary27.jar'))
def doorsJar = file(providers.gradleProperty('doorsJar').getOrElse('../../originals/mods/mcw-doors-1.1.5-mc26.2fabric.jar'))
def trapdoorsJar = file(providers.gradleProperty('trapdoorsJar').getOrElse('../../originals/mods/mcw-trapdoors-1.1.5-mc26.2fabric.jar'))
def c32Jar = file(providers.gradleProperty('c32Jar').getOrElse('artifacts/AMC C32.jar'))
def c31Jar = file(providers.gradleProperty('c31Jar').getOrElse('artifacts/AMC C31.jar'))
def c30Jar = file(providers.gradleProperty('c30Jar').getOrElse('artifacts/AMC C30.jar'))
def c29Jar = file(providers.gradleProperty('c29Jar').getOrElse('artifacts/AMC C29.jar'))
def c28Jar = file(providers.gradleProperty('c28Jar').getOrElse('artifacts/AMC C28.jar'))
def c27Jar = file(providers.gradleProperty('c27Jar').getOrElse('artifacts/AMC C27.jar'))
def c26Jar = file(providers.gradleProperty('c26Jar').getOrElse('artifacts/AMC C26.jar'))
def c25Jar = file(providers.gradleProperty('c25Jar').getOrElse('artifacts/AMC C25.jar'))
def c24Jar = file(providers.gradleProperty('c24Jar').getOrElse('artifacts/AMC C24.jar'))
def c23Jar = file(providers.gradleProperty('c23Jar').getOrElse('artifacts/AMC C23.jar'))
def previousJar = file(providers.gradleProperty('c22Jar').getOrElse('artifacts/AMC C22.jar'))
def clientJar = file(providers.gradleProperty('vanillaClient').getOrElse(
        new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/26.2/minecraft-client.jar').path))
def python = providers.gradleProperty('python').getOrElse('python')
def privateResources = layout.buildDirectory.dir('gen')

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.157.0+26.2'
    compileOnly files(doorsJar)
    implementation files(providerJar, bbbJar, pathsJar)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.register('generateAmcResources', Exec) {
    inputs.files('tools/wood_accessories.py', 'tools/bamboo.py', 'tools/trapdoors.py', trapdoorsJar, 'tools/doors.py', doorsJar, 'tools/mossy_oak.py', ribbitsJar, 'tools/generate.py', 'tools/moss.py', 'tools/masonry.py', 'tools/paths.py', pathsJar, providerJar, clientJar, bbbJar, stoneShutterJar, enderscapeJar)
    outputs.dir(privateResources)
    commandLine python, 'tools/generate.py', providerJar, clientJar, bbbJar, pathsJar, stoneShutterJar, enderscapeJar, ribbitsJar, doorsJar, trapdoorsJar, privateResources.get().asFile
}

sourceSets.main.resources.srcDir(privateResources)
processResources {
    dependsOn 'generateAmcResources'
    inputs.property 'version', project.version
    inputs.property 'historicalProviderMetadataEol', 'crlf'
    // Preserve the historical packaged bytes on both LF and CRLF checkouts.
    filesMatching(['amc.enderscape.mixins.json', 'resourcepacks/enderscape/pack.mcmeta',
                   'amc.ribbits.mixins.json', 'resourcepacks/ribbits/pack.mcmeta']) {
        filter(eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('crlf'), org.apache.tools.ant.filters.FixCrLfFilter)
    }
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.named('jar') {
    archiveFileName = 'AMC C33.jar'
}

tasks.register('verifyAmcJar', Exec) {
    dependsOn jar
    inputs.files('tools/verify_accessories.py', c32Jar, 'tools/verify_bamboo.py', c31Jar, 'tools/verify_trapdoors.py', 'tools/trapdoor_previews.py', trapdoorsJar, c30Jar, 'tools/verify_doors.py', doorsJar, c29Jar, 'tools/verify_oak.py', ribbitsJar, c28Jar, 'tools/verify_c28.py', c27Jar, 'tools/verify_c27.py', c26Jar, 'tools/verify_c26.py', c25Jar, 'tools/verify_c25.py', c24Jar, 'tools/verify_c24.py', c23Jar, enderscapeJar, 'tools/verify_c22.py', previousJar, 'tools/verify.py', 'tools/verify_moss.py', 'tools/verify_masonry.py', 'tools/verify_mud.py', 'tools/verify_paths.py', pathsJar, providerJar, clientJar, bbbJar, jar.archiveFile)
    commandLine python, 'tools/verify_accessories.py', jar.archiveFile.get().asFile, providerJar, clientJar, bbbJar, pathsJar, previousJar, c23Jar, enderscapeJar, c24Jar, c25Jar, c26Jar, c27Jar, c28Jar, ribbitsJar, c29Jar, doorsJar, c30Jar, trapdoorsJar, c31Jar, c32Jar
}

check.dependsOn 'verifyAmcJar'

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'amc-tests'
        enableGameTests = true
        enableClientGameTests = false
        clearRunDirectory = false
    }
}

// The intended pack omits Extended Block Shapes. Its historical C21 audit
// can still be run explicitly using a read-only reference JAR.
if (providers.gradleProperty('extshapeReference').isPresent()) {
    dependencies { gametestRuntimeOnly files(providers.gradleProperty('extshapeReference').get()) }
}

def withTrapdoors = !providers.gradleProperty('withoutTrapdoors').isPresent()
if (withTrapdoors) {
    dependencies { gametestRuntimeOnly files(trapdoorsJar) }
}

def withDoors = !providers.gradleProperty('withoutDoors').isPresent()
if (withDoors) {
    dependencies { gametestRuntimeOnly files(doorsJar) }
}

def withRibbits = providers.gradleProperty('withRibbits').isPresent()
if (withRibbits) {
    dependencies {
        gametestRuntimeOnly files(ribbitsJar, providers.gradleProperty('ribbitsTestDeps').get().split(';'))
    }
}
def withEnderscape = providers.gradleProperty('withEnderscape').isPresent()
tasks.named('processGametestResources') {
    if (withRibbits) {
        from(providers.gradleProperty('matchaFoodResources').getOrElse(
                '../matcha-flavoured-data/src/main/resources/resourcepacks/matcha_flavoured_1_12')) {
            include 'data/**'
            exclude 'data/minecraft/loot_table/advancement/custom/root.json', 'data/main/advancement/mechanics/wither_test.json'
        }
    }
    inputs.property 'withEnderscape', withEnderscape
    inputs.property 'withRibbits', withRibbits
    filesMatching('fabric.mod.json') {
        expand optionalTests: (withEnderscape ? ', "dev.resivore.amc.test.EnderscapeTests"' : '') +
                (withRibbits ? ', "dev.resivore.amc.test.MossyOakTests"' : '')
    }
}
if (withEnderscape) {
    def support = fileTree(providers.gradleProperty('enderscapeTestDeps').getOrElse('build/c33/test-dependencies')) {
        include '*.jar'
    }
    dependencies { gametestRuntimeOnly files(enderscapeJar, support) }
}
loom.runs.named('gameTest') {
    vmArg "-Damc.test.ribbits=${withRibbits}"
    vmArg "-Damc.test.doors=${withDoors}"
    vmArg "-Damc.test.trapdoors=${withTrapdoors}"
    def woods = withRibbits && withEnderscape ? 'both' : withRibbits ? 'ribbits' : withEnderscape ? 'present' : 'absent'
    def mode = !withTrapdoors ? "without-trapdoors-${woods}" : !withDoors ? "without-doors-${woods}" : woods
    runDir "build/c33/gametest-${mode}"
    vmArg "-Damc.test.enderscape=${withEnderscape}"
    vmArg '-Dfabric-api.gametest.filter=amc-tests:*'
}
