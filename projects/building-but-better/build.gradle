    configureTests {
        createSourceSet = true
        modId = 'zz_bbb_enderscape_fixture'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

loom.runs.named('gameTest') {
    vmArg '-Dfabric-api.gametest.filter=zz_bbb_enderscape_fixture:*'
}

def absentGameTest = providers.gradleProperty('bbbAbsentGameTest')
        .map { it.toBoolean() }.orElse(false)

def expectedBaselineName = 'bbb-fabric-26.2-2.0pre4+26.2-pale-oak-dev.6.jar'
def expectedBaselineSize = 1_149_534L
def expectedBaselineSha256 = '0D54034725C3E354515C78BCEE32AB2CB5CE764A33E0602419E26C78AAEF8C5A'
def expectedOriginalName = 'bbb-fabric-2.0pre4.jar'
def expectedOriginalSize = 1_701_505L
def expectedOriginalSha256 = '1E7AE114AAEC53475133E11C607FC65DCE493BBA5897EAF0044D53959B508FC0'
def expectedEnderscapeName = 'enderscape-fabric-3.0.2+mc26.2.jar'
def expectedEnderscapeSize = 104_162_822L
def expectedEnderscapeSha256 = '9FCC4F59CA88E91F90E7C7D18289F2F859F20C810EEBCCA924764AA15236C40B'
def expectedEnderscapeLicenseSha256 = '8D141B1F4E73FFBDD5CDC2B73F4A20931E0D57B7E8989EC7DC777C8814AD729A'
def curatedRegistryFile = layout.projectDirectory.file('src/porting/curated-registry.json')
def stagedResourcesDir = layout.buildDirectory.dir('generated/bbb-resources')
def minecraftClientJar = providers.provider { loom.minecraftProvider.minecraftClientJar }
def optionalPackPath = 'resourcepacks/enderscape_wood_families'

def sha256Bytes = { byte[] input ->
    MessageDigest.getInstance('SHA-256').digest(input).collect { String.format('%02X', it) }.join()
}

def sha256 = { File input ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[64 * 1024]
        for (int read; (read = stream.read(buffer)) >= 0;) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02X', it) }.join()
}

def locateBaselineJar = {
    def configured = providers.gradleProperty('bbbBaselineJar')
            .orElse(providers.environmentVariable('BBB_BASELINE_JAR')).orNull
    if (configured) return file(configured)
    File local = new File(projectDir, "artifacts/${expectedBaselineName}")
    if (local.isFile()) return local
    File cursor = projectDir
    while (cursor != null) {
        File candidate = new File(cursor, "projects/building-but-better/artifacts/${expectedBaselineName}")
        if (candidate.isFile()) return candidate
        cursor = cursor.parentFile
    }
    local
}

def locateEnderscapeJar = {
    def configured = providers.gradleProperty('enderscapeJar')
            .orElse(providers.environmentVariable('BBB_ENDERSCAPE_JAR')).orNull
    if (configured) return file(configured)
    File cursor = projectDir
    while (cursor != null) {
        File candidate = new File(cursor, "originals/mods/${expectedEnderscapeName}")
        if (candidate.isFile()) return candidate
        cursor = cursor.parentFile
    }
    new File(projectDir, "../../originals/mods/${expectedEnderscapeName}")
}

def requireExactFile = { File input, String label, String expectedName, expectedSize, String expectedHash ->
    if (!input.isFile()) throw new GradleException("Missing exact ${label} ${expectedName}: ${input}")
    if (input.name != expectedName) {
        throw new GradleException("${label} filename mismatch: expected ${expectedName}, found ${input.name}")
    }
    if (input.length() != expectedSize) {
        throw new GradleException("${label} size mismatch: expected ${expectedSize}, found ${input.length()}")
    }
    String actual = sha256(input)
    if (actual != expectedHash) {
        throw new GradleException("${label} SHA-256 mismatch: expected ${expectedHash}, found ${actual}")
    }
    input
}

def requireExactBaselineJar = {
    requireExactFile(locateBaselineJar(), 'accepted BBB baseline', expectedBaselineName,
            expectedBaselineSize, expectedBaselineSha256)
}

def requireExactEnderscapeJar = {
    File input = requireExactFile(locateEnderscapeJar(), 'Enderscape provider', expectedEnderscapeName,
            expectedEnderscapeSize, expectedEnderscapeSha256)
    ZipFile zip = new ZipFile(input)
    try {
        def entry = zip.getEntry('LICENSE_enderscape')
        if (entry == null) throw new GradleException('Enderscape provider is missing LICENSE_enderscape')
        byte[] license = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
        if (sha256Bytes(license) != expectedEnderscapeLicenseSha256) {
            throw new GradleException('Enderscape license bytes differ from the audited 3.0.2 provider')
        }
        String text = new String(license, StandardCharsets.UTF_8)
        if (!text.contains('Assets License (All Rights Reserved)')
                || !text.contains('src/main/resources/assets/')) {
            throw new GradleException('Enderscape provider no longer declares the audited ARR asset boundary')
        }
    } finally {
        zip.close()
    }
    input
}

def brightness = { int rgb ->
    (299 * ((rgb >> 16) & 0xff) + 587 * ((rgb >> 8) & 0xff) + 114 * (rgb & 0xff)) / 1000
}

tasks.register('stageBbbResources') {
    group = 'bbb porting'
    description = 'Copies the exact accepted base closure and generates local-only Enderscape BBB resources.'
    inputs.file(curatedRegistryFile)
    inputs.file(providers.provider { locateBaselineJar() })
            .withPropertyName('exactAcceptedBbbBaseline').withPathSensitivity(PathSensitivity.NONE)
    inputs.file(providers.provider { locateEnderscapeJar() })
            .withPropertyName('exactEnderscapeProvider').withPathSensitivity(PathSensitivity.NONE)
    inputs.file(minecraftClientJar)
            .withPropertyName('minecraft262ClientJar').withPathSensitivity(PathSensitivity.NONE)
    inputs.properties([
            expectedBaselineName: expectedBaselineName,
            expectedBaselineSize: expectedBaselineSize,
            expectedBaselineSha256: expectedBaselineSha256,
            expectedEnderscapeName: expectedEnderscapeName,
            expectedEnderscapeSize: expectedEnderscapeSize,
            expectedEnderscapeSha256: expectedEnderscapeSha256,
            expectedEnderscapeLicenseSha256: expectedEnderscapeLicenseSha256
    ])
    outputs.dir(stagedResourcesDir)

    doLast {
        File baselineJar = requireExactBaselineJar()
        File enderscapeJar = requireExactEnderscapeJar()
        File vanillaJar = minecraftClientJar.get()
        if (!vanillaJar.isFile()) throw new GradleException("Missing Minecraft ${project.minecraft_version} client JAR")

        Map manifest = new JsonSlurper().parse(curatedRegistryFile.asFile) as Map
        Set<String> baseBlocks = new LinkedHashSet<>()
        manifest.wood_materials.each { material ->
            manifest.wood_forms.each { form -> baseBlocks.add("${material}_${form}" as String) }
        }
        manifest.stone_materials.each { material ->
            manifest.stone_forms.each { form -> baseBlocks.add("${material}_${form}" as String) }
        }
        baseBlocks.addAll(manifest.standalone_blocks as Collection<String>)
        Set<String> baseItems = new LinkedHashSet<>(baseBlocks)
        baseItems.addAll(manifest.standalone_items as Collection<String>)
        if (baseBlocks.size() != 171 || baseItems.size() != 172) {
            throw new GradleException("Accepted BBB base registry drift: ${baseBlocks.size()}/${baseItems.size()}")
        }

        List<Map> providers = manifest.enderscape_wood_families as List<Map>
        if (providers*.material != ['veiled', 'celestial', 'murublight']) {
            throw new GradleException("Unexpected explicit Enderscape family catalog ${providers*.material}")
        }
        Map<String, String> visualAxes = [
                veiled: 'enderscape:veiled_log',
                celestial: 'enderscape:celestial_stem',
                murublight: 'enderscape:murublight_stem'
        ]
        Map<String, String> providerSlabs = providers.collectEntries {
            [(it.material as String): "enderscape:${it.material}_slab".toString()]
        }
        Map<String, String> providerLogTags = [
                veiled: '#enderscape:veiled_logs',
                celestial: '#enderscape:celestial_stems',
                murublight: '#enderscape:murublight_stems'
        ]

        File outputRoot = stagedResourcesDir.get().asFile
        project.delete(outputRoot)
        outputRoot.mkdirs()
        File packRoot = new File(outputRoot, optionalPackPath)
        packRoot.mkdirs()

        ZipFile baseline = new ZipFile(baselineJar)
        ZipFile enderscape = new ZipFile(enderscapeJar)
        ZipFile vanilla = new ZipFile(vanillaJar)
        try {
            Map<String, java.util.zip.ZipEntry> baseEntries = baseline.entries().findAll { !it.directory }
                    .collectEntries { [(it.name): it] }
            Map<String, java.util.zip.ZipEntry> enderscapeEntries = enderscape.entries().findAll { !it.directory }
                    .collectEntries { [(it.name): it] }
            Map<String, java.util.zip.ZipEntry> vanillaEntries = vanilla.entries().findAll { !it.directory }
                    .collectEntries { [(it.name): it] }

            def bytesFrom = { ZipFile zip, Map entries, String name, String label ->
                def entry = entries[name]
                if (entry == null) throw new GradleException("${label} is missing ${name}")
                zip.getInputStream(entry).withCloseable { it.readAllBytes() }
            }
            def writeBytes = { File targetRoot, String name, byte[] bytes ->
                File destination = new File(targetRoot, name)
                destination.parentFile.mkdirs()
                Files.write(destination.toPath(), bytes)
            }
            def writeJson = { File targetRoot, String name, Object json ->
                byte[] bytes = (JsonOutput.prettyPrint(JsonOutput.toJson(json)) + System.lineSeparator())
                        .getBytes(StandardCharsets.UTF_8)
                writeBytes(targetRoot, name, bytes)
            }

            Map acceptedStaging = new JsonSlurper().parse(
                    bytesFrom(baseline, baseEntries, 'bbb-resource-staging.json', 'Accepted BBB baseline')) as Map
            if (acceptedStaging.original_file != expectedOriginalName
                    || (acceptedStaging.original_size as long) != expectedOriginalSize
                    || acceptedStaging.original_sha256 != expectedOriginalSha256
                    || (acceptedStaging.exact_asset_closure_entries as int) != 1_467) {
                throw new GradleException('Accepted BBB baseline lost its exact upstream ARR closure provenance')
            }

            baseEntries.keySet().findAll {
                it.startsWith('assets/bbb/') || it.startsWith('data/')
            }.sort().each { name ->
                writeBytes(outputRoot, name, bytesFrom(baseline, baseEntries, name, 'Accepted BBB baseline'))
            }
            byte[] enderscapeLicense = bytesFrom(enderscape, enderscapeEntries,
                    'LICENSE_enderscape', 'Enderscape provider')
            writeBytes(outputRoot, 'META-INF/licenses/LICENSE_enderscape', enderscapeLicense)

            writeJson(packRoot, 'pack.mcmeta', [pack: [
                    min_format: [107, 1], max_format: [107, 1],
                    description: 'Building But Better — explicit Enderscape wood families'
            ]])

            def transformMaterialText = { String source, Map spec, boolean modelText ->
                String family = spec.material as String
                String result = source.replace('cherry', family)
                if (modelText) {
                    String visualPath = (visualAxes[family] as String).substring('enderscape:'.length())
                    result = result
                            .replace("\"plant_type\": \"${family}_leaves\"", '"plant_type": "cherry_leaves"')
                            .replace("\"bbb:block/lattice/plants/${family}_leaves\"", '"bbb:block/lattice/plants/cherry_leaves"')
                            .replace("\"minecraft:block/${family}_planks\"", "\"enderscape:block/${family}_planks\"")
                            .replace("\"block/${family}_planks\"", "\"enderscape:block/${family}_planks\"")
                            .replace("\"minecraft:block/${family}_log_top\"", "\"enderscape:block/${visualPath}_top\"")
                            .replace("\"minecraft:block/${family}_log\"", "\"enderscape:block/${visualPath}\"")
                            .replace("\"block/${family}_log_top\"", "\"enderscape:block/${visualPath}_top\"")
                            .replace("\"block/${family}_log\"", "\"enderscape:block/${visualPath}\"")
                } else {
                    result = result
                            .replace("minecraft:${family}_planks", spec.source_planks as String)
                            .replace("minecraft:stripped_${family}_log", spec.beam_material as String)
                            .replace("minecraft:${family}_slab", providerSlabs[family])
                            .replace("#minecraft:${family}_logs", providerLogTags[family])
                }
                result
            }

            List<String> cherryModels = baseEntries.keySet().findAll {
                it.startsWith('assets/bbb/models/') && it.contains('cherry') && it.endsWith('.json')
            }.findAll { it != 'assets/bbb/models/block/lattice/plants/cherry_leaves.json' }.sort()
            if (cherryModels.size() != 59) {
                throw new GradleException("Expected 59 retained Cherry model templates, found ${cherryModels.size()}")
            }

            List<String> textureTemplates = [
                    'balustrade/cherry_sides.png', 'balustrade/cherry_top.png',
                    'beam/cherry.png', 'beam/cherry_top.png',
                    'frame/cherry.png', 'frame/cherry_sticks.png',
                    'lantern/cherry.png', 'lattice/cherry.png',
                    'pallet/cherry_pallet.png', 'sanded_planks/cherry.png',
                    'trim/cherry.png', 'trim/cherry_bottom.png',
                    'trim/cherry_middle.png', 'trim/cherry_top.png'
            ]
            def decodeImage = { byte[] bytes, String identity ->
                BufferedImage image = ImageIO.read(new ByteArrayInputStream(bytes))
                if (image == null) throw new GradleException("Unable to decode ${identity}")
                image
            }
            BufferedImage cherryPlanks = decodeImage(bytesFrom(vanilla, vanillaEntries,
                    'assets/minecraft/textures/block/cherry_planks.png', 'Minecraft client'), 'Cherry planks')
            Set<Integer> cherryColors = new LinkedHashSet<>()
            for (int y = 0; y < cherryPlanks.height; y++) for (int x = 0; x < cherryPlanks.width; x++) {
                int argb = cherryPlanks.getRGB(x, y)
                if ((argb >>> 24) == 255) cherryColors.add(argb & 0x00ffffff)
            }
            List<Integer> cherryPalette = cherryColors.toList().sort { a, b ->
                int compare = brightness(a as int) <=> brightness(b as int)
                compare != 0 ? compare : (a as int) <=> (b as int)
            }
            Map<String, Object> textureMetadata = new LinkedHashMap<>()

            providers.each { spec ->
                String family = spec.material as String
                manifest.wood_forms.each { form ->
                    String sourceBlockstate = "assets/bbb/blockstates/cherry_${form}.json"
                    String targetBlockstate = "assets/bbb/blockstates/${family}_${form}.json"
                    String sourceText = new String(bytesFrom(baseline, baseEntries, sourceBlockstate,
                            'Accepted BBB baseline'), StandardCharsets.UTF_8)
                    writeBytes(packRoot, targetBlockstate,
                            transformMaterialText(sourceText, spec, true).getBytes(StandardCharsets.UTF_8))
                    writeJson(packRoot, "assets/bbb/items/${family}_${form}.json", [
                            model: [type: 'minecraft:model', model: "bbb:item/${family}_${form}"]
                    ])
                }
                cherryModels.each { sourceName ->
                    String targetName = sourceName.replace('cherry', family)
                    String sourceText = new String(bytesFrom(baseline, baseEntries, sourceName,
                            'Accepted BBB baseline'), StandardCharsets.UTF_8)
                    writeBytes(packRoot, targetName,
                            transformMaterialText(sourceText, spec, true).getBytes(StandardCharsets.UTF_8))
                }

                String providerTexture = "assets/enderscape/textures/block/${family}_planks.png"
                BufferedImage providerPlanks = decodeImage(bytesFrom(enderscape, enderscapeEntries,
                        providerTexture, 'Enderscape provider'), providerTexture)
                Set<Integer> targetColors = new LinkedHashSet<>()
                for (int y = 0; y < providerPlanks.height; y++) for (int x = 0; x < providerPlanks.width; x++) {
                    int argb = providerPlanks.getRGB(x, y)
                    if ((argb >>> 24) == 255) targetColors.add(argb & 0x00ffffff)
                }
                List<Integer> targetPalette = targetColors.toList().sort { a, b ->
                    int compare = brightness(a as int) <=> brightness(b as int)
                    compare != 0 ? compare : (a as int) <=> (b as int)
                }
                if (targetPalette.isEmpty()) throw new GradleException("${family} plank palette is empty")
                Map<Integer, Integer> rankedPalette = new LinkedHashMap<>()
                cherryPalette.eachWithIndex { color, index ->
                    int targetIndex = Math.round(index * (targetPalette.size() - 1) /
                            (float) Math.max(1, cherryPalette.size() - 1))
                    rankedPalette[color as int] = targetPalette[targetIndex] as int
                }
                Map<String, Map<String, Integer>> familyStats = new LinkedHashMap<>()
                textureTemplates.each { relative ->
                    String sourceName = "assets/bbb/textures/block/${relative}"
                    BufferedImage source = decodeImage(bytesFrom(baseline, baseEntries, sourceName,
                            'Accepted BBB baseline'), sourceName)
                    BufferedImage target = new BufferedImage(source.width, source.height, BufferedImage.TYPE_INT_ARGB)
                    int mappedWoodPixels = 0
                    int preservedOpaquePixels = 0
                    int transparentPixels = 0
                    for (int y = 0; y < source.height; y++) for (int x = 0; x < source.width; x++) {
                        int argb = source.getRGB(x, y)
                        int alpha = (argb >>> 24) & 0xff
                        if (alpha != 0 && alpha != 255) {
                            throw new GradleException("Audited BBB template ${sourceName} contains partial alpha ${alpha}")
                        }
                        Integer replacement = alpha == 255 ? rankedPalette[argb & 0x00ffffff] : null
                        if (replacement != null) {
                            target.setRGB(x, y, (0xff << 24) | (replacement & 0x00ffffff))
                            mappedWoodPixels++
                        } else {
                            target.setRGB(x, y, argb)
                            if (alpha == 0) transparentPixels++ else preservedOpaquePixels++
                        }
                    }
                    if (mappedWoodPixels == 0) {
                        throw new GradleException("Generated ${family} texture from ${relative} has no audited wood pixels")
                    }
                    if (relative == 'lantern/cherry.png' && preservedOpaquePixels != 36) {
                        throw new GradleException("${family} Lantern must preserve exactly 36 material-independent pixels")
                    }
                    String targetRelative = relative.replace('cherry', family)
                    ByteArrayOutputStream encoded = new ByteArrayOutputStream()
                    if (!ImageIO.write(target, 'PNG', encoded)) throw new GradleException("Unable to encode ${targetRelative}")
                    writeBytes(packRoot, "assets/bbb/textures/block/${targetRelative}", encoded.toByteArray())
                    familyStats[targetRelative] = [mapped_wood_pixels: mappedWoodPixels,
                            preserved_opaque_pixels: preservedOpaquePixels, transparent_pixels: transparentPixels]
                }
                textureMetadata[family] = [source_texture: "enderscape:block/${family}_planks",
                        mapping_method: 'audited-cherry-wood-mask+luminance-ranked-provider-palette',
                        source_palette_size: cherryPalette.size(), target_palette_size: targetPalette.size(),
                        sheets: familyStats]

                List<String> cherryRecipes = baseEntries.keySet().findAll {
                    it ==~ /data\/bbb\/recipe\/cherry_.+\.json/
                }.sort()
                if (cherryRecipes.size() != 13) {
                    throw new GradleException("Expected 13 Cherry recipe templates, found ${cherryRecipes.size()}")
                }
                cherryRecipes.each { sourceName ->
                    String targetName = sourceName.replace('cherry', family)
                    String transformed = transformMaterialText(new String(bytesFrom(baseline, baseEntries,
                            sourceName, 'Accepted BBB baseline'), StandardCharsets.UTF_8), spec, false)
                    Map json = new JsonSlurper().parseText(transformed) as Map
                    json['fabric:load_conditions'] = [condition: 'fabric:registry_contains',
                            registry: 'minecraft:item', values: ["bbb:${family}_beam"]]
                    writeJson(packRoot, targetName, json)
                }

                List<String> cherryAdvancements = baseEntries.keySet().findAll {
                    it ==~ /data\/bbb\/advancement\/recipes\/cherry_.+\.json/
                }.sort()
                if (cherryAdvancements.size() != 9) {
                    throw new GradleException("Expected 9 Cherry advancement templates, found ${cherryAdvancements.size()}")
                }
                cherryAdvancements.each { sourceName ->
                    String targetName = sourceName.replace('cherry', family)
                    String transformed = transformMaterialText(new String(bytesFrom(baseline, baseEntries,
                            sourceName, 'Accepted BBB baseline'), StandardCharsets.UTF_8), spec, false)
                    Map json = new JsonSlurper().parseText(transformed) as Map
                    json['fabric:load_conditions'] = [condition: 'fabric:registry_contains',
                            registry: 'minecraft:item', values: ["bbb:${family}_beam"]]
                    writeJson(packRoot, targetName, json)
                }

                manifest.wood_forms.each { form ->
                    String sourceName = "data/bbb/loot_table/blocks/cherry_${form}.json"
                    String targetName = "data/bbb/loot_table/blocks/${family}_${form}.json"
                    String transformed = transformMaterialText(new String(bytesFrom(baseline, baseEntries,
                            sourceName, 'Accepted BBB baseline'), StandardCharsets.UTF_8), spec, false)
                    Map json = new JsonSlurper().parseText(transformed) as Map
                    json['fabric:load_conditions'] = [condition: 'fabric:registry_contains',
                            registry: 'minecraft:block', values: ["bbb:${family}_${form}"]]
                    writeJson(packRoot, targetName, json)
                }
            }

            Map<String, String> language = new LinkedHashMap<>()
            providers.each { spec ->
                String family = spec.material as String
                String familyLabel = family.split('_').collect { it.capitalize() }.join(' ')
                manifest.wood_forms.each { form ->
                    String formLabel = (form as String).split('_').collect { it.capitalize() }.join(' ')
                    language["block.bbb.${family}_${form}"] = "${familyLabel} ${formLabel}"
                }
            }
            writeJson(packRoot, 'assets/bbb/lang/en_us.json', language)

            baseEntries.keySet().findAll { it ==~ /data\/.+\/tags\/(block|item)\/.+\.json/ }.sort().each { name ->
                Map tag = new JsonSlurper().parse(bytesFrom(baseline, baseEntries, name,
                        'Accepted BBB baseline')) as Map
                List optionalValues = []
                (tag.values ?: []).each { value ->
                    String id = value instanceof Map ? value.id : value
                    if (id instanceof String && id.startsWith('bbb:cherry_')) {
                        providers.each { spec ->
                            String replacement = id.replace('bbb:cherry_', "bbb:${spec.material}_")
                            Map optional = value instanceof Map ? new LinkedHashMap(value as Map) : [:]
                            optional.id = replacement
                            optional.required = false
                            optionalValues.add(optional)
                        }
                    }
                }
                if (!optionalValues.isEmpty()) writeJson(packRoot, name, [replace: false, values: optionalValues])
            }

            writeJson(outputRoot, 'bbb-resource-staging.json', [
                    accepted_baseline: [file: baselineJar.name, size: baselineJar.length(), sha256: expectedBaselineSha256],
                    upstream_original: [file: expectedOriginalName, size: expectedOriginalSize,
                            sha256: expectedOriginalSha256,
                            exact_asset_closure_entries: acceptedStaging.exact_asset_closure_entries],
                    enderscape_provider: [file: enderscapeJar.name, size: enderscapeJar.length(),
                            sha256: expectedEnderscapeSha256, license_sha256: expectedEnderscapeLicenseSha256,
                            asset_license: 'All Rights Reserved',
                            output_policy: 'ignored build output and local retained artifact only'],
                    base_registry: [blocks: baseBlocks.size(), items: baseItems.size(), wood_families: 12],
                    optional_registry: [blocks: 33, items: 33, wood_families: 3],
                    provider_present_registry: [blocks: 204, items: 205, wood_families: 15],
                    enderscape_generated_textures: textureMetadata,
                    optional_pack: 'bbb:enderscape_wood_families'
            ])
        } finally {
            vanilla.close()
            enderscape.close()
            baseline.close()
        }
    }
}

sourceSets {
    main.resources.srcDir(stagedResourcesDir)
}

processResources {
    dependsOn tasks.named('stageBbbResources')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    from(layout.projectDirectory.file('LICENSE.md')) {
        into 'META-INF'
        rename { 'LICENSE_bbb-port.md' }
    }
}

tasks.named('processGametestResources') {
    inputs.property('bbbAbsentGameTest', absentGameTest)
    exclude 'fabric.absent.mod.json'
    if (absentGameTest.get()) exclude 'data/enderscape/**'
    doLast {
        if (absentGameTest.get()) {
            Files.copy(layout.projectDirectory.file('src/gametest/resources/fabric.absent.mod.json').asFile.toPath(),
                    new File(destinationDir, 'fabric.mod.json').toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.register('verifyCuratedResources') {
    group = 'verification'
    dependsOn tasks.named('stageBbbResources')
    doLast {
        File baselineJar = requireExactBaselineJar()
        File enderscapeJar = requireExactEnderscapeJar()
        File root = stagedResourcesDir.get().asFile
        File pack = new File(root, optionalPackPath)
        Map manifest = new JsonSlurper().parse(curatedRegistryFile.asFile) as Map
        List<Map> providers = manifest.enderscape_wood_families as List<Map>

        def countJson = { File directory ->
            directory.isDirectory() ? fileTree(directory).matching { include '**/*.json' }.files.size() : 0
        }
        List<Integer> baseCounts = [
                countJson(new File(root, 'assets/bbb/blockstates')),
                countJson(new File(root, 'assets/bbb/models')),
                countJson(new File(root, 'assets/bbb/items')),
                countJson(new File(root, 'data/bbb/recipe')),
                countJson(new File(root, 'data/bbb/advancement/recipes')),
                countJson(new File(root, 'data/bbb/loot_table/blocks')),
                fileTree(new File(root, 'data')).matching { include '**/tags/**/*.json' }.files.size(),
                fileTree(new File(root, 'assets/bbb/textures')).files.size()
        ]
        if (baseCounts != [171, 1_132, 172, 224, 140, 171, 44, 248]) {
            throw new GradleException("Accepted base closure drift: ${baseCounts}")
        }

        int basePngs = 0
        int baseTransparent = 0
        fileTree(new File(root, 'assets/bbb/textures')).matching { include '**/*.png' }.files.each { file ->
            BufferedImage image = ImageIO.read(file)
            if (image == null) throw new GradleException("Unreadable base PNG ${file}")
            basePngs++
            boolean transparent = false
            for (int y = 0; y < image.height; y++) for (int x = 0; x < image.width; x++) {
                int alpha = (image.getRGB(x, y) >>> 24) & 0xff
                if (alpha == 0) transparent = true
                else if (alpha != 255) throw new GradleException("Partial alpha in ${file}")
            }
            if (transparent) baseTransparent++
        }
        if (basePngs != 244 || baseTransparent != 112) {
            throw new GradleException("Accepted PNG closure drift: ${basePngs}/${baseTransparent}")
        }

        ZipFile baseline = new ZipFile(baselineJar)
        ZipFile enderscape = new ZipFile(enderscapeJar)
        ZipFile vanilla = new ZipFile(minecraftClientJar.get())
        try {
            baseline.entries().findAll { !it.directory && (it.name.startsWith('assets/bbb/') || it.name.startsWith('data/')) }
                    .each { entry ->
                        File staged = new File(root, entry.name)
                        if (!staged.isFile()) throw new GradleException("Base staging omitted accepted resource ${entry.name}")
                        byte[] expected = baseline.getInputStream(entry).withCloseable { it.readAllBytes() }
                        if (!Arrays.equals(expected, Files.readAllBytes(staged.toPath()))) {
                            throw new GradleException("Base staging changed accepted resource bytes ${entry.name}")
                        }
                    }

            List<Integer> packCounts = [
                    countJson(new File(pack, 'assets/bbb/blockstates')),
                    countJson(new File(pack, 'assets/bbb/models')),
                    countJson(new File(pack, 'assets/bbb/items')),
                    countJson(new File(pack, 'data/bbb/recipe')),
                    countJson(new File(pack, 'data/bbb/advancement/recipes')),
                    countJson(new File(pack, 'data/bbb/loot_table/blocks')),
                    fileTree(new File(pack, 'assets/bbb/textures')).matching { include '**/*.png' }.files.size()
            ]
            if (packCounts != [33, 177, 33, 39, 27, 33, 42]) {
                throw new GradleException("Enderscape pack closure drift: ${packCounts}")
            }
            if (!new File(pack, 'pack.mcmeta').isFile()) throw new GradleException('Missing optional pack.mcmeta')
            if (new File(pack, 'assets/enderscape').exists() || new File(pack, 'data/enderscape').exists()) {
                throw new GradleException('Optional pack copied raw Enderscape namespace resources')
            }

            int packTransparent = 0
            fileTree(new File(pack, 'assets/bbb/textures')).matching { include '**/*.png' }.files.each { file ->
                BufferedImage image = ImageIO.read(file)
                boolean transparent = false
                for (int y = 0; y < image.height; y++) for (int x = 0; x < image.width; x++) {
                    int alpha = (image.getRGB(x, y) >>> 24) & 0xff
                    if (alpha == 0) transparent = true
                    else if (alpha != 255) throw new GradleException("Partial alpha in ${file}")
                }
                if (transparent) packTransparent++
            }
            if (packTransparent != 18) throw new GradleException("Expected 18 transparent optional sprites, found ${packTransparent}")

            Map<String, java.util.zip.ZipEntry> endEntries = enderscape.entries().findAll { !it.directory }
                    .collectEntries { [(it.name): it] }
            Map<String, java.util.zip.ZipEntry> vanillaEntries = vanilla.entries().findAll { !it.directory }
                    .collectEntries { [(it.name): it] }
            def resourceExists = { String reference, String kind ->
                if (reference.startsWith('#')) return true
                int colon = reference.indexOf(':')
                String namespace = colon < 0 ? 'minecraft' : reference.substring(0, colon)
                String path = colon < 0 ? reference : reference.substring(colon + 1)
                String suffix = kind == 'texture' ? '.png' : '.json'
                if (namespace == 'bbb') {
                    return new File(pack, "assets/bbb/${kind}s/${path}${suffix}").isFile()
                            || new File(root, "assets/bbb/${kind}s/${path}${suffix}").isFile()
                }
                if (namespace == 'minecraft') {
                    return vanillaEntries.containsKey("assets/minecraft/${kind}s/${path}${suffix}".toString())
                }
                if (namespace == 'enderscape') {
                    return endEntries.containsKey("assets/enderscape/${kind}s/${path}${suffix}".toString())
                }
                false
            }
            def validateModelSelectors
            validateModelSelectors = { Object value, File owner ->
                if (value instanceof Map) {
                    value.each { key, nested ->
                        if (key == 'model' && nested instanceof String && !resourceExists(nested, 'model')) {
                            throw new GradleException("${owner} references missing model ${nested}")
                        }
                        validateModelSelectors(nested, owner)
                    }
                } else if (value instanceof Collection) value.each { validateModelSelectors(it, owner) }
            }
            fileTree(new File(pack, 'assets/bbb/models')).matching { include '**/*.json' }.files.each { modelFile ->
                Map model = new JsonSlurper().parse(modelFile) as Map
                if (model.parent instanceof String && !resourceExists(model.parent as String, 'model')) {
                    throw new GradleException("${modelFile} references missing parent ${model.parent}")
                }
                if (model.textures instanceof Map) {
                    model.textures.values().findAll { it instanceof String && !it.startsWith('#') }.each { texture ->
                        if (!resourceExists(texture as String, 'texture')) {
                            throw new GradleException("${modelFile} references missing texture ${texture}")
                        }
                    }
                }
            }
            fileTree(new File(pack, 'assets/bbb/blockstates')).matching { include '*.json' }.files.each {
                validateModelSelectors(new JsonSlurper().parse(it), it)
            }
            fileTree(new File(pack, 'assets/bbb/items')).matching { include '*.json' }.files.each {
                validateModelSelectors(new JsonSlurper().parse(it), it)
            }

            providers.each { spec ->
                String family = spec.material as String
                Set<String> forms = fileTree(new File(pack, 'assets/bbb/blockstates')).matching {
                    include "${family}_*.json"
                }.files.collect { it.name.substring(family.length() + 1).replaceFirst(/\.json$/, '') } as Set<String>
                if (forms != (manifest.wood_forms as Set<String>)) {
                    throw new GradleException("${family} form mismatch: ${forms}")
                }
                ['balustrade', 'beam', 'wall'].each { form ->
                    String text = Files.readString(new File(pack, "data/bbb/recipe/${family}_${form}.json").toPath())
                    if (!text.contains(spec.beam_material as String)) throw new GradleException("${family}_${form} lost beam material")
                }
                ['lattice', 'pallet', 'support', 'trim'].each { form ->
                    String text = Files.readString(new File(pack, "data/bbb/recipe/${family}_${form}.json").toPath())
                    if (!text.contains(spec.source_planks as String)) throw new GradleException("${family}_${form} lost source planks")
                }
                ['frame', 'lantern'].each { form ->
                    String text = Files.readString(new File(pack, "data/bbb/recipe/${family}_${form}.json").toPath())
                    if (!text.contains("enderscape:${family}_slab")) throw new GradleException("${family}_${form} lost provider slab")
                }
                fileTree(new File(pack, 'data')).matching { include '**/*.json' }.files.findAll {
                    it.name.startsWith("${family}_")
                }.each { dataFile ->
                    String text = Files.readString(dataFile.toPath())
                    if ((dataFile.path.contains('recipe') || dataFile.path.contains('advancement')
                            || dataFile.path.contains('loot_table')) && !text.contains('fabric:load_conditions')) {
                        throw new GradleException("Optional data lacks registry load condition: ${dataFile}")
                    }
                }
            }

            Set<String> baseTagPaths = fileTree(new File(root, 'data')).matching { include '**/tags/**/*.json' }.files.collect {
                root.toPath().relativize(it.toPath()).toString().replace('\\', '/')
            } as Set<String>
            fileTree(new File(pack, 'data')).matching { include '**/tags/**/*.json' }.files.each { tagFile ->
                String relative = pack.toPath().relativize(tagFile.toPath()).toString().replace('\\', '/')
                if (!baseTagPaths.contains(relative)) throw new GradleException("Optional tag has no accepted base identity ${relative}")
                Map tag = new JsonSlurper().parse(tagFile) as Map
                if ((tag.values as Collection).any { !(it instanceof Map) || it.required != false }) {
                    throw new GradleException("Optional tag values must be required:false in ${tagFile}")
                }
            }

            Map staging = new JsonSlurper().parse(new File(root, 'bbb-resource-staging.json')) as Map
            if (staging.accepted_baseline.sha256 != expectedBaselineSha256
                    || staging.enderscape_provider.sha256 != expectedEnderscapeSha256
                    || staging.enderscape_provider.asset_license != 'All Rights Reserved'
                    || staging.upstream_original.exact_asset_closure_entries != 1_467) {
                throw new GradleException('Generated staging provenance is incomplete')
            }
        } finally {
            vanilla.close()
            enderscape.close()
            baseline.close()
        }

        println 'BBB_CURATED_RESOURCES base=171/172 optional=33/33 providerPresent=204/205 models=1132+177 pngs=244+42 recipes=224+39'
    }
}

tasks.register('verifyProductionMixinContract') {
    group = 'verification'
    description = 'Inspects the production JAR for the BBB LivingEntity rope mixin contract.'
    dependsOn tasks.named('jar')
    doLast {
        File productionJar = tasks.named('jar').get().archiveFile.get().asFile
        if (!productionJar.isFile()) throw new GradleException("Missing production JAR ${productionJar}")
        ZipFile zip = new ZipFile(productionJar)
        try {
            def requireEntry = { String name ->
                def entry = zip.getEntry(name)
                if (entry == null) throw new GradleException("Production JAR is missing ${name}")
                entry
            }
            Map mixins = new JsonSlurper().parse(zip.getInputStream(requireEntry('bbb.mixins.json'))) as Map
            Map mod = new JsonSlurper().parse(zip.getInputStream(requireEntry('fabric.mod.json'))) as Map
            if (mixins.required != true || !(mixins.mixins as Collection).contains('LivingEntityRopeClimbMixin')) {
                throw new GradleException('Production JAR does not package the required LivingEntity rope mixin')
            }
            if (!((mod.mixins ?: []) as Collection).contains('bbb.mixins.json')) {
                throw new GradleException('Production fabric.mod.json does not declare bbb.mixins.json')
            }
            requireEntry('com/starfish_studios/bbb/mixin/LivingEntityRopeClimbMixin.class')
            def jarManifest = new java.util.jar.Manifest(zip.getInputStream(requireEntry('META-INF/MANIFEST.MF')))
            if (jarManifest.mainAttributes.getValue('Fabric-Mapping-Namespace') != 'official') {
                throw new GradleException('Production BBB JAR is not remapped into the official Minecraft namespace')
            }
            println "BBB_PRODUCTION_MIXIN jar=${productionJar.name} mixin=LivingEntityRopeClimbMixin namespace=official"
        } finally {
            zip.close()
        }
    }
}

tasks.register('verifyProductionEnderscapeBoundary') {
    group = 'verification'
    description = 'Proves the optional pack is exact and no Enderscape code/raw namespace is bundled.'
    dependsOn tasks.named('jar'), tasks.named('verifyCuratedResources')
    doLast {
        File productionJar = tasks.named('jar').get().archiveFile.get().asFile
        ZipFile zip = new ZipFile(productionJar)
        try {
            List<String> names = zip.entries().findAll { !it.directory }.collect { it.name }
            List<String> forbidden = names.findAll {
                it.startsWith('net/penumbra/enderscape/') || it.startsWith('assets/enderscape/')
                        || it.startsWith('data/enderscape/') || it.toLowerCase(Locale.ROOT).endsWith('.jar')
            }
            if (!forbidden.isEmpty()) throw new GradleException("Production JAR bundles forbidden provider content: ${forbidden}")
            List<String> foreignClasses = names.findAll { it.endsWith('.class') && !it.startsWith('com/starfish_studios/bbb/') }
            if (!foreignClasses.isEmpty()) throw new GradleException("Production JAR bundles unintended classes: ${foreignClasses}")
            if (names.toSet().size() != names.size()) throw new GradleException('Production JAR contains duplicate entries')
            String prefix = "${optionalPackPath}/"
            int blockstates = names.count { it.startsWith("${prefix}assets/bbb/blockstates/") && it.endsWith('.json') }
            int models = names.count { it.startsWith("${prefix}assets/bbb/models/") && it.endsWith('.json') }
            int items = names.count { it.startsWith("${prefix}assets/bbb/items/") && it.endsWith('.json') }
            int pngs = names.count { it.startsWith("${prefix}assets/bbb/textures/") && it.endsWith('.png') }
            int recipes = names.count { it.startsWith("${prefix}data/bbb/recipe/") && it.endsWith('.json') }
            int advancements = names.count { it.startsWith("${prefix}data/bbb/advancement/recipes/") && it.endsWith('.json') }
            int loot = names.count { it.startsWith("${prefix}data/bbb/loot_table/blocks/") && it.endsWith('.json') }
            if ([blockstates, models, items, pngs, recipes, advancements, loot] != [33, 177, 33, 42, 39, 27, 33]) {
                throw new GradleException("Production optional-pack closure drift: ${[blockstates, models, items, pngs, recipes, advancements, loot]}")
            }
            Map mod = new JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json'))) as Map
            if ((mod.depends as Map).containsKey('enderscape') || mod.suggests?.enderscape != '>=3.0.2') {
                throw new GradleException('Production metadata no longer keeps Enderscape optional')
            }
            println "BBB_ENDERSCAPE_BOUNDARY jar=${productionJar.name} optionalPack=33/33 providerClasses=0 rawProviderNamespaces=0"
        } finally {
            zip.close()
        }
    }
}

