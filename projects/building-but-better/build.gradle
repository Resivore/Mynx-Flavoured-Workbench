tasks.register('productionLivingEntityMixinTest', JavaExec) {
    group = 'verification'
    description = 'Applies BBB\'s packaged rope mixin to the production Minecraft 26.2 server classes.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')
    inputs.files(productionBbbJar, productionMinecraftServerJar)
    mainClass = 'com.starfish_studios.bbb.porting.ProductionLivingEntityMixinHarness'
    classpath = files({
        def mainOutput = sourceSets.main.output.files
        def runtime = configurations.testRuntimeClasspath.files.findAll { candidate ->
            !mainOutput.contains(candidate) && !candidate.name.startsWith('minecraft-merged-deobf-')
        }
        sourceSets.test.output.files.findAll { it.exists() } + runtime + [productionMinecraftServerJar, productionBbbJar.get().asFile]
    })
    systemProperty 'fabric.development', 'false'
    systemProperty 'fabric.unitTest', 'true'
    systemProperty 'mixin.debug.verbose', 'true'
    systemProperty 'mixin.debug.countInjections', 'true'
    doFirst {
        if (!productionMinecraftServerJar.isFile()) {
            throw new GradleException("Missing production Minecraft ${project.minecraft_version} server JAR: ${productionMinecraftServerJar}")
        }
        args = [productionBbbJar.get().asFile.absolutePath]
        workingDir.mkdirs()
    }
    workingDir layout.buildDirectory.dir('production-living-entity-mixin-test')
}

