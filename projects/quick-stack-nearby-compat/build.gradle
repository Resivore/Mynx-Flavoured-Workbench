plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        'quick-stack-nearby' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            if (project.hasProperty('qsnClientSmoke')) {
                vmArg '-Dquickstacknearby.smokeTest=true'
                vmArg '-Dquickstacknearby.smokeMinecraftProfile=development-client'
                vmArg '-Dquickstacknearby.smokeReleaseProfile=0.4.0-workbench-canary11'
            }
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'quick-stack-nearby-c11-gametests'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    gametestImplementation files('../container-slot-reservations/artifacts/container-slot-reservations-0.1.0-canary4.jar')
    gametestImplementation files('../double-barrels/artifacts/doublebarrels-fabric-26.2-1.0.1+26.2-canary2.jar')
}

processResources {
    def resourceProperties = [version: project.version, mixin_compatibility_level: 'JAVA_25']
    inputs.properties resourceProperties
    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
    filesMatching('*.mixins.json') {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('LICENSE-GPL-3.0') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('NOTICE')
}
