    useJUnitPlatform()
    dependsOn tasks.named('jar')
    inputs.files(
            productionJar,
            xaeroJar,
            xaeroLibJar,
            worldMapJar,
            geckolibJar,
            ribbitsJar,
            historicalC3Jar,
            emfJar,
            etfJar,
            fabricApiJar,
            freshAnimationsPack,
            trinketsJar)
    systemProperty 'projectRoot', projectDir.absolutePath
    systemProperty 'patchJar', productionJar.get().asFile.absolutePath
    systemProperty 'xaeroJar', xaeroJar.absolutePath
    systemProperty 'xaeroLibJar', xaeroLibJar.get().asFile.absolutePath
    systemProperty 'worldMapJar', worldMapJar.absolutePath
    systemProperty 'geckolibJar', geckolibJar.absolutePath
    systemProperty 'ribbitsJar', ribbitsJar.absolutePath
    systemProperty 'historicalC3Jar', historicalC3Jar.absolutePath
    systemProperty 'emfJar', emfJar.absolutePath
    systemProperty 'etfJar', etfJar.absolutePath
    systemProperty 'fabricApiJar', fabricApiJar.absolutePath
    systemProperty 'freshAnimationsPack', freshAnimationsPack.absolutePath
    systemProperty 'trinketsJar', trinketsJar.absolutePath
}

def productionMixinTest = tasks.register('productionMixinTest', JavaExec) {
    group = 'verification'
    description = 'Applies packaged Canary 3 and the specified EMF companion through exact production Fabric Knot/Mixin without launching Minecraft.'
    dependsOn tasks.named('testClasses'), tasks.named('jar')

    inputs.file(productionJar)
    inputs.files(
            xaeroJar, worldMapJar, geckolibJar, ribbitsJar, emfCandidateJar,
            emfJar, etfJar, fabricApiJar, yungsApiJar, clothConfigJar,
            customPortalsJar, yaclJar, matchaHeartJar, xaeroLibJar,
            trinketsJar,
            productionMinecraftClientJar)

    mainClass = 'dev.resivore.ribbitsxaeroicons.ProductionMixinApplicationHarness'
    classpath = files({
        def mainOutput = sourceSets.main.output.files
        def runtime = configurations.testRuntimeClasspath.files.findAll { candidate ->
            !mainOutput.contains(candidate) &&
                    !candidate.name.startsWith('minecraft-merged-deobf-') &&
                    candidate != xaeroJar && candidate != geckolibJar &&
                    candidate != ribbitsJar && candidate != xaeroLibJar.get().asFile
        }
        sourceSets.test.output.files.findAll { it.exists() } + runtime + [
                productionMinecraftClientJar,
                productionJar.get().asFile,
                xaeroJar,
                worldMapJar,
                geckolibJar,
                ribbitsJar,
                emfCandidateJar,
                emfJar,
                etfJar,
                fabricApiJar,
                yungsApiJar,
                clothConfigJar,
                customPortalsJar,
                yaclJar,
                matchaHeartJar,
                trinketsJar
        ]
    })
    systemProperty 'fabric.development', 'false'
    systemProperty 'fabric.unitTest', 'true'
    systemProperty 'mixin.debug.verbose', 'true'
    systemProperty 'mixin.debug.countInjections', 'true'

    doFirst {
        if (!productionMinecraftClientJar.isFile()) {
            throw new GradleException(
                    "Missing production Minecraft 26.2 client JAR: ${productionMinecraftClientJar}")
        }
        def discoveredMods = [
                productionJar.get().asFile,
                xaeroJar,
                worldMapJar,
                geckolibJar,
                ribbitsJar,
                emfCandidateJar,
                emfJar,
                etfJar,
                fabricApiJar,
                yungsApiJar,
                clothConfigJar,
                customPortalsJar,
                yaclJar,
                matchaHeartJar,
                trinketsJar
        ]
        systemProperty 'fabric.addMods',
                discoveredMods.collect { it.absolutePath }.join(File.pathSeparator)
        args = [
                productionJar.get().asFile.absolutePath,
                xaeroJar.absolutePath,
                geckolibJar.absolutePath,
                ribbitsJar.absolutePath,
                emfCandidateJar.absolutePath,
                emfJar.absolutePath,
                trinketsJar.absolutePath
        ]
        workingDir.mkdirs()
    }
    workingDir layout.buildDirectory.dir('production-mixin-test')
}

tasks.register('verifyClientOnlyArtifact') {
    group = 'verification'
    dependsOn tasks.named('jar')
    inputs.file(productionJar)
    doLast {
        def artifact = productionJar.get().asFile
        def archive = zipTree(artifact)
        def paths = []
        archive.visit { details ->
            if (!details.directory) {
                paths.add(details.relativePath.pathString.replace('\\', '/'))
            }
        }

        def metadata = new JsonSlurper().parse(
                archive.matching { include 'fabric.mod.json' }.singleFile)
        if (metadata.id != 'ribbits_xaero_entity_icons_compat' ||
                metadata.version != project.version || metadata.environment != 'client') {
            throw new GradleException("Unexpected client metadata in ${artifact.name}")
        }
        if (metadata.mixins != ['ribbits_xaero_entity_icons_compat.mixins.json']) {
            throw new GradleException("Unexpected mixin registration in ${artifact.name}")
        }
        if (metadata.depends?.minecraft != '=26.2' ||
                metadata.depends?.fabricloader != '>=0.19.3' ||
                metadata.depends?.java != '>=25') {
            throw new GradleException("Unexpected runtime dependency floor in ${artifact.name}")
        }
        if (metadata.suggests?.xaerominimap != '*' ||
                metadata.suggests?.geckolib != '*' ||
                metadata.suggests?.ribbits != '*') {
            throw new GradleException("Unexpected provider-capability metadata in ${artifact.name}")
        }

        def mixinConfig = new JsonSlurper().parse(
                archive.matching {
                    include 'ribbits_xaero_entity_icons_compat.mixins.json'
                }.singleFile)
        def expectedMixins = [
                'RadarIconCacheAccessor',
                'RadarIconCreatorMixin',
                'RadarIconEntityCacheMixin',
                'RadarIconManagerMixin',
                'RadarIconVariantHandlerMixin'
        ]
        if (mixinConfig.required != true || mixinConfig.minVersion != '0.8' ||
                mixinConfig['package'] != 'dev.resivore.ribbitsxaeroicons.mixin' ||
                mixinConfig.compatibilityLevel != 'JAVA_25' ||
                mixinConfig.plugin !=
                        'dev.resivore.ribbitsxaeroicons.mixin.RibbitsXaeroIconsMixinPlugin' ||
                mixinConfig.client != expectedMixins ||
                mixinConfig.injectors?.defaultRequire != 1) {
            throw new GradleException("Unexpected fail-closed mixin contract in ${artifact.name}")
        }

        def forbiddenPrefixes = [
                'net/minecraft/', 'xaero/', 'com/geckolib/',
                'com/yungnickyoung/', 'traben/', 'META-INF/jars/', 'assets/', 'data/'
        ]
        def invalid = paths.findAll { path ->
            forbiddenPrefixes.any { path.startsWith(it) } ||
                    (path.endsWith('.class') &&
                            !path.startsWith('dev/resivore/ribbitsxaeroicons/')) ||
                    path.endsWith('.refmap.json')
        }
        if (!invalid.isEmpty()) {
            throw new GradleException(
                    "Compatibility JAR contains forbidden or foreign entries: ${invalid.unique().sort()}")
        }

        def required = [
                'fabric.mod.json',
                'ribbits_xaero_entity_icons_compat.mixins.json',
                'dev/resivore/ribbitsxaeroicons/CompatibilityActivation.class',
                'dev/resivore/ribbitsxaeroicons/RibbitGeoIconProvider.class',
                'dev/resivore/ribbitsxaeroicons/RibbitHeadSelector.class',
                'dev/resivore/ribbitsxaeroicons/mixin/RibbitsXaeroIconsMixinPlugin.class',
                'dev/resivore/ribbitsxaeroicons/mixin/RadarIconCacheAccessor.class',
                'dev/resivore/ribbitsxaeroicons/mixin/RadarIconCreatorMixin.class',
                'dev/resivore/ribbitsxaeroicons/mixin/RadarIconVariantHandlerMixin.class',
                'dev/resivore/ribbitsxaeroicons/mixin/RadarIconManagerMixin.class'
        ]
        def missing = required.findAll { !paths.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Compatibility JAR is missing required entries: ${missing}")
        }
    }
}

tasks.register('stageCanaryArtifact', Copy) {
    group = 'build'
    description = 'Stages the verified Canary 3 JAR in this task worktree artifact directory.'
    dependsOn tasks.named('check')
    from(productionJar)
    into(layout.projectDirectory.dir('artifacts'))
}

tasks.named('check') {
    dependsOn productionMixinTest
    dependsOn tasks.named('verifyClientOnlyArtifact')
}

java {
    withSourcesJar()
}
