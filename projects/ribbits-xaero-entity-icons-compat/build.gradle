import groovy.json.JsonSlurper
import java.security.MessageDigest
import org.gradle.api.tasks.bundling.AbstractArchiveTask

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def requiredFileProperty = { String propertyName, String description ->
    def suppliedPath = providers.gradleProperty(propertyName).orNull
    if (suppliedPath == null || suppliedPath.isBlank()) {
        throw new GradleException("Pass -P${propertyName}=<path to ${description}>")
    }
    def resolved = file(suppliedPath)
    if (!resolved.isFile()) {
        throw new GradleException("${description} was not found at ${resolved}")
    }
    resolved
}

def xaeroJar = requiredFileProperty('xaero_jar', 'xaerominimap-fabric-26.2-26.4.2.jar')
def worldMapJar = requiredFileProperty('world_map_jar', 'xaeroworldmap-fabric-26.2-1.44.2.jar')
def geckolibJar = requiredFileProperty('geckolib_jar', 'a Fabric 26.2 GeckoLib validation JAR (5.5.4 primary; 5.5.1 regression)')
def ribbitsJar = requiredFileProperty('ribbits_jar', 'ribbits-private-reconstruction-4.1.6+26.2-mynx-canary9.jar')
def historicalC3Jar = requiredFileProperty('historical_c3_jar', 'xaero-emf-entity-icon-compat-0.1.0-canary3.jar')
def emfCandidateJar = providers.gradleProperty('emf_candidate_jar').map { file(it) }.getOrElse(historicalC3Jar)
def emfJar = requiredFileProperty('emf_jar', 'entity_model_features-3.2.6-26.2-fabric.jar')
def etfJar = requiredFileProperty('etf_jar', 'entity_texture_features-7.1.1-26.2-fabric.jar')
def fabricApiJar = requiredFileProperty('fabric_api_jar', 'fabric-api-0.157.0+26.2.jar')
def freshAnimationsPack = requiredFileProperty('fresh_animations_pack', 'FreshAnimations_v1.10.5.zip')
def yungsApiJar = requiredFileProperty('yungs_api_jar', 'YungsApi-26.2-Fabric-6.1.1-compat.2.jar')
def clothConfigJar = requiredFileProperty('cloth_config_jar', 'cloth-config-26.2.155.jar')
def customPortalsJar = requiredFileProperty('custom_portals_jar', 'custom-portals 4.0.0 compatibility JAR')
def yaclJar = requiredFileProperty('yacl_jar', 'yet_another_config_lib_v3-3.9.6+26.2-fabric.jar')
def matchaHeartJar = requiredFileProperty('matcha_heart_jar', 'matcha-heart-death-compat-0.1.10-canary11.jar')
def trinketsJar = requiredFileProperty('trinkets_jar', 'trinkets-4.1.0-beta.3+26.2-inventory-compat-canary5.jar')
def xaeroLibJar = layout.buildDirectory.file('compile-deps/xaerolib-fabric-26.2-1.7.1.jar')
def productionMinecraftCache = new File(
        gradle.gradleUserHomeDir, "caches/fabric-loom/${project.minecraft_version}")
def productionMinecraftClientJar = new File(productionMinecraftCache, 'minecraft-client.jar')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    compileOnly files(xaeroJar, geckolibJar, ribbitsJar, xaeroLibJar)

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    testImplementation files(xaeroJar, geckolibJar, ribbitsJar, xaeroLibJar)
}

tasks.register('extractXaeroLib', Copy) {
    from(zipTree(xaeroJar)) {
        include 'META-INF/jars/xaerolib-fabric-26.2-1.7.1.jar'
        eachFile { details -> details.path = 'xaerolib-fabric-26.2-1.7.1.jar' }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir('compile-deps'))
    doLast {
        if (!xaeroLibJar.get().asFile.isFile()) {
            throw new GradleException('Exact nested XaeroLib 1.7.1 was not found in Xaero Minimap')
        }
    }
}

compileJava.dependsOn tasks.named('extractXaeroLib')
compileTestJava.dependsOn tasks.named('extractXaeroLib')

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def productionJar = tasks.named('jar').flatMap { it.archiveFile }

