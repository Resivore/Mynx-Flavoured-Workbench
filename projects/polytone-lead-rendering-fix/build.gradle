import groovy.json.JsonSlurper
import org.gradle.api.tasks.bundling.AbstractArchiveTask
import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def externalModsDirectory = providers.gradleProperty('polytoneExternalModsDir')
    .orElse(providers.environmentVariable('POLYTONE_EXTERNAL_MODS_DIR'))
    .orElse('../../originals/mods')
def externalMod = { filename -> file("${externalModsDirectory.get()}/${filename}") }
def polytoneReference = externalMod('polytone-26.2-6.3.1-fabric.jar')
def irisReference = externalMod('iris-fabric-1.11.2+mc26.2.jar')
def sodiumReference = externalMod('sodium-fabric-0.9.1+mc26.2.jar')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly files(polytoneReference)
    compileOnly files(irisReference)

    // Development-only smoke-test inputs. They are not bundled or declared by this companion.
    runtimeOnly files(polytoneReference)
    runtimeOnly files(irisReference)
    runtimeOnly files(sodiumReference)
    runtimeOnly 'net.fabricmc.fabric-api:fabric-api:0.157.0+26.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def packagedJar = tasks.named('jar').flatMap { it.archiveFile }
def leashAdapterSource = file(
    'src/main/java/dev/resivore/polytoneleadrenderingfix/mixin/LeashFeatureRendererMixin.java'
)
def leashRenderTypesSource = file(
    'src/main/java/dev/resivore/polytoneleadrenderingfix/LeashRenderTypes.java'
)
def polytoneLeadTexture = 'assets/minecraft/textures/entity/lead.png'
def polytoneLeadTextureSha256 = 'be48270065a58e1e89031d75038ed79b149e736936c28b9f7beb49b0204be59f'

tasks.register('verifyPolytoneLeashFallback') {
    group = 'verification'
    description = 'Verifies the exact Polytone 26.2 fallback seams and final companion artifact.'
    dependsOn tasks.named('jar')
    inputs.file(polytoneReference)
    inputs.file(irisReference)
    inputs.file(packagedJar)
    inputs.file(leashAdapterSource)
    inputs.file(leashRenderTypesSource)

    doLast {
        if (!polytoneReference.isFile()) {
            throw new GradleException("Missing exact Polytone validation baseline: ${polytoneReference}")
        }
        if (!irisReference.isFile()) {
            throw new GradleException("Missing exact Iris validation baseline: ${irisReference}")
        }

        ZipFile polytone = new ZipFile(polytoneReference)
        try {
            def requiredPolytoneEntries = [
                'net/mehvahdjukaar/polytone/PolytoneRenderTypes.class',
                'net/mehvahdjukaar/polytone/mixins/LeashMixin.class'
            ]
            requiredPolytoneEntries.each { entry ->
                if (polytone.getEntry(entry) == null) {
                    throw new GradleException("Polytone baseline is missing required leash seam ${entry}")
                }
            }

            def renderTypesBytes = polytone.getInputStream(
                polytone.getEntry('net/mehvahdjukaar/polytone/PolytoneRenderTypes.class')
            ).bytes
            def leashMixinBytes = polytone.getInputStream(
                polytone.getEntry('net/mehvahdjukaar/polytone/mixins/LeashMixin.class')
            ).bytes
            def renderTypesText = new String(renderTypesBytes, StandardCharsets.ISO_8859_1)
            def leashMixinText = new String(leashMixinBytes, StandardCharsets.ISO_8859_1)

            ['getLeashRenderType', 'addLeashVertexPair'].each { methodName ->
                if (!renderTypesText.contains(methodName) || !leashMixinText.contains(methodName)) {
                    throw new GradleException("Polytone baseline no longer exposes the required ${methodName} fallback seam")
                }
            }
            if (!leashMixinText.contains('Operation') || !leashMixinText.contains('cancel')) {
                throw new GradleException('Polytone leash mixin no longer exposes the vanilla RenderType/vertex fallback structure')
            }

            def leadTextureEntry = polytone.getEntry(polytoneLeadTexture)
            if (leadTextureEntry == null) {
                throw new GradleException("Polytone baseline is missing the textured-leash material ${polytoneLeadTexture}")
            }
            def leadTextureHash = MessageDigest.getInstance('SHA-256').digest(
                polytone.getInputStream(leadTextureEntry).bytes
            ).encodeHex().toString()
            if (leadTextureHash != polytoneLeadTextureSha256) {
                throw new GradleException("Polytone lead texture changed: expected ${polytoneLeadTextureSha256}, got ${leadTextureHash}")
            }
        } finally {
            polytone.close()
        }

        File artifact = packagedJar.get().asFile
        ZipFile patch = new ZipFile(artifact)
        try {
            def metadataEntry = patch.getEntry('fabric.mod.json')
            def mixinEntry = patch.getEntry('polytone_lead_rendering_fix.mixins.json')
            def mixinClassEntry = patch.getEntry(
                'dev/resivore/polytoneleadrenderingfix/mixin/PolytoneRenderTypesMixin.class'
            )
            def leashAdapterClassEntry = patch.getEntry(
                'dev/resivore/polytoneleadrenderingfix/mixin/LeashFeatureRendererMixin.class'
            )
            def leashRenderTypesClassEntry = patch.getEntry(
                'dev/resivore/polytoneleadrenderingfix/LeashRenderTypes.class'
            )
            if (metadataEntry == null || mixinEntry == null || mixinClassEntry == null || leashAdapterClassEntry == null ||
                    leashRenderTypesClassEntry == null) {
                throw new GradleException("Final artifact ${artifact.name} is missing required metadata or C3 leash mixins")
            }

            def metadata = new JsonSlurper().parse(patch.getInputStream(metadataEntry))
            if (metadata.id != 'polytone_lead_rendering_fix' || metadata.version != project.version ||
                    metadata.environment != 'client' || metadata.depends?.polytone != '*') {
                throw new GradleException("Final artifact ${artifact.name} has an invalid Polytone compatibility contract")
            }

            def mixinClassText = new String(
                patch.getInputStream(mixinClassEntry).bytes,
                StandardCharsets.ISO_8859_1
            )
            [
                'getLeashRenderType()Lnet/minecraft/client/renderer/rendertype/RenderType;',
                'addLeashVertexPair(Lcom/mojang/blaze3d/vertex/VertexConsumer;Lorg/joml/Matrix4fc;FFFFFFIZLnet/minecraft/client/renderer/entity/state/EntityRenderState$LeashState;)Z'
            ].each { descriptor ->
                if (!mixinClassText.contains(descriptor)) {
                    throw new GradleException("Final artifact ${artifact.name} is missing fallback injection descriptor ${descriptor}")
                }
            }

            def leashAdapterClassText = new String(
                patch.getInputStream(leashAdapterClassEntry).bytes,
                StandardCharsets.ISO_8859_1
            )
            [
                'LeashFeatureRenderer',
                'prepare(Lnet/minecraft/client/renderer/feature/LeashFeatureRenderer$Submit;)V',
                'addVertexPair(Lcom/mojang/blaze3d/vertex/VertexConsumer;Lorg/joml/Matrix4fc;FFFFFFIZLnet/minecraft/client/renderer/entity/state/EntityRenderState$LeashState;)V',
                'LeashRenderTypes',
                'segmentNormal'
            ].each { requiredC2Seam ->
                if (!leashAdapterClassText.contains(requiredC2Seam)) {
                    throw new GradleException("Final artifact ${artifact.name} is missing C4 leash seam ${requiredC2Seam}")
                }
            }

            def leashRenderTypesClassText = new String(
                patch.getInputStream(leashRenderTypesClassEntry).bytes,
                StandardCharsets.ISO_8859_1
            )
            ['TRIANGLE_STRIP', 'ENTITY', 'ENTITIES_SOLID', 'core/entity', 'Sampler0'].each { requiredRenderTypeSeam ->
                if (!leashRenderTypesClassText.contains(requiredRenderTypeSeam)) {
                    throw new GradleException("Final artifact ${artifact.name} is missing C3 RenderType seam ${requiredRenderTypeSeam}")
                }
            }
        } finally {
            patch.close()
        }

        def adapterSourceText = leashAdapterSource.getText(StandardCharsets.UTF_8.name())
        [
            'LeashRenderTypes.entityCompatibleTriangleStrip()',
            'LightCoordsUtil.pack(blockLight, skyLight)',
            'private static final float TEXTURE_COLOR = 1.0F',
            'setColor(TEXTURE_COLOR, TEXTURE_COLOR, TEXTURE_COLOR, 1.0F)',
            'setOverlay(OverlayTexture.NO_OVERLAY)',
            'setLight(packedLight)',
            'segmentNormal('
        ].each { requiredVanillaSemantic ->
            if (!adapterSourceText.contains(requiredVanillaSemantic)) {
                throw new GradleException("C3 leash adapter no longer preserves required vanilla semantic ${requiredVanillaSemantic}")
            }
        }
        [
            'PrimitiveTopology.TRIANGLE_STRIP',
            'DefaultVertexFormat.ENTITY',
            'IrisPipelines.assignPipeline',
            'ShaderKey.ENTITIES_SOLID',
            'withCull(false)',
            'withTexture("Sampler0", POLYTONE_LEAD_TEXTURE)',
            'useLightmap()',
            'useOverlay()'
        ].each { requiredC4Semantic ->
            if (!leashRenderTypesSource.getText(StandardCharsets.UTF_8.name()).contains(requiredC4Semantic)) {
                throw new GradleException("C4 leash RenderType is missing required semantic ${requiredC4Semantic}")
            }
        }
        if (adapterSourceText.contains('RenderTypes.entitySolid(') || adapterSourceText.contains('setNormal(0.0F, 1.0F, 0.0F)')) {
            throw new GradleException('C4 regressed to the failed C2 entitySolid route or universal world-up normal')
        }
        ['0.5F * shade', '0.4F * shade', '0.3F * shade', '0.7F : 1.0F'].each { retiredDoubleShadeSemantic ->
            if (adapterSourceText.contains(retiredDoubleShadeSemantic)) {
                throw new GradleException("C4 restored retired textured-leash double shading ${retiredDoubleShadeSemantic}")
            }
        }
    }
}

tasks.register('stageCanaryArtifact', Copy) {
    group = 'distribution'
    description = 'Stages the exact packaged C2 artifact for canonical local retention.'
    dependsOn tasks.named('verifyPolytoneLeashFallback')
    from(packagedJar)
    into(layout.projectDirectory.dir('artifacts'))
}

tasks.named('check') {
    dependsOn tasks.named('verifyPolytoneLeashFallback')
}

java {
    withSourcesJar()
}
