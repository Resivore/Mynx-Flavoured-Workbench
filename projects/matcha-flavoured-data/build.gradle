import java.security.MessageDigest

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def workbenchRoot = providers.gradleProperty('workbench_root')
        .orElse(rootProject.projectDir.parentFile.parentFile.absolutePath)
        .get()

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def matchaArchive = file('upstream/MF_1_12_5_26_2.zip')

processResources {
    from(zipTree(matchaArchive)) {
        into 'resourcepacks/matcha_flavoured_1_12_5'
    }
    doFirst {
        if (MessageDigest.getInstance('SHA-256').digest(matchaArchive.bytes).encodeHex().toString()
                != '966843d0aeb3860479721ef34791a631e62bc225fdaa918dd2ad90c49977e5b4') {
            throw new GradleException('Unexpected Matcha 1.12.5 archive digest')
        }
    }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(AbstractArchiveTask).configureEach {
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def packagedJarTask = tasks.named('jar')

test {
    dependsOn packagedJarTask
    useJUnitPlatform()
    systemProperty 'projectRoot', projectDir.absolutePath
    systemProperty 'workbenchRoot', workbenchRoot
    systemProperty 'packagedJar', packagedJarTask.flatMap { it.archiveFile }.get().asFile.absolutePath
}

java {
    withSourcesJar()
}
