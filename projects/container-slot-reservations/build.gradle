plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

configurations {
    doubleBarrelsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def repositoryRoot = projectDir.toPath().resolve('../..').normalize().toFile()
def occupiedMarkerResource =
        'assets/container_slot_reservations/textures/gui/sprites/occupied_reservation_marker.png'
def occupiedMarkerSource = layout.projectDirectory.file("src/main/resources/${occupiedMarkerResource}")
def occupiedMarkerSha256 =
        'D12D0BE850A742C69795259FDE9A5D9D52E822DF529196445948241B4B199F02'
def doubleBarrelsReferenceJar = new File(
        repositoryRoot,
        "projects/double-barrels/artifacts/${project.double_barrels_tested_jar}"
)
def gitMetadata = repositoryRoot.toPath().resolve('.git')
def worktreeGitDir = java.nio.file.Files.isDirectory(gitMetadata)
        ? gitMetadata
        : java.nio.file.Path.of(java.nio.file.Files.readString(gitMetadata).trim().substring('gitdir: '.length()))
def commonGitDirFile = worktreeGitDir.resolve('commondir')
def commonGitDir = java.nio.file.Files.exists(commonGitDirFile)
        ? worktreeGitDir.resolve(java.nio.file.Files.readString(commonGitDirFile).trim()).normalize()
        : worktreeGitDir
def primaryRepositoryRoot = commonGitDir.parent.toFile()
def canary10ReferenceJar = new File(
        primaryRepositoryRoot,
        'projects/container-slot-reservations/artifacts/container-slot-reservations-0.1.0-canary10.jar'
)
def inventoryExtendedReferenceJar = new File(
        repositoryRoot,
        'projects/trinkets-inventory-extended-compat/artifacts/inventoryextended-1.1.2-mc26.2-trinkets-compat-canary4.jar'
)

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly files(doubleBarrelsReferenceJar)
    doubleBarrelsReference files(doubleBarrelsReferenceJar)
    if (providers.gradleProperty('includeDoubleBarrelsRuntime').isPresent()) {
        runtimeOnly files(doubleBarrelsReferenceJar)
    }

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'container-slot-reservations-fixtures'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def verifyOccupiedReservationMarkerArtifact = tasks.register('verifyOccupiedReservationMarkerArtifact') {
    dependsOn tasks.named('jar')
    inputs.file(occupiedMarkerSource)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })

    doLast {
        def hash = { byte[] bytes ->
            java.util.HexFormat.of().withUpperCase().formatHex(
                    java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
            )
        }
        def sourceBytes = occupiedMarkerSource.asFile.bytes
        if (sourceBytes.length != 1723 || hash(sourceBytes) != occupiedMarkerSha256) {
            throw new GradleException('The source occupied-reservation marker is not the exact supplied PNG')
        }

        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        def archive = new java.util.zip.ZipFile(artifact)
        try {
            def entry = archive.getEntry(occupiedMarkerResource)
            if (entry == null) {
                throw new GradleException("Built artifact is missing ${occupiedMarkerResource}")
            }
            def artifactBytes = archive.getInputStream(entry).withCloseable { it.bytes }
            if (artifactBytes.length != 1723 || hash(artifactBytes) != occupiedMarkerSha256
                    || !java.util.Arrays.equals(sourceBytes, artifactBytes)) {
                throw new GradleException('Built artifact changed the exact occupied-reservation marker bytes')
            }
        } finally {
            archive.close()
        }
    }
}

def verifyReleaseArtifact = tasks.register('verifyReleaseArtifact') {
    dependsOn verifyOccupiedReservationMarkerArtifact
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        if (artifact.name != "container-slot-reservations-${project.version}.jar") {
            throw new GradleException("Unexpected release filename: ${artifact.name}")
        }
        def archive = new java.util.zip.ZipFile(artifact)
        try {
            def entries = archive.entries().toList()
            if (entries.any { it.name.endsWith('.jar') }) {
                throw new GradleException('Release artifact must not contain nested JARs')
            }
            if (entries.any { it.name.startsWith('fuzs/') }) {
                throw new GradleException('Release artifact contains a foreign fuzs class')
            }
            for (def entry : entries.findAll { !it.directory }) {
                byte[] bytes = archive.getInputStream(entry).withCloseable { it.bytes }
                String searchable = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                        .toLowerCase(java.util.Locale.ROOT)
                if (searchable.contains('easyshulkerboxes') || searchable.contains('iteminteractions')
                        || searchable.contains('fuzs/')) {
                    throw new GradleException("Release artifact retains external linkage in ${entry.name}")
                }
            }
            def metadata = new groovy.json.JsonSlurper().parse(
                    archive.getInputStream(archive.getEntry('fabric.mod.json')))
            if (metadata.id != 'container_slot_reservations' || metadata.version != project.version.toString()) {
                throw new GradleException('Release Fabric identity does not match the declared Canary')
            }
            if (metadata.suggests?.containsKey('easyshulkerboxes')
                    || metadata.suggests?.containsKey('iteminteractions')) {
                throw new GradleException('Release metadata retains a retired external suggestion')
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named('check') {
    dependsOn verifyReleaseArtifact
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    dependsOn tasks.named('jar')
    useJUnitPlatform()
    systemProperty 'projectRoot', projectDir.absolutePath
    systemProperty 'doubleBarrelsReferenceJar', doubleBarrelsReferenceJar.absolutePath
    systemProperty 'canary10ReferenceJar', canary10ReferenceJar.absolutePath
    systemProperty 'canary11Artifact', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'inventoryExtendedReferenceJar', inventoryExtendedReferenceJar.absolutePath
    inputs.file(doubleBarrelsReferenceJar)
    inputs.file(canary10ReferenceJar)
    inputs.file(inventoryExtendedReferenceJar)
}

java {
    withSourcesJar()
}
