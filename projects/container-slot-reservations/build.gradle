plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

configurations {
    doubleBarrelsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def repositoryRoot = projectDir.toPath().resolve('../..').normalize().toFile()
def occupiedMarkerResource =
        'assets/container_slot_reservations/textures/gui/sprites/occupied_reservation_marker.png'
def occupiedMarkerSource = layout.projectDirectory.file("src/main/resources/${occupiedMarkerResource}")
def occupiedMarkerSha256 =
        'D12D0BE850A742C69795259FDE9A5D9D52E822DF529196445948241B4B199F02'
def doubleBarrelsReferenceJar = new File(
        repositoryRoot,
        "projects/double-barrels/artifacts/${project.double_barrels_tested_jar}"
)

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly files(doubleBarrelsReferenceJar)
    doubleBarrelsReference files(doubleBarrelsReferenceJar)
    if (providers.gradleProperty('includeDoubleBarrelsRuntime').isPresent()) {
        runtimeOnly files(doubleBarrelsReferenceJar)
    }

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'container-slot-reservations-fixtures'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def verifyOccupiedReservationMarkerArtifact = tasks.register('verifyOccupiedReservationMarkerArtifact') {
    dependsOn tasks.named('jar')
    inputs.file(occupiedMarkerSource)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })

    doLast {
        def hash = { byte[] bytes ->
            java.util.HexFormat.of().withUpperCase().formatHex(
                    java.security.MessageDigest.getInstance('SHA-256').digest(bytes)
            )
        }
        def sourceBytes = occupiedMarkerSource.asFile.bytes
        if (sourceBytes.length != 1723 || hash(sourceBytes) != occupiedMarkerSha256) {
            throw new GradleException('The source occupied-reservation marker is not the exact supplied PNG')
        }

        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        def archive = new java.util.zip.ZipFile(artifact)
        try {
            def entry = archive.getEntry(occupiedMarkerResource)
            if (entry == null) {
                throw new GradleException("Built artifact is missing ${occupiedMarkerResource}")
            }
            def artifactBytes = archive.getInputStream(entry).withCloseable { it.bytes }
            if (artifactBytes.length != 1723 || hash(artifactBytes) != occupiedMarkerSha256
                    || !java.util.Arrays.equals(sourceBytes, artifactBytes)) {
                throw new GradleException('Built artifact changed the exact occupied-reservation marker bytes')
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named('check') {
    dependsOn verifyOccupiedReservationMarkerArtifact
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
    systemProperty 'projectRoot', projectDir.absolutePath

    def testedArtifactName = project.property('easy_shulker_boxes_tested_jar').toString()
    def candidates = []
    def configuredArtifact = providers.gradleProperty('easyShulkerBoxesJar')
            .orElse(providers.environmentVariable('EASY_SHULKER_BOXES_JAR'))
            .orNull
    if (configuredArtifact != null && !configuredArtifact.isBlank()) {
        candidates.add(file(configuredArtifact))
    }
    candidates.add(new File(repositoryRoot, "originals/mods/${testedArtifactName}"))

    def gitMarker = new File(repositoryRoot, '.git')
    if (gitMarker.isFile()) {
        def markerText = gitMarker.getText('UTF-8').trim()
        if (markerText.startsWith('gitdir:')) {
            def worktreeGitDir = new File(markerText.substring('gitdir:'.length()).trim())
            if (!worktreeGitDir.isAbsolute()) {
                worktreeGitDir = new File(repositoryRoot, worktreeGitDir.path)
            }
            def commonGitDir = worktreeGitDir.parentFile?.name == 'worktrees'
                    ? worktreeGitDir.parentFile.parentFile
                    : worktreeGitDir
            if (commonGitDir != null) {
                candidates.add(new File(commonGitDir.parentFile, "originals/mods/${testedArtifactName}"))
            }
        }
    }

    def testedArtifact = candidates.find { it.isFile() }
    systemProperty 'easyShulkerBoxesJar', testedArtifact == null ? '' : testedArtifact.absolutePath
    systemProperty 'doubleBarrelsReferenceJar', doubleBarrelsReferenceJar.absolutePath
    inputs.file(doubleBarrelsReferenceJar)
    if (testedArtifact != null) {
        inputs.file(testedArtifact)
    }
}

java {
    withSourcesJar()
}

// Offline Mixin application followed by a headless deterministic client lifecycle fixture.
// Optional upstream bytes are read from the exact audited reference, never packaged.
def tooltipReference = layout.buildDirectory.file('tooltip-lifecycle/reference/iteminteractions.jar')
def extractTooltipReference = tasks.register('extractTooltipReference') {
    doLast {
        def outer = file(tasks.named('test').get().systemProperties['easyShulkerBoxesJar'])
        def zip = new java.util.zip.ZipFile(outer)
        try {
            def target = tooltipReference.get().asFile
            target.parentFile.mkdirs()
            target.bytes = zip.getInputStream(zip.getEntry(project.item_interactions_tested_entry)).bytes
        } finally { zip.close() }
    }
}
sourceSets {
    tooltipTransform {
        compileClasspath += sourceSets.test.compileClasspath
        runtimeClasspath += sourceSets.test.runtimeClasspath
    }
    tooltipLifecycle {
        compileClasspath += sourceSets.test.compileClasspath + files(tooltipReference)
        runtimeClasspath += sourceSets.test.runtimeClasspath + files(tooltipReference)
    }
}
tasks.named('compileTooltipLifecycleJava') { dependsOn extractTooltipReference }
dependencies {
    tooltipTransformImplementation 'net.fabricmc:class-tweaker:0.3.0-beta.2'
    tooltipLifecycleImplementation files(providers.gradleProperty('puzzlesLibJar').getOrElse(
            '../../originals/mods/PuzzlesLib-v26.2.3-mc26.2.x-Fabric.jar'))
}
def tooltipProvider = providers.gradleProperty('tooltipProviderJar')
def transformedTooltipClasses = layout.buildDirectory.dir('tooltip-lifecycle/transformed' + (tooltipProvider.isPresent() ? '-predecessor' : ''))
def transformTooltipMixins = tasks.register('transformTooltipMixins', JavaExec) {
    dependsOn tasks.named('tooltipTransformClasses'), tasks.named('classes'), extractTooltipReference
    classpath = (tooltipProvider.isPresent() ? files(tooltipProvider.get()) : files()) + sourceSets.tooltipTransform.runtimeClasspath + files(tooltipReference)
    mainClass = 'dev.resivore.slotreservations.fixture.TransformTooltipMixins'
    systemProperty 'mixin.service', 'dev.resivore.slotreservations.fixture.TooltipMixinService'
    systemProperty 'mixin.service.boot', 'dev.resivore.slotreservations.fixture.TooltipMixinService'
    systemProperty 'mixin.env.remapRefMap', 'false'
    systemProperty 'puzzlesLibJar', providers.gradleProperty('puzzlesLibJar').getOrElse(
            '../../originals/mods/PuzzlesLib-v26.2.3-mc26.2.x-Fabric.jar')
    args transformedTooltipClasses.get().asFile.absolutePath
    if (tooltipProvider.isPresent()) args 'predecessor'
}
tasks.register('tooltipLifecycleTest', Test) {
    dependsOn transformTooltipMixins, tasks.named('tooltipLifecycleClasses')
    testClassesDirs = sourceSets.tooltipLifecycle.output.classesDirs
    classpath = files(transformedTooltipClasses) + sourceSets.tooltipLifecycle.output +
            (tooltipProvider.isPresent() ? files(tooltipProvider.get()) : files()) + sourceSets.tooltipLifecycle.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'projectRoot', projectDir.absolutePath
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    systemProperty 'sodiumConsoleJar', providers.gradleProperty('sodiumConsoleJar').getOrElse('')
}
