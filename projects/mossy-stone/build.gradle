plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

configurations {
    cnmReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    jeiReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    cnmReference files('../../originals/mods/clutternomore-2.0.7+26.2-fabric.jar')
    jeiReference files('../../originals/mods/jei-26.2-fabric-30.18.0.144.jar')
    compileOnly files('../../originals/mods/jei-26.2-fabric-30.18.0.144.jar')

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
    inputs.files(configurations.cnmReference, configurations.jeiReference)
    systemProperty 'projectRoot', projectDir.absolutePath
    doFirst {
        systemProperty 'cnmReferenceJar', configurations.cnmReference.singleFile.absolutePath
        systemProperty 'jeiReferenceJar', configurations.jeiReference.singleFile.absolutePath
    }
}

java {
    withSourcesJar()
}
