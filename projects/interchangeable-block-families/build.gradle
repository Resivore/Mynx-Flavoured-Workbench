plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

configurations {
    cnmUpstreamReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    macawsDoorsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    macawsPathsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    macawsTrapdoorsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    macawsWindowsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    dramaticDoorsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    nibaruReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    cnmIntegrationReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    qsnReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    qsnCompatReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def referenceJar = { String propertyName, String defaultPath ->
    def configuredPath = providers.gradleProperty(propertyName).getOrNull()
    file(configuredPath ?: defaultPath)
}

def cnmReferenceJar = referenceJar(
        'cnm_reference_jar',
        '../../originals/mods/clutternomore-2.0.7+26.2-fabric.jar')
def dramaticDoorsReferenceJar = referenceJar(
        'dramatic_doors_reference_jar',
        '../dramatic-doors/artifacts/dramaticdoors-1.20.1-3.3.3+26.2-workbench-canary6.jar')
def nibaruReferenceJar = referenceJar(
        'nibaru_reference_jar',
        '../nibaru/artifacts/more-slabs-stairs-and-walls-4.2.0+26.2-port-canary43-native-directional-material-axis.jar')
def cnmIntegrationReferenceJar = referenceJar(
        'cnm_integration_reference_jar',
        '../block-geometry-extensions/artifacts/cnm-nibaru-integration-0.5.49-nibaru-cnm-canary1.39-native-directional-material-axis.jar')
def qsnReferenceJar = referenceJar(
        'qsn_reference_jar',
        '../../originals/mods/quick-stack-nearby-0.4.0.jar')
def qsnCompatReferenceJar = referenceJar(
        'qsn_compat_reference_jar',
        '../../originals/mods/quick-stack-nearby-compat-0.1.0-canary6.jar')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly files(cnmReferenceJar)
    runtimeOnly files(cnmReferenceJar)
    cnmUpstreamReference files(cnmReferenceJar)

    runtimeOnly("curse.maven:macaws-doors-378646:${project.macaws_doors_curse_file}") {
        transitive = false
    }
    macawsDoorsReference("curse.maven:macaws-doors-378646:${project.macaws_doors_curse_file}") {
        transitive = false
    }

    runtimeOnly("maven.modrinth:${project.macaws_paths_project}:${project.macaws_paths_version}") {
        transitive = false
    }
    macawsPathsReference("maven.modrinth:${project.macaws_paths_project}:${project.macaws_paths_version}") {
        transitive = false
    }

    runtimeOnly("maven.modrinth:${project.macaws_trapdoors_project}:${project.macaws_trapdoors_version}") {
        transitive = false
    }
    macawsTrapdoorsReference("maven.modrinth:${project.macaws_trapdoors_project}:${project.macaws_trapdoors_version}") {
        transitive = false
    }

    runtimeOnly("maven.modrinth:${project.macaws_windows_project}:${project.macaws_windows_version}") {
        transitive = false
    }
    macawsWindowsReference("maven.modrinth:${project.macaws_windows_project}:${project.macaws_windows_version}") {
        transitive = false
    }

    runtimeOnly files(dramaticDoorsReferenceJar)
    dramaticDoorsReference files(dramaticDoorsReferenceJar)

    runtimeOnly files(nibaruReferenceJar)
    runtimeOnly files(cnmIntegrationReferenceJar)
    nibaruReference files(nibaruReferenceJar)
    cnmIntegrationReference files(cnmIntegrationReferenceJar)

    runtimeOnly files(qsnReferenceJar)
    runtimeOnly files(qsnCompatReferenceJar)
    qsnReference files(qsnReferenceJar)
    qsnCompatReference files(qsnCompatReferenceJar)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'interchangeable-block-families-runtime-tests'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
    inputs.files(
            configurations.cnmUpstreamReference,
            configurations.macawsDoorsReference,
            configurations.macawsPathsReference,
            configurations.macawsTrapdoorsReference,
            configurations.macawsWindowsReference,
            configurations.dramaticDoorsReference,
            configurations.nibaruReference,
            configurations.cnmIntegrationReference,
            configurations.qsnReference,
            configurations.qsnCompatReference
    )
    systemProperty 'projectRoot', projectDir.absolutePath
    doFirst {
        systemProperty 'cnmUpstreamReferenceJar', configurations.cnmUpstreamReference.singleFile.absolutePath
        systemProperty 'macawsDoorsReferenceJar', configurations.macawsDoorsReference.singleFile.absolutePath
        systemProperty 'macawsPathsReferenceJar', configurations.macawsPathsReference.singleFile.absolutePath
        systemProperty 'macawsTrapdoorsReferenceJar', configurations.macawsTrapdoorsReference.singleFile.absolutePath
        systemProperty 'macawsWindowsReferenceJar', configurations.macawsWindowsReference.singleFile.absolutePath
        systemProperty 'dramaticDoorsReferenceJar', configurations.dramaticDoorsReference.singleFile.absolutePath
        systemProperty 'nibaruReferenceJar', configurations.nibaruReference.singleFile.absolutePath
        systemProperty 'cnmIntegrationReferenceJar', configurations.cnmIntegrationReference.singleFile.absolutePath
        systemProperty 'qsnReferenceJar', configurations.qsnReference.singleFile.absolutePath
        systemProperty 'qsnCompatReferenceJar', configurations.qsnCompatReference.singleFile.absolutePath
    }
}

java {
    withSourcesJar()
}
