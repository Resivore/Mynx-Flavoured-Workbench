plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

configurations {
    cnmUpstreamReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    macawsDoorsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    macawsPathsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    aurorasLanternsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    ribbitsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    bbbReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    enderscapeReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    lithostitchedReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    trimPatcherReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    yaclReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    macawsTrapdoorsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    macawsWindowsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    dramaticDoorsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    nibaruReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    cnmIntegrationReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    qsnReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    qsnCompatReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    amcReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
