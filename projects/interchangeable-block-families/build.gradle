def referenceJar = { String propertyName, String defaultPath ->
    def configuredPath = providers.gradleProperty(propertyName).getOrNull()
    file(configuredPath ?: defaultPath)
}

def cnmReferenceJar = referenceJar(
        'cnm_reference_jar',
        '../../originals/mods/clutternomore-2.0.7+26.2-fabric.jar')
def dramaticDoorsReferenceJar = referenceJar(
        'dramatic_doors_reference_jar',
        '../dramatic-doors/artifacts/dramaticdoors-1.20.1-3.3.3+26.2-workbench-canary8.jar')
def nibaruReferenceJar = referenceJar(
        'nibaru_reference_jar',
        '../nibaru/artifacts/more-slabs-stairs-and-walls-4.2.0+26.2-port-canary43-native-directional-material-axis.jar')
def cnmIntegrationReferenceJar = referenceJar(
        'cnm_integration_reference_jar',
        '../block-geometry-extensions/artifacts/cnm-nibaru-integration-0.5.49-nibaru-cnm-canary1.39-native-directional-material-axis.jar')
def qsnReferenceJar = referenceJar(
        'qsn_reference_jar',
        '../../originals/mods/quick-stack-nearby-0.4.0.jar')
def qsnCompatReferenceJar = referenceJar(
        'qsn_compat_reference_jar',
        '../quick-stack-nearby-compat/artifacts/quick-stack-nearby-compat-0.1.0-canary6.jar')
def amcReferenceJar = referenceJar(
        'amc_reference_jar',
        '../architectural-material-closure/artifacts/architectural-material-closure-0.1.0-canary1.jar')
def aurorasLanternsReferenceJar = referenceJar(
        'auroras_lanterns_reference_jar',
        '../../originals/mods/auroraslanterns-2.1.1+26.2.jar')
def ribbitsReferenceJar = referenceJar(
        'ribbits_reference_jar',
        '../ribbits-26.2/artifacts/ribbits-private-reconstruction-4.1.6+26.2-mynx-canary17.jar')
def bbbReferenceJar = referenceJar(
        'bbb_reference_jar',
        '../building-but-better/artifacts/bbb-fabric-26.2-2.0pre4+26.2-enderscape-dev.7.jar')
def enderscapeReferenceJar = referenceJar(
        'enderscape_reference_jar',
        '../../originals/mods/enderscape-fabric-3.0.2+mc26.2.jar')
def minecraftReferenceJar = new File(
        gradle.gradleUserHomeDir,
        "caches/fabric-loom/${project.minecraft_version}/minecraft-merged.jar")
def ribbitsRuntimeReferenceJars = providers.gradleProperty('ribbits_runtime_reference_jars')
        .map { value -> value.split(';').collect { path -> file(path) } }
        .orElse([])
def matchaFoodResourceRoot = providers.gradleProperty('matcha_food_resource_root')
        .map { path -> file(path) }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly files(cnmReferenceJar)
    runtimeOnly files(cnmReferenceJar)
    cnmUpstreamReference files(cnmReferenceJar)

    runtimeOnly("curse.maven:macaws-doors-378646:${project.macaws_doors_curse_file}") {
        transitive = false
    }
    macawsDoorsReference("curse.maven:macaws-doors-378646:${project.macaws_doors_curse_file}") {
        transitive = false
    }

    runtimeOnly("maven.modrinth:${project.macaws_paths_project}:${project.macaws_paths_version}") {
        transitive = false
    }
    macawsPathsReference("maven.modrinth:${project.macaws_paths_project}:${project.macaws_paths_version}") {
        transitive = false
    }

    runtimeOnly files(aurorasLanternsReferenceJar)
    aurorasLanternsReference files(aurorasLanternsReferenceJar)

    runtimeOnly files(ribbitsReferenceJar)
    ribbitsReference files(ribbitsReferenceJar)

    // BBB is a provider-only runtime input. It is not bundled in IBF.
    runtimeOnly files(bbbReferenceJar)
    bbbReference files(bbbReferenceJar)

    // Enderscape is a literal inventory-item provider. Its exact local JAR is
    // audited directly and remains an external runtime input, never bundled.
    runtimeOnly files(enderscapeReferenceJar)
    enderscapeReference files(enderscapeReferenceJar)

    // Exact controlled-validation providers required by Enderscape 3.0.2.
    // These are test/runtime support and are not direct packaged IBF dependencies.
    runtimeOnly("maven.modrinth:XaDC71GB:vVFCOh7u") { transitive = false }
    lithostitchedReference("maven.modrinth:XaDC71GB:vVFCOh7u") { transitive = false }
    runtimeOnly("curse.maven:trim-patcher-1414986:8574012") { transitive = false }
    trimPatcherReference("curse.maven:trim-patcher-1414986:8574012") { transitive = false }
    runtimeOnly files(ribbitsRuntimeReferenceJars)

    // Ribbits' provider runtime requires YACL. This is test/runtime support only;
    // it is neither bundled by nor a functional dependency of IBF itself.
    runtimeOnly("maven.modrinth:1eAoo2KR:cnfPzuFU") {
        transitive = false
    }
    yaclReference("maven.modrinth:1eAoo2KR:cnfPzuFU") {
        transitive = false
    }

    runtimeOnly("maven.modrinth:${project.macaws_trapdoors_project}:${project.macaws_trapdoors_version}") {
        transitive = false
    }
    macawsTrapdoorsReference("maven.modrinth:${project.macaws_trapdoors_project}:${project.macaws_trapdoors_version}") {
        transitive = false
    }

    runtimeOnly("maven.modrinth:${project.macaws_windows_project}:${project.macaws_windows_version}") {
        transitive = false
    }
    macawsWindowsReference("maven.modrinth:${project.macaws_windows_project}:${project.macaws_windows_version}") {
        transitive = false
    }

    runtimeOnly files(dramaticDoorsReferenceJar)
    dramaticDoorsReference files(dramaticDoorsReferenceJar)

    runtimeOnly files(nibaruReferenceJar)
    runtimeOnly files(cnmIntegrationReferenceJar)
    nibaruReference files(nibaruReferenceJar)
    cnmIntegrationReference files(cnmIntegrationReferenceJar)

    runtimeOnly files(qsnReferenceJar)
    runtimeOnly files(qsnCompatReferenceJar)
    qsnReference files(qsnReferenceJar)
    qsnCompatReference files(qsnCompatReferenceJar)

    // AMC C1 is a literal audited item provider. It remains external and is
    // never bundled in IBF's production artifact.
    runtimeOnly files(amcReferenceJar)
    amcReference files(amcReferenceJar)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'interchangeable-block-families-runtime-tests'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

loom.runs.named('gameTest') {
    // Providers remain loaded so IBF exercises their live registrations. Limit
    // execution to the IBF suite rather than treating an upstream provider's
    // own GameTest failures as failures of this project.
    vmArg '-Dfabric-api.gametest.filter=interchangeable-block-families-runtime-tests:*'
}

// Ribbits validates its owned trade recipes at server startup. The optional
// input is test-only: it mounts the canonical Matcha data dependencies in the
// GameTest test mod without bundling them in IBF's production artifact.
tasks.named('processGametestResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    if (matchaFoodResourceRoot.isPresent()) {
        from(matchaFoodResourceRoot) {
            include 'data/**'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
    inputs.files(
            configurations.cnmUpstreamReference,
            configurations.macawsDoorsReference,
            configurations.macawsPathsReference,
            configurations.aurorasLanternsReference,
            configurations.ribbitsReference,
            configurations.bbbReference,
            configurations.enderscapeReference,
            configurations.lithostitchedReference,
            configurations.trimPatcherReference,
            configurations.yaclReference,
            configurations.macawsTrapdoorsReference,
            configurations.macawsWindowsReference,
            configurations.dramaticDoorsReference,
            configurations.nibaruReference,
            configurations.cnmIntegrationReference,
            configurations.qsnReference,
            configurations.qsnCompatReference,
            configurations.amcReference,
            minecraftReferenceJar
    )
    systemProperty 'projectRoot', projectDir.absolutePath
    doFirst {
        systemProperty 'cnmUpstreamReferenceJar', configurations.cnmUpstreamReference.singleFile.absolutePath
        systemProperty 'macawsDoorsReferenceJar', configurations.macawsDoorsReference.singleFile.absolutePath
        systemProperty 'macawsPathsReferenceJar', configurations.macawsPathsReference.singleFile.absolutePath
        systemProperty 'aurorasLanternsReferenceJar', configurations.aurorasLanternsReference.singleFile.absolutePath
        systemProperty 'ribbitsReferenceJar', configurations.ribbitsReference.singleFile.absolutePath
        systemProperty 'bbbReferenceJar', configurations.bbbReference.singleFile.absolutePath
        systemProperty 'enderscapeReferenceJar', configurations.enderscapeReference.singleFile.absolutePath
        systemProperty 'lithostitchedReferenceJar', configurations.lithostitchedReference.singleFile.absolutePath
        systemProperty 'trimPatcherReferenceJar', configurations.trimPatcherReference.singleFile.absolutePath
        systemProperty 'minecraftReferenceJar', minecraftReferenceJar.absolutePath
        systemProperty 'yaclReferenceJar', configurations.yaclReference.singleFile.absolutePath
        systemProperty 'macawsTrapdoorsReferenceJar', configurations.macawsTrapdoorsReference.singleFile.absolutePath
        systemProperty 'macawsWindowsReferenceJar', configurations.macawsWindowsReference.singleFile.absolutePath
        systemProperty 'dramaticDoorsReferenceJar', configurations.dramaticDoorsReference.singleFile.absolutePath
        systemProperty 'nibaruReferenceJar', configurations.nibaruReference.singleFile.absolutePath
        systemProperty 'cnmIntegrationReferenceJar', configurations.cnmIntegrationReference.singleFile.absolutePath
        systemProperty 'qsnReferenceJar', configurations.qsnReference.singleFile.absolutePath
        systemProperty 'qsnCompatReferenceJar', configurations.qsnCompatReference.singleFile.absolutePath
        systemProperty 'amcReferenceJar', configurations.amcReference.singleFile.absolutePath
    }
}

java {
    withSourcesJar()
}

tasks.register('verifyProductionJarIsolation') {
    group = 'verification'
    description = 'Verifies the production JAR contains only IBF production classes.'
    dependsOn 'jar'
    inputs.files { tasks.getByName('jar').archiveFile.get().asFile }

    doLast {
        def archivePath = tasks.getByName('jar').archiveFile.get().asFile
        def archive = new java.util.zip.ZipFile(archivePath)
        try {
            def foreignClasses = archive.entries().findAll { entry ->
                entry.name.endsWith('.class') && (
                        !entry.name.startsWith('dev/resivore/blockfamilies/')
                                || entry.name.contains('/gametest/'))
            }.collect { it.name }.sort()
            if (!foreignClasses.isEmpty()) {
                throw new GradleException("Production JAR contains provider or GameTest classes: ${foreignClasses}")
            }

            def nestedJars = archive.entries().findAll { entry ->
                !entry.directory && entry.name.toLowerCase(java.util.Locale.ROOT).endsWith('.jar')
            }.collect { it.name }.sort()
            if (!nestedJars.isEmpty()) {
                throw new GradleException("Production JAR contains nested provider archives: ${nestedJars}")
            }

            def forbiddenPrefixes = [
                    'net/penumbra/enderscape/',
                    'dev/tazer/clutternomore/',
                    'com/starfish_studios/bbb/',
                    'net/minecraft/',
                    'dev/resivore/blockfamilies/gametest/'
            ]
            forbiddenPrefixes.each { prefix ->
                if (archive.entries().any { entry -> entry.name.endsWith('.class') && entry.name.startsWith(prefix) }) {
                    throw new GradleException("Production JAR bundles forbidden classes under ${prefix}")
                }
            }
        } finally {
            archive.close()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyProductionJarIsolation')
}

tasks.register('stageCanaryArtifact', Copy) {
    group = 'distribution'
    description = 'Stages the verified current canary JAR for local retention.'
    dependsOn tasks.named('verifyProductionJarIsolation')
    from { tasks.getByName('jar').archiveFile.get().asFile }
    into(layout.projectDirectory.dir('artifacts'))
}
