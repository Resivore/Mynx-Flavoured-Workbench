plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

configurations {
    bgeReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    cnmUpstreamReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    terrainSlabsReference {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def workbenchRoot = providers.gradleProperty('workbench_root')
        .orElse(rootProject.projectDir.parentFile.parentFile.absolutePath)
        .get()
def referenceLibraryRoot = providers.gradleProperty('reference_library_root')
        .orElse(workbenchRoot)
        .get()
def bgeReferenceJar = new File(workbenchRoot, 'projects/block-geometry-extensions/artifacts/cnm-nibaru-integration-4.2.16-bge.canary72.farmland-slab-low-water+26.2.jar')
def cnmUpstreamReferenceJar = new File(referenceLibraryRoot, 'originals/mods/clutternomore-2.0.7+26.2-fabric.jar')
def terrainSlabsReferenceJar = new File(providers.gradleProperty('terrain_slabs_reference_jar')
        .orElse(new File(referenceLibraryRoot, 'originals/mods/Terrain Slabs v3.3.2-26.2.jar').absolutePath)
        .get())
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly files(bgeReferenceJar)
    runtimeOnly files(bgeReferenceJar)

    // This is an isolated-fixture runtime input only. Main code consumes no CNM implementation API.
    runtimeOnly files(cnmUpstreamReferenceJar)

    bgeReference files(bgeReferenceJar)
    cnmUpstreamReference files(cnmUpstreamReferenceJar)
    terrainSlabsReference files(terrainSlabsReferenceJar)

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'slab-decorations-fixtures'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
    inputs.files(
            configurations.bgeReference,
            configurations.cnmUpstreamReference,
            configurations.terrainSlabsReference
    )
    doFirst {
        systemProperty 'bgeReferenceJar', configurations.bgeReference.singleFile.absolutePath
        systemProperty 'cnmUpstreamReferenceJar', configurations.cnmUpstreamReference.singleFile.absolutePath
        systemProperty 'terrainSlabsReferenceJar', configurations.terrainSlabsReference.singleFile.absolutePath
    }
}

java {
    withSourcesJar()
}
