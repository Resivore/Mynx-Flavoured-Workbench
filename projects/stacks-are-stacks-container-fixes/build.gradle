plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

configurations {
    upstreamAudit {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    csrAudit {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def csrReferenceJar = file(
        '../container-slot-reservations/artifacts/container-slot-reservations-0.1.0-canary5.jar')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    upstreamAudit "maven.modrinth:Pg1TxNQ1:${project.stacks_are_stacks_version_id}"
    csrAudit files(csrReferenceJar)
    testImplementation files(csrReferenceJar)

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
    inputs.file(csrReferenceJar)
    doFirst {
        systemProperty 'stacksAreStacksJar', configurations.upstreamAudit.singleFile.absolutePath
        systemProperty 'csrJar', configurations.csrAudit.singleFile.absolutePath
    }
}

java {
    withSourcesJar()
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
