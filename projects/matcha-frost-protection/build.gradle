plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def workbenchRoot = providers.gradleProperty('workbench_root')
        .orElse(rootProject.projectDir.parentFile.parentFile.absolutePath)
        .get()

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
}

test {
    useJUnitPlatform()
    systemProperty 'projectRoot', projectDir.absolutePath
    systemProperty 'workbenchRoot', workbenchRoot
}

java {
    withSourcesJar()
}
