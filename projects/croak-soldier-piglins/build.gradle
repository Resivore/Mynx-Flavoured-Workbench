plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}
group = 'dev.resivore'
version = '0.1.0+26.2-canary2'
repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    mavenCentral()
}
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    if (providers.gradleProperty('geckolibJar').isPresent()) {
        compileOnly files(providers.gradleProperty('geckolibJar').get())
    } else {
        compileOnly 'com.geckolib:geckolib-fabric-26.2:5.5.1'
    }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

configurations.testImplementation.extendsFrom(configurations.compileOnly)
def soldierBake = {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.resivore.croak.SoldierBakeCheck'
    systemProperty 'croakSoldier.referenceJar', providers.gradleProperty('croaksJar')
        .getOrElse(file('../../originals/mods/croaks-2.0.0-neoforge-1.21.1.jar').absolutePath)
    workingDir = layout.buildDirectory.get().asFile
}
tasks.register('checkSoldierBake', JavaExec, soldierBake)
tasks.register('preparePrivateAssets', JavaExec) {
    configure(soldierBake)
    args layout.buildDirectory.dir('private-resources').get().asFile.absolutePath
}
check.dependsOn checkSoldierBake

tasks.named('test') {
    // The fixture is an executable off-game check, run through checkSoldierBake.
    failOnNoDiscoveredTests = false
}
tasks.register('checkSoldierArchive') {
    dependsOn jar
    doLast {
        new java.util.zip.ZipFile(jar.archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.directory && !(entry.name in ['META-INF/MANIFEST.MF', 'fabric.mod.json', 'croak-soldier.mixins.json']
                        || (entry.name.startsWith('dev/resivore/croak/') && entry.name.endsWith('.class')))) {
                    throw new GradleException("Unexpected packaged entry: " + entry.name)
                }
            }
        }
    }
}
check.dependsOn checkSoldierArchive

// Supply the matching client libraries for an off-game production Fabric transformation test.
tasks.register('checkProductionReload', JavaExec) {
    dependsOn testClasses, jar
    def mc = new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/26.2/minecraft-client.jar')
    def mods = [file(providers.gradleProperty('geckolibJar').get())]
    for (name in ['fabricApiJar','emfJar','etfJar']) mods.add(file(providers.gradleProperty(name).get()))
    def privateMode = providers.gradleProperty('privateCandidate').isPresent()
    if (privateMode) dependsOn 'privateTestJar'
    def archiveTask = privateMode ? tasks.named('privateTestJar').get() : jar
    def candidate = file(providers.gradleProperty('candidateJar').getOrElse(archiveTask.archiveFile.get().asFile.absolutePath))
    mods.add(candidate)
    args privateMode ? candidate.absolutePath : ''
    classpath = files(sourceSets.test.output.classesDirs, configurations.testRuntimeClasspath.filter {
        !it.name.startsWith('minecraft-merged-deobf') && !mods.contains(it)
    }, mc, mods)
    mainClass = 'dev.resivore.croak.ProductionReloadCheck'
    workingDir = layout.buildDirectory.dir('reload-check')
    doFirst { workingDir.mkdirs() }
    systemProperty 'fabric.unitTest', 'true'
    systemProperty 'fabric.gameJarPath', mc.absolutePath
    systemProperty 'fabric.addMods', mods*.absolutePath.join(File.pathSeparator)
    systemProperty 'mixin.debug.countInjections', 'true'
    systemProperty 'croakSoldier.referenceJar', providers.gradleProperty('croaksJar')
        .getOrElse(file('../../originals/mods/croaks-2.0.0-neoforge-1.21.1.jar').absolutePath)
}

tasks.register('privateTestJar', Jar) {
    dependsOn preparePrivateAssets, checkSoldierArchive
    archiveClassifier = 'private'
    from(sourceSets.main.output)
    from(layout.buildDirectory.dir('private-resources')) {
        include 'assets/croak_soldier_piglins/geckolib/models/soldier.geo.json',
            'assets/croak_soldier_piglins/geckolib/animations/soldier.animation.json',
            'assets/croak_soldier_piglins/textures/entity/soldier.png'
    }
    from('notices/Croaks.txt') { into 'META-INF/notices' }
}
